 and **Issue Date** are on this tab too.","src":"apps/web/src/routes/_next/lading/create.tsx:1203"},{"action":"Set **Owning Branch *** and press **Create Bill of Lading**","detail":"Toast: **Bill of Lading created**.","src":"apps/web/src/routes/_next/lading/create.tsx:1456"}],"fields":[{"label":"Bill No","required":true,"note":"e.g. BOL-2026-0001"},{"label":"Owning Branch","required":true,"note":"Scopes the record"},{"label":"Container No (per container row)","required":true,"note":""},{"label":"Linked order","required":false,"note":"Received, not-archived orders only; a pick fills blank fields from the order"},{"label":"Order No","required":false,"note":"Free text, exact-match"},{"label":"Sales / Operator / Service / Associated / Document / Commercial / Related Second Person","required":false,"note":"Linked members. Agent is a free-text field, not a member link"}],"writes":["A lading record with its containers, parties and desk roles; the order link when one is chosen"],"result":"The B/L exists. Move it through its states — **step 17**.","pitfalls":["**Raise bill of lading** appears only on a received, not-archived order. Opened for any other order, the form says a bill of lading cannot be raised from it and leaves the bill unlinked.","OCR pre-fills; it does not verify. Check every field against the scan."],"shots":[{"file":"customer-intake-sop/shots/step-16.jpg","caption":"New Bill of Lading, with OCR import","path":"/lading/create"}]},{"n":17,"role":"Documentation · needs lading:read plus the gate for each verb","routes":[{"path":"/lading","label":"Shipment ledger"},{"path":"/lading/$id","label":"One bill of lading"}],"navigate":"Left rail → **Shipment** → open the bill","before":["The bill exists (step 16)."],"golden":[{"action":"Open the bill from **Shipment**","detail":"The toolbar shows one button per state, reading the action available right now — a checked-in bill offers **Cancel Check In** and nothing else.","src":"apps/web/src/routes/_next/lading/$id/index.tsx:175"},{"action":"Press **Check In** when the bill is endorsed","detail":"Toast: **Checked in**. Reverse with **Cancel Check In** (**Check in cancelled**).","src":"apps/web/src/routes/_next/lading/$id/index.tsx:389"},{"action":"Press **Amend** to record a correction","detail":"Toast: **Amended**; reverse with **Cancel Amend** (**Amendment cancelled**).","src":"apps/web/src/routes/_next/lading/$id/index.tsx:209"},{"action":"Press **Check Out** on release","detail":"Toast: **Checked out**; reverse with **Cancel Check Out**. A bill on hold is refused (**On hold — release the hold before checking out**): press **Cancel Hold** first.","src":"apps/web/src/routes/_next/lading/$id/index.tsx:399"},{"action":"Press **Hold** for a detention","detail":"The **Put on hold** dialog asks for a **Reason (optional)**, shown on the bill beside the hold. Toast: **Put on hold**; release it with **Cancel Hold** (**Hold released**).","src":"apps/web/src/routes/_next/lading/$id/index.tsx:223"},{"action":"Record the paperwork as attachments on the bill","detail":"Scans upload against the lading record itself. While the bill is under review you can still upload, but not remove one.","src":"apps/web/src/routes/_next/lading/$id/index.tsx:488"},{"action":"Use **Excel** or **PDF** in the toolbar to export the bill","detail":"Toast: **Exported \u003cfilename>**.","src":"apps/web/src/routes/_next/lading/$id/index.tsx:246"},{"action":"Add per-state notes in **Checked-In Remark** and **Checked-Out Remark** on the record","src":"apps/web/src/routes/_next/lading/create.tsx:1426"},{"action":"When the bill is ready for sign-off, open **Review** and choose **Submit for review**","detail":"While it is under review the page reads **Under review. Request withdrawal from the Review menu to make changes.** and **Save Changes** on the edit form is disabled. To change it, choose **Request withdrawal** first.","src":"apps/web/src/routes/_next/lading/$id/index.tsx:453"}],"fields":[{"label":"Checked-In Remark / Checked-Out Remark","required":false,"note":"Free text"}],"writes":["The bill's state and its cancel twin, each stamped (a hold with its optional reason); attachments on the record; a review submission when sent for review"],"result":"The bill is moving. In parallel, the carrier's MBL/HBL goes through **step 18**.","pitfalls":["A bill under review is frozen: **Save Changes** is disabled and attachments cannot be removed. Choose **Request withdrawal** from **Review** before changing it.","The ledger's tick-boxes drive review only; the state verbs are per row or on the detail page.","**Check Out** on a held bill is refused. Press **Cancel Hold** first."],"shots":[{"file":"customer-intake-sop/shots/step-17.jpg","caption":"The Shipment ledger","path":"/lading"}]},{"n":18,"role":"Documentation · needs document:read plus review rights to approve","routes":[{"path":"/documents","label":"Documents repository (top nav → Documents)"},{"path":"/documents/$documentId","label":"One document — scan beside extracted fields"}],"navigate":"Top nav **Documents**","before":["You have the carrier's MBL or HBL as a PDF or image."],"golden":[{"action":"Open **Documents** and press **Upload document**","detail":"The pipeline classifies the file, extracts its fields and validates them, then either auto-approves it or parks it as **Needs review**.","src":"apps/web/src/routes/_next/documents.index.tsx:337"},{"action":"Find it with **Search documents by filename…** or the status Select","src":"apps/web/src/routes/_next/documents.index.tsx:351"},{"action":"Open the document. Check each extracted field against the scan beside it","detail":"Use **Download original** to read the source file.","src":"apps/web/src/routes/_next/documents.$documentId.tsx:668"},{"action":"Correct any wrong value in place, then save the amendment","detail":"Toast: **Amendment saved**. A correction the automation has already acted on can be refused, and the refusal says which field and why.","src":"apps/web/src/routes/_next/documents.$documentId.tsx:373"},{"action":"Press **Approve** (or ⌘⏎)","detail":"**This approval is what starts automated customs and port tracking** — nothing else does.","src":"apps/web/src/routes/_next/documents.$documentId.tsx:612"},{"action":"Read any notice on the toast","detail":"If that B/L is already tracked from an earlier document, it says so: no second tracking job is created and the existing one continues.","src":"packages/api/src/modules/document/register-hooks.ts:66"},{"action":"Wrong type? Pick the right one in the type select beside the filename and press **Save & approve**","detail":"Re-typing a document to **MBL/HBL** starts its tracking job on approval. After approval the type is fixed. A document set aside as not freight offers **This is a freight document — reprocess** instead (toast **Sent back through classification**).","src":"apps/web/src/routes/_next/documents.$documentId.tsx:530"},{"action":"Not freight at all? Press **Not freight** and give a reason","detail":"The dialog is **Reject this document** (e.g. \"Anthropic subscription receipt — not freight\"). Toast: **Rejected — removed from the review queue**.","src":"apps/web/src/routes/_next/documents.$documentId.tsx:969"},{"action":"Under **Linked records**, choose **Order** or **Bill of lading**, search, pick it and press **Link**","detail":"Toast: **Linked to order …** or **Linked to bill of lading …**. **Unlink** removes a link (**Link removed**).","src":"apps/web/src/routes/_next/documents.$documentId.tsx:936"}],"fields":[{"label":"Extracted fields","required":false,"note":"Editable before approval; each edit is recorded as a correction"},{"label":"Reject reason","required":true,"note":"Typed on the Reject dialog"}],"writes":["Document status (approved / needs review / rejected), the field corrections, any order or bill of lading links, and — on approval — a BL tracking job"],"result":"Approval starts the tracking clock. Watch it at **step 19**.","pitfalls":["There is no K1 or K2 customs-declaration type in the vocabulary, so the Sepangar filing lives outside this system."],"shots":[{"file":"customer-intake-sop/shots/step-18.jpg","caption":"Documents repository","path":"/documents"}]},{"n":19,"role":"Operations · needs bl-job:read to watch the board, and bl-job:void to void a job","routes":[{"path":"/customs-tracking","label":"Customs Tracking — the BL job board (Operations → Customs Tracking)"},{"path":"/overview","label":"Overview"},{"path":"/tracking","label":"Live Tracking, the map you leave open"}],"navigate":"Top nav **Operations** → **Customs Tracking**; **Live Tracking** is in the left rail","before":["A document carrying the B/L was approved at step 18. Nothing else starts a tracking job."],"golden":[{"action":"Open **Operations → Customs Tracking**","detail":"Columns: **Stage · BL Number · Vessel · Containers · Received (MYT) · Customs · 72h Countdown**. The board sorts by urgency.","src":"apps/web/src/routes/_next/customs-tracking.tsx:217"},{"action":"Let the schedulers work: customs runs three times a day, the port hourly","detail":"The checks are **MYCIEDS customs-clearance**, **SBCP vessel-berth** and container gate-out.","src":"apps/server/src/bl-tracking-worker.ts:59"},{"action":"Read the **72h Countdown**","detail":"It starts itself when the vessel berths; nobody types it.","src":"packages/port-tracking/src/transitions.ts:171"},{"action":"Watch for the branch emails","detail":"Every member of the job's owning branch is emailed on a countdown threshold and on a structural failure.","src":"apps/server/src/bl-tracking-worker.ts:98"},{"action":"Click a **BL Number** to open its job","detail":"The job page shows its stages and containers, its **Order** (found by B/L number), and **Fees** → **Open the order's fees** when exactly one order carries the B/L.","src":"apps/web/src/components/customs-tracking/bl-job-record.tsx:267"},{"action":"If a job can never finish, press **Void** and write the reason","detail":"e.g. \"Container table never extracted — shipment cancelled at origin\". Toast: **Job voided — it will stop being checked and alerted on**.","src":"apps/web/src/routes/_next/customs-tracking.tsx:132"}],"fields":[{"label":"Void reason","required":true,"note":"Written on the Void dialog; the job stops being checked and alerted on"}],"writes":["Check results per stage, the berth time and the countdown, alert sends, and the void with its reason"],"result":"Demurrage is under watch. The money side starts at **step 20**.","pitfalls":["Where no MYCIEDS or SBCP login is saved, the board, the job page and the Overview card say checks are off: nothing is checked and no 72-hour clock can start. An admin adds the login in **Settings → Tracking portal credentials**.","The order's reading pane and the B/L page show a **Documents & customs** card with the job's stage and 72h countdown; its B/L number opens the job. If two open jobs share the B/L number it shows **Match not certain** and no countdown."],"shots":[{"file":"customer-intake-sop/shots/step-19.jpg","caption":"Customs Tracking board","path":"/customs-tracking"},{"file":"customer-intake-sop/shots/step-19-overview.jpg","caption":"Overview / My tasks","path":"/overview"}]},{"n":20,"routes":[{"path":"/order/$orderId/expenses","label":"Expense Entry (no sidebar leaf; reached from an order)"}],"navigate":"Sidebar Operations > Sea Export (or any trade ledger: Sea Import, Air Export, Air Import, Logistics Park C/D, Road, Rail, Domestic Water, LCL) > open the order > press Expenses on the order record page, or Expense entry on the order edit form.","role":"Operator with collectiveOrder:read to open the order and collectiveOrder.update to save (saveChildren requires COLLECTIVE_ORDER.update).","before":["The order is SAVED (the Expense entry button only renders on an existing order).","The order is not locked (a locked order disables Save and shows a banner).","If the order's review flow ticks the Expense entry gate, the order is not frozen by an unapproved review.","An exchange rate is on file for every foreign currency used, for the shipment's dates. Otherwise new fees in that currency save at rate 1 and a banner says so after Save.","No fee you are changing is under review. A fee under review is frozen; withdraw its submission first on **Money > Cost lines**."],"golden":[{"action":"Open the order and press **Expenses** (record page) or **Expense entry** (edit form).","detail":"Navigates to /order/$orderId/expenses; page title **Expense Entry** with a **Basic info** panel (Job Number, Client, Business type, MB/L No., Vessel / Voyage, ports, Carrier, ETD...).","src":"apps/web/src/components/order-ledger/order-record-page.tsx:156"},{"action":"Wait until the **Save** button stops reading **Loading…**.","detail":"Save is disabled until the order's fees load; saving an empty grid would delete every unbilled fee.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:939"},{"action":"In **Receivable detail**, press **Costs name** to add a row.","detail":"New row defaults: Quantity 1, Currency USD, Unit price/Total price/Tax rate 0; **Exchange rate** is left blank (**From rate table**) and the server fills it on Save; **Settlement unit** auto-fills with the order's Client (receivable side only).","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:386"},{"action":"Fill **Name of cost**, **Billing unit**, **Quantity**, **Currency**, **Exchange rate**, **Unit price**, **Tax rate (%)**.","detail":"Total price recomputes as Quantity x Unit price when either changes; typing a different Total clears Unit price, so the fee saves as a lump sum. Taxes and No tax unit price are derived. Enter moves down a cell, Shift+Enter moves up.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:261"},{"action":"Press **Copy to payable** to mirror the receivable rows into **Payable details**.","detail":"Copies only rows with a name, as new rows; **Settlement unit** is blanked on the payable copies so you must type the vendor, and **Exchange rate** is blanked so the server prices each copy on its own side.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:830"},{"action":"In **Payable details**, type the vendor into **Settlement unit** for every row and add any extra payables with **Costs name**.","detail":"Payable new rows have no Settlement unit default. A payable with no Settlement unit shows a warning above the grid (**Payable row n has no Settlement unit, so no vendor is named. It saves as it is; …**); it still saves.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:1004"},{"action":"Read the **SINGLE BILL TOTAL** panel under the two grids.","detail":"It shows Local currency receivable/payable, Gross profit and Gross profit rate, each tax incl. and tax excl.; Interest shows a dash. The only checkboxes on this page are **Special receivables** and **Special payable**.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:1012"},{"action":"If the banner **No exchange rate on file for \u003ccurrencies>.** appears after Save, follow **Please go to set it**.","detail":"Links to /expenses/exchange-rates. It is the server's answer from the last Save: new fees in those currencies found no rate for the shipment's dates and count at rate 1 until one is set.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:960"},{"action":"Press **Save** in the page header.","detail":"One Save submits BOTH grids; toast **Fees saved** (it adds a note when fees added elsewhere since you opened the page were kept). An untouched blank row is dropped; a nameless row with anything typed in it refuses the Save by row number.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:707"},{"action":"Optionally press **导出单证 · Export documents** to export this order's saved fees.","detail":"Disabled while there are unsaved edits or no saved fees.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:932"}],"fields":[{"label":"Name of cost","required":true,"note":"Free text; placeholder 'Must fill in, otherwise it won't be saved'. An untouched blank row is dropped; a nameless row with content, or a saved fee whose name you cleared, refuses the Save."},{"label":"Settlement unit","required":false,"note":"Free text counterparty name (no company picker). Auto-filled with Client on receivable rows; a receivable naming the Client is linked to the client's company record. Hidden if the role is field-masked."},{"label":"Billing unit","required":false,"note":"Free text with equipment-code suggestions (e.g. 40HQ); semicolon multi-values allowed."},{"label":"Quantity","required":false,"note":"Default 1."},{"label":"Currency","required":true,"note":"Select from CURRENCIES; default USD."},{"label":"Exchange rate","required":false,"note":"Blank on a new row (**From rate table**); the server fills it from the rate table on Save. Clearing it on a saved row means 1."},{"label":"Unit price","required":false,"note":"Default 0."},{"label":"Total price","required":false,"note":"Auto = Quantity x Unit price (rounded to 6 dp). Typing a different total clears Unit price and saves the fee as a lump sum."},{"label":"Tax rate (%)","required":false,"note":"Default 0; drives Taxes and No tax unit price."}],"writes":["cost_line rows (attribute receivable/payable) via collectiveOrder.saveChildren, reconciled by id: new rows inserted, edited rows updated, rows you removed deleted. Only fees loaded when the page opened can be deleted; fees added elsewhere since are kept, and a fee deleted elsewhere refuses the Save.","Settlement unit stored as a string; a receivable naming the order's Client also gets the client's company record. settlementCurrency/settlementExchangeRate are never sent from this page.","Cost lines inherit the order's branch, job number and business type.","A new fee's exchange rate is filled by the server from the rate table for the shipment's dates; with no rate on file it saves at 1 (refused if the org forbids unrated fees)."],"result":"Stay on Expense Entry with saved rows. Next: step 21, submit the fees for Cost review from Money > Cost lines.","pitfalls":["There is one Save in the page header, not one per grid; it always sends both grids.","An untouched blank row is dropped without a word; a nameless row with anything typed in it, or a saved fee whose name you cleared, refuses the Save and names the row.","Rows already billed, invoiced, written off or locked are read-only and cannot be removed here; unlock a locked fee on Money > Cost lines.","Leaving the page with unsaved edits triggers the unsaved-changes guard.","Save is refused with 'Order is locked' on a locked order, and by the Expense entry review gate when the order's flow ticks it.","Copy to receivables (payable to receivable) keeps the Settlement unit; only Copy to payable blanks it.","Default currency is USD on every new row; change it before saving.","A fee under review is frozen: changing or removing it refuses the Save with **… are under review and cannot be changed here. Withdraw the submission first**. A fee approved under a flow that locks approved content cannot be changed either; add a correcting fee line.","If someone deleted one of these fees after you opened the page, Save is refused; reload to see the current fees."],"shots":[{"file":"customer-intake-sop/shots/step-20.jpg","caption":"The order's expenses page: receivable above payable, gross profit beneath","path":"/order/sea-export"}]},{"n":21,"routes":[{"path":"/expenses/cost-lines","label":"Cost lines (page title Cost Detail) - submitter side"},{"path":"/approve/cost","label":"Cost review - reviewer side"}],"navigate":"Submit: Sidebar Money > Cost lines. Decide: Sidebar Approvals > Cost review (also reachable from the dashboard approvals card).","role":"Submitter: expense:read to see the ledger, plus audit.read and expense.costLine.update to submit. Reviewer: audit.read and expense.costLine.review, must be a routed reviewer on the open stage (seeded Cost review flow routes to the accounting role, any-pass), and must not be the member who submitted the line.","before":["Cost lines exist (step 20).","An enabled review flow exists for cost_line (seeded as 'Cost review'); otherwise submit fails with 'No enabled review flow for cost_line'.","Lines are not already under review.","Someone other than you can review the fee. If you are the only routed reviewer, submit is refused: **Nobody but you can approve this record. Ask an administrator to add a reviewer under Approval Process Setting.**"],"golden":[{"action":"Go to **Money > Cost lines** and narrow the list with the search box **Search all columns** or the filter panel.","detail":"Page title Cost Detail; server-paged grid.","src":"apps/web/src/components/shell-next/nav.ts:226"},{"action":"Tick the checkbox of each fee line to submit.","detail":"Ticks are page-local and clear on filter or page change.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1984"},{"action":"Open **Review (n)** and choose **Submit for review**.","detail":"The Review menu only appears once rows are ticked. Each row is submitted separately; a mixed selection can half-succeed and the toast names the first refusal.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:2257"},{"action":"(Optional, before submitting) use **BatchOperation (n)** > **Modify exchange rate…** / **Tag…** / **Mark reconciled** / **Lock** / **Archiving**, or **Mark as… (n)** > **对账 · Reconciled** / **锁定 · Locked**.","detail":"Selection-only fee toolbar verbs. Modify exchange rate skips lines that are billed, invoiced, written off or locked, under review, or approved and locked, and lists them back with the reason.","src":"apps/web/src/components/expense/cost-line-batch-menu.tsx:152"},{"action":"Reviewer: go to **Approvals > Cost review**.","detail":"Mounts the same ledger in review mode, titled Cost review, restricted to submissions whose open stage routes to you and that you did not submit yourself; no Add, no Create Bill.","src":"apps/web/src/routes/_next/approve/cost.tsx:18"},{"action":"Optionally press a preset: **My submissions**, **My withdrawals** or **All pending**.","detail":"Applies Audit status / Submit staff filters immediately.","src":"apps/web/src/components/review-queue.tsx:172"},{"action":"Tick the lines and press **Approved**.","detail":"One all-or-nothing batch decision; toast 'N line(s) approved'. Buttons are disabled with nothing ticked.","src":"apps/web/src/components/review-queue.tsx:359"},{"action":"To refuse, tick the lines and press **Rejected**, type a **Reason** in **Reason for rejection**, then press **Reject**.","detail":"Cancel/Escape aborts; an empty reason is allowed. The reason is shown on the review trail.","src":"apps/web/src/components/reject-reason-dialog.tsx:54"},{"action":"Press **Refresh Page** to reload the queue.","detail":"Refetches the list.","src":"apps/web/src/components/review-queue.tsx:365"}],"fields":[{"label":"Reason","required":false,"note":"Textarea in the Reason for rejection dialog; placeholder 'e.g. Rate does not match the signed quotation'."},{"label":"Audit status","required":false,"note":"Queue filter; 'All audit statuses' by default on Cost review."},{"label":"Submit staff","required":false,"note":"Member picker filter."},{"label":"Approve staff","required":false,"note":"Member picker filter."},{"label":"Exchange rate","required":true,"note":"Only in the Modify exchange rate dialog; decimal, placeholder 4.7500."}],"writes":["An audit_submission per line (auditReview.submit), caching auditStatus pending on the cost line with submitter and time.","Per-reviewer decisions via auditReview.decideByResource; the line's auditStatus becomes approved or rejected with auditedBy, auditedAt and auditReason."],"result":"Approved lines drop out of the reviewer's queue. Next: step 22, bill them from Money > Cost lines > Create Bill.","pitfalls":["Create Bill refuses any line whose review is pending, awaiting a withdrawal decision, or rejected ('N selected line(s) are awaiting or failed cost review'); lines never submitted (null/draft), withdrawn or approved still bill.","The Review menu on the ledger submits row by row (partial success possible); the queue's Approved/Rejected is one all-or-nothing transaction.","The Cost review queue shows only lines whose OPEN stage routes to you, and never lines you submitted, so **My submissions** and **My withdrawals** stay empty there. A submitter who is not a reviewer sees an empty queue.","A rejected attempt is closed; there is no Return to draft. Edit the line and submit again.","BatchOperation and Mark as only render when at least one row is ticked.","A fee under review is frozen: it cannot be edited, removed or re-rated. Use **Review (n) > Request withdrawal**; it unfreezes once the withdrawal is approved.","Nobody decides their own fee: **Approve** or **Reject** from the ledger's Review menu on a line you submitted is refused with **You submitted this record. Another reviewer must decide it.**"],"shots":[{"file":"customer-intake-sop/shots/step-21.jpg","caption":"Cost review queue","path":"/approve/cost"}]},{"n":22,"routes":[{"path":"/expenses/cost-lines","label":"Cost lines (page title Cost Detail)"}],"navigate":"Sidebar Money > Cost lines.","role":"expense:read to open; expense.bill.create to create bills.","before":["Lines are not already billed (status bill_not_established, no bill).","Lines are not pending, awaiting withdrawal, or rejected in cost review (step 21).","If a tenant ticked the cost-line Create bill gate, every selected line must have passed review.","A bill exchange rate exists for the currency pair, or a warning toast is raised (bill still created)."],"golden":[{"action":"Go to **Money > Cost lines** and filter to the unbilled lines you want (e.g. by Settlement unit, attribute, order).","detail":"The filter is what decides scope when nothing is ticked.","src":"apps/web/src/components/shell-next/nav.ts:226"},{"action":"Tick specific lines, or tick nothing to bill the whole filtered set.","detail":"Button reads **Create Bill (n)** with ticks or **Create Bill (全选)** with none; unticked scope is capped at 2000 lines.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:2251"},{"action":"Press **Create Bill**.","detail":"Opens the **Create Bill** dialog. With nothing ticked it first counts the filtered set and names it.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1167"},{"action":"Read the preview **N bills will be created**.","detail":"One row per bill: settlement unit · attribute · currency (and tax rate), with total and line count. Hidden on the unticked path.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1191"},{"action":"Tick **Also split by tax rate** if each tax rate needs its own bill.","detail":"Settlement unit, attribute and currency (and owning branch) always split.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1228"},{"action":"Tick **Also split by order** if each order needs its own bill.","detail":"Off by default, so one bill can cover several orders to the same settlement unit (a month-end statement). Works on the unticked (全选) path too.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1240"},{"action":"If the ticked selection yields exactly one bill, adjust **Invoice Title** (prefilled with the settlement unit).","detail":"The field only shows for a single-bill TICKED selection with an unmasked settlement unit. It is absent on a split, on the whole unticked (全选) path, and whenever a selected line's settlement unit is masked — and in every hidden case no title is sent, so each bill takes its own settlement unit.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1278"},{"action":"Optionally type a **Remark**.","detail":"Applied to every bill created.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1293"},{"action":"Press **Create Bill** / **Create N Bills** / **Create Bills from N Lines**.","detail":"Toast 'Bill B… created' or 'N bills created: …'; lines are claimed by the new bill(s) in one transaction.","src":"apps/web/src/routes/_next/expenses/cost-lines.tsx:1342"}],"fields":[{"label":"Also split by tax rate","required":false,"note":"Checkbox, default off."},{"label":"Also split by order","required":false,"note":"Checkbox, default off. Also honoured when nothing is ticked."},{"label":"Invoice Title","required":false,"note":"Only for a ticked single-bill selection with an unmasked settlement unit; defaults to that settlement unit. Otherwise it is not sent at all."},{"label":"Remark","required":false,"note":"Textarea."}],"writes":["One bill per group key (settlement unit, attribute, currency, owning branch, optional tax rate, optional order) with consecutive bill numbers, status open, totalAmount, settlement unit from the first line, invoice title, remark. settlementCompanyId comes from any line that names a company, else the company whose name exactly matches the settlement unit, else empty.","Due date: the bill copies its company's payment terms (days payable, counted after invoicing) and is due on its created date plus those days. A bill with no company, or a company with no terms, has no due date.","Bill exchange rate resolved from the org rate table (rate type bill) as of creation; null when missing.","Each cost line's billId set (claim)."],"result":"Bills appear under Money > Bills (Bill Management). Next: step 23, submit each bill for Bill review.","pitfalls":["Any already-billed line in the selection blocks the whole request ('One or more selected lines are already billed').","Any line pending, awaiting withdrawal or rejected in cost review blocks the whole request ('N selected line(s) are awaiting or failed cost review').","A missing bill exchange rate only warns: local-currency figures read as rate 1.","Lines from different orders to the same settlement unit merge into one bill unless **Also split by order** is ticked.","If the lines of one bill name two different -nothing batch; toast 'N bill(s) approved'. With the seeded flow the bill stays pending until the director stage also passes.","src":"apps/web/src/routes/_next/expenses/bills.tsx:1545"},{"action":"To refuse, press **Rejected**, enter **Reason**, press **Reject**.","detail":"Reason recorded on the review trail.","src":"apps/web/src/routes/_next/expenses/bills.tsx:1481"},{"action":"Press **Refresh Page** to confirm the bills have left your queue.","detail":"Refetches the list.","src":"apps/web/src/components/review-queue.tsx:365"}],"fields":[{"label":"Reason","required":false,"note":"Rejection reason textarea."},{"label":"Audit Status","required":false,"note":"Queue opens with pending selected."}],"writes":["audit_submission for the bill; bill.auditStatus pending, then approved or rejected with auditor, time and reason per stage."],"result":"Once the latest review passes, invoicing and write-off are unfrozen. Next: step 24, Invoicing from Money > Bills.","pitfalls":["Invoicing is refused with '\"Input invoice no.\" requires review approval first' until the bill's NEWEST submission is approved; re-submitting after approval re-freezes it.","Gates only bite when the org has an enabled bill flow that ticks them; an org without one invoices freely (gates.ts:78-85).","The row Review icon is hidden inside the Bill review queue; submitting is done from Money > Bills.","Seeded flow needs BOTH accounting reviewers, then a director: one approval is not enough.","While a bill is under review nothing on it can be saved ('This record is under review and cannot be edited. Retract the submission first.'). After approval only **Courier**, **Courier No.**, **Financial Voucher No.**, **Exported Voucher Name**, **Remark** and **Bill Tag** still save; **Invoice Title**, **Service Fee**, **Service Fee Currency** and the exchange rate are refused, and removing a line asks you to dissolve the bill and bill the lines again."],"shots":[{"file":"customer-intake-sop/shots/step-23.jpg","caption":"Bill review queue","path":"/approve/bill"}]},{"n":24,"routes":[{"path":"/expenses/bills","label":"Bills (page title Bill Management)"}],"navigate":"Sidebar Money > Bills.","role":"expense:read to open; expense.invoice.create to issue.","before":["Bill status is open, or written off with a balance left (a partially invoiced bill keeps its status).","Bill review approved where the Input invoice no. gate is on (step 23).","Bill has cost lines and an outstanding balance."],"golden":[{"action":"Go to **Money > Bills** and find the bill (search **Search all columns**).","detail":"Footer totals show Receivable, Have-been received, Unwritten-off, Payable etc. for the filter.","src":"apps/web/src/routes/_next/expenses/bills.tsx:1513"},{"action":"On the row press the document-check icon titled **Invoicing**.","detail":"Enabled while the bill is open, or written off with a balance left. Opens **Invoicing — \u003cbill no>**.","src":"apps/web/src/routes/_next/expenses/-bills.columns.tsx:831"},{"action":"Choose **Invoice Category**.","detail":"Options: VAT general invoice, VAT special invoice, Digital electronic Ordinary invoice, Digital electronic Special Invoice, Proforma invoice.","src":"apps/web/src/routes/_next/expenses/bills.tsx:656"},{"action":"Choose **Invoice Type**.","detail":"Options: Paper, Electronic.","src":"apps/web/src/routes/_next/expenses/bills.tsx:682"},{"action":"Optionally type **Invoice Number**.","detail":"Placeholder 'Auto-generated if left blank'. A number in the system's own NCT-INV-… shape, or one already used, is refused and the dialog stays open.","src":"apps/web/src/routes/_next/expenses/bills.tsx:701"},{"action":"Check **Invoice Title** (prefilled from the bill).","detail":"Editable. What you type becomes this invoice's buyer; the bill's own title is not changed.","src":"apps/web/src/routes/_next/expenses/bills.tsx:710"},{"action":"Check **Amount**; lower it to invoice part of the bill.","detail":"Prefilled with total minus already invoiced; shows :["Amount above the outstanding balance is refused ('Invoice amount exceeds the bill's outstanding balance').","A bill that is invoiced or done cannot be invoiced again ('is not invoiceable'); the Invoicing icon is greyed. A written-off bill with nothing left to invoice is greyed too.","Frozen by the Input invoice no. review gate until the latest bill review passes.","Over a company's credit limit the server refuses without a reason ('… is over its credit limit … Give a reason to invoice anyway.'). Bills with no company are not checked.","Invoicing several bills on one invoice exists in the API but has no UI entry point; the dialog always sends one bill."],"shots":[{"file":"customer-intake-sop/shots/step-24.jpg","caption":"Bill Management","path":"/expenses/bills"}]},{"n":25,"routes":[{"path":"/expenses/invoices","label":"Invoices (page title Invoice Record)"}],"navigate":"Sidebar Money > Invoices.","role":"Accounting · the sidebar item needs expense:read, but the list itself gates on expense.invoice.read; expense.invoice.update for the Downloaded/Printed marks, expense.invoice.cancel to cancel.","before":["An issued invoice exists (step 24).","For PDF: the invoice's text (e.g. company names) is Latin-script, or use XLSX."],"golden":[{"action":"Go to **Money > Invoices** and find the invoice.","detail":"Stats tiles, all page-scoped except the first: **Total Invoices**, **Issued (this page)**, **Cancelled (this page)**, **Downloaded (this page)**.","src":"apps/web/src/components/shell-next/nav.ts:232"},{"action":"On the row press the download icon titled **Preview & download invoice document**.","detail":"Opens **发票预览 · Invoice \u003cnumber>** and builds the document on request.","src":"apps/web/src/routes/_next/expenses/invoices.tsx:359"},{"action":"Review the on-screen preview.","detail":"Rendered from the same model as the files; 'Building the document…' while loading.","src":"apps/web/src/routes/_next/expenses/invoices.tsx:403"},{"action":"Press **下载 PDF** (Download PDF).","detail":"Saves the file, toast 'Saved \u003cfilename>'. The server marks the invoice Downloaded in the same request, the first time only, and only for staff with expense.invoice.update.","src":"apps/web/src/routes/_next/expenses/invoices.tsx:441"},{"action":"If a **PDF refused** box appears, press **下载 XLSX** (Download XLSX) instead.","detail":"PDF is refused when text cannot be drawn in the Latin-only font; the message names the cell.","src":"apps/web/src/routes/_next/expenses/invoices.tsx:389"},{"action":"Close with **取消** (Cancel) and hand the file to the customer outside the system.","detail":"No send-email control exists.","src":"apps/web/src/routes/_next/expenses/invoices.tsx:419"},{"action":"After printing a paper copy, press the printer icon **Mark printed**.","detail":"Disabled once printed; toast 'Marked as printed'.","src":"apps/web/src/routes/_next/expenses/invoices.tsx:783"},{"action":"To void a wrong invoice press the icon **Cancel invoice**, optionally fill **Reason (optional)**, press **Cancel Invoice**.","detail":"The bill goes back to Open (or stays written off if its lines were already fully settled) and its cost lines become uninvoiced, so it can be invoiced again.","src":"apps/web/src/routes/_next/expenses/invoices.tsx:794"}],"fields":[{"label":"Reason (optional)","required":false,"note":"Cancel-invoice confirm; max 500 chars server-side."}],"writes":["invoice.isDownloaded set true by the server in the request that produces the file — first time only (not re-stamped), and only for holders of expense.invoice.update.","invoice.isPrinted set true on Mark printed.","Cancel: invoice state cancelled with reason; bill.invoicedAmount reduced and status re-derived (open, or written_off if fully written); cost line invoiced amounts rolled back.","Nothing is stored for the document itself; it is rebuilt on each request.","An audit row (expense.invoice.exportDocument) for every file produced, naming who took it and the format."],"result":"Customer has the invoice document. Next: step 26, record the receipt under Money > Payments.","pitfalls":["Labels in the preview dialog are Chinese: 下载 PDF, 下载 XLSX, 取消.","Downloaded is only recorded after an actual file save, not on preview.","Cancelling an already-cancelled invoice is a no-op; the icon is disabled for cancelled rows.","There is no email send; delivery is manual.","A red notice above the document warns when the covered bills carry different payment terms (the shortest is printed) or none (the customer's current terms are printed). These warnings are for the screen only; they never go into the file.","If the buyer's details are hidden from you, **下载 XLSX** and **下载 PDF** are disabled; ask a colleague who can see the buyer."],"shots":[{"file":"customer-intake-sop/shots/step-25.jpg","caption":"Invoice Record","path":"/expenses/invoices"}]},{"n":26,"routes":[{"path":"/expenses/payments","label":"Payments (page title Pay and Receive)"},{"path":"/expenses/write-offs","label":"Write-offs (page title Write-off Management)"}],"navigate":"Sidebar Money > Payments, then Sidebar Money > Write-offs.","role":"Cashier / Accounting · the sidebar item needs expense:read, but the lists gate on expense.payment.read and expense.writeOff.read; expense.payment.create to record, expense.payment.update to edit, expense.writeOff.verify to verify, expense.writeOff.reverse to void, expense.payment.delete to delete an unsettled payment.","before":["Target bill exists (billed lines only can be written off).","Bill review approved where the Write-off gate is on.","For a cross-currency write-off: a write-off exchange rate exists for the pair, or you will type one."],"golden":[{"action":"Go to **Money > Payments** and press **Add**.","detail":"Opens the sheet **Add Payment / Receipt**.","src":"apps/web/src/routes/_next/expenses/payments.tsx:1453"},{"action":"Set **Attribute** to **Receipt** (money in) or **Payment** (money out) and **Pay and Receive Date**.","detail":"Attribute defaults to Receipt; date defaults to today.","src":"apps/web/src/routes/_next/expenses/payments.tsx:416"},{"action":"Type **Settlement Unit** exactly as on the bill.","detail":"Required free text (placeholder 'Counterparty name'); the Verify dialog lists only bills and lines whose settlement unit matches it.","src":"apps/web/src/routes/_next/expenses/payments.tsx:454"},{"action":"Fill **Our Account**, **Other Account**, **Financial Voucher No.**, **Receipts and Payment Way**, **Currency**, **Price**, **Bank Slip Number**, **Post Time**, **Note**.","detail":"Currency and Price are required by validation even though unstarred.","src":"apps/web/src/routes/_next/expenses/payments.tsx:476"},{"action":"If an **Exchange Rate** row appears, correct the prefilled write-off rate to the bank's rate, or leave it blank.","detail":"Shown only when the currency differs from the reporting currency. Blank means no rate, so no exchange gain or loss is booked when it is settled.","src":"apps/web/src/routes/_next/expenses/payments.tsx:578"},{"action":"Press **Add Payment**.","detail":"Toast 'Payment \u003cno> recorded'.","src":"apps/web/src/routes/_next/expenses/payments.tsx:650"},{"action":"On the payment row press the icon titled **Verify**.","detail":"Opens **Verify — \u003cpayment no>**. Disabled once the payment is fully written off.","src":"apps/web/src/routes/_next/expenses/payments.tsx:1122"},{"action":"Choose **Target** = **Bill** (or **Cost Line**) and pick the bill/line.","detail":"Options show number and currency. Only this payment's own side is offered (receivables for a Receipt, payables for a Payment), only billed cost lines, and nothing already fully settled.","src":"apps/web/src/routes/_next/expenses/payments.tsx:804"},{"action":"Check **Write-off Amount** (prefilled with the payment's unwritten balance) and fill **Method**, **Account**, **Person**.","detail":"Amount is in the payment currency.","src":"apps/web/src/routes/_next/expenses/payments.tsx:849"},{"action":"If the currencies differ, fill **Write-off Exchange Rate — 核销汇率** or leave it empty to use the org write-off rate.","detail":"Shows the converted amount before confirming; refused if no rate is typed or on file.","src":"apps/web/src/routes/_next/expenses/payments.tsx:894"},{"action":"Press **Verify**.","detail":"Toast 'Write-off \u003cno> recorded'; the amount is spread across the bill's cost lines oldest-created first.","src":"apps/web/src/routes/_next/expenses/payments.tsx:947"},{"action":"To undo, go to **Money > Write-offs**, press **Void write-off** on the row, type a **Reason**, then press **Void Write-off**.","detail":"Payment balance and each cost line get back exactly what was taken, bill status reverts; record kept, marked voided.","src":"apps/web/src/routes/_next/expenses/write-offs.tsx:202"}],"fields":[{"label":"Attribute","required":true,"note":"Receipt / Payment; default Receipt."},{"label":"Pay and Receive Date","required":false,"note":"Date; default today."},{"label":"Settlement Unit","required":true,"note":"Free text counterparty; no company picker rendered."},{"label":"Our Account","required":false,"note":"Free text; prefills Account in Verify."},{"label":"Other Account","required":false,"note":"Free text."},{"label":"Financial Voucher No.","required":false,"note":"Free text."},{"label":"Receipts and Payment Way","required":false,"note":"None, Cash, Transfer, Draft(s), Check, Reconciliation, Collect on behalf, Payment on behalf."},{"label":"Currency","required":true,"note":"Select from CURRENCIES."},{"label":"Price","required":true,"note":"Payment amount, positive decimal."},{"label":"Exchange Rate","required":false,"note":"Shown only when the currency differs from the reporting currency; prefilled from the write-off rate on file. Blank = no rate."},{"label":"Bank Slip Number","required":false,"note":"Text reference only; no file upload."},{"label":"Post Time","required":false,"note":"Date."},{"label":"Note","required":false,"note":"Textarea."},{"label":"Target","required":true,"note":"Verify dialog: Bill or Cost Line."},{"label":"Write-off Amount","required":true,"note":"In payment currency; cannot exceed unwritten balance."},{"label":"Method / Account / Person","required":false,"note":"Verify dialog free text."},{"label":"Write-off Exchange Rate — 核销汇率","required":false,"note":"Only shown when payment and target currencies differ; blank uses org write-off rate."},{"label":"Reason","required":true,"note":"Void write-off dialog; max 500 chars."}],"writes":["payment row (paymentNo, direction, settlement unit, accounts, way, currency, amount, exchange rate, slip number, dates, note).","write_off row with writeOffNo, method, account, person and exchange rate; payment.writtenOffAmount increased.","Per-cost-line split recorded (writtenOffAmount), filled in cost line creation order; once the bill is fully covered it becomes **done** if it was already invoiced, or **written_off** if it never was.","Void: split returned to payment and lines, bill status reverted, write-off marked voided with its reason.","Any FX gain or loss on a cross-currency settlement, written to the bill."],"result":"The bill is settled — **done** on the normal path, since step 24 invoiced it. Next: step 27, the month-end exports.","pitfalls":["An unbilled cost line cannot be written off ('Cannot write off a cost line before it is billed').","Write-off amount above the payment's unwritten balance is refused.","Write-off is frozen by the bill's Write-off review gate; voiding by the Cancel the verification gate, where ticked.","Settlement Unit is matched as text when listing targets: a spelling difference hides the bill from the Verify picker.","A payment that has ever been written off cannot be deleted, even after the write-off is voided; correct it with **Edit** instead.","Write-offs are voided, never edited.","A receipt settles receivable bills only and a payment payable bills only; the other side is refused.","**Edit** on a payment is disabled while anything live is settled against it; void its write-off on **Money > Write-offs** first."],"shots":[{"file":"customer-intake-sop/shots/step-26.jpg","caption":"Pay and Receive","path":"/expenses/payments"},{"file":"customer-intake-sop/shots/step-26-writeoffs.jpg","caption":"Write-off Management","path":"/expenses/write-offs"}]},{"n":27,"routes":[{"path":"/expenses/cost-lines","label":"Cost lines (page title Cost Detail)"},{"path":"/report/financial","label":"Financial Stat"}],"navigate":"Sidebar Money > Cost lines (export), then Sidebar Reports > Financial Stat.","role":"Export documents: expense.costLine.read. Financial Stat: report:read to view, report:export for Month-end pack and Excel/PDF.","before":["The month's fees are entered, billed, invoiced and written off (steps 20-26).","Company bank accounts configured if the DEBIT_NOTE must carry remittance details.","If the cost-line Export document gate is ticked, selected lines are approved."],"golden":[{"action":"Go to **Money > Cost lines** and filter to the customer and month (e.g. Settlement unit, dates).","detail":"With nothing ticked the filter is the export scope.","src":"apps/web/src/components/shell-next/nav.ts:226"},{"action":"Press **导出单证 · Export documents (全选)** (or tick lines first for **(n)**).","detail":"Opens **导出表格 · Export table** and confirms the count for the unticked path.","src":"apps/web/src/components/export-table-dialog.tsx:343"},{"action":"Choose **文件类型** (file type): **对账单** (Statement), **DEBIT_NOTE** (Debit note) or **单票利润单** (Per-shipment profit sheet).","detail":"Changing type clears the preview.","src":"apps/web/src/components/export-table-dialog.tsx:370"},{"action":"For **对账单** or **DEBIT_NOTE** over ticked lines from several parties, pick **结算单位 · Settlement unit**.","detail":"One document goes to one settlement unit; only that unit's lines are sent. With nothing ticked, filter to one settlement unit first or the export is refused.","src":"apps/web/src/components/export-table-dialog.tsx:392"},{"action":"Optionally set **文件名** (file name) and, for DEBIT_NOTE, **选择账户** (bank account).","detail":"Blank name uses the default '\u003ctype>-YYYY-MM-DD'; blank account uses the account flagged as default export.","src":"apps/web/src/components/export-table-dialog.tsx:422"},{"action":"Leave **导出格式** (format) as **XLSX (.xlsx)**, press **预览** (Preview), then **导出** (Export).","detail":"Toast 'Exported \u003cfile>'; file built on request, stored nowhere.","src":"apps/web/src/components/export-table-dialog.tsx:484"},{"action":"For one shipment's statement or profit sheet, use **导出单证 · Export documents** on the order's **Expense Entry** page instead.","detail":"Exports that order's saved fees. For a statement or DEBIT_NOTE over fees of several parties, pick **结算单位 · Settlement unit** first.","src":"apps/web/src/routes/_next/order.$orderId.expenses.tsx:932"},{"action":"Go to **Reports > Financial Stat**.","detail":"Tabs: **Profit analysis statement**, **Profit statement**, **Actual receipt and payment report**, **Billing records**, **Ageing report**. Months are read in the branch's time zone; profit figures are labelled **At each bill's rate · billed fees only**.","src":"apps/web/src/routes/_next/report/financial/index.tsx:993"},{"action":"Pick the month in the month picker and press **Month-end pack**.","detail":"Downloads one workbook with sheets Invoices Issued, Receipts, Settlements & FX, Bills Outstanding; label reads 'Building pack…' meanwhile.","src":"apps/web/src/routes/_next/report/financial/index.tsx:950"},{"action":"Optionally press **Excel** or **PDF** to export the current Financial Stat view.","detail":"Uses the page filters.","src":"apps/web/src/routes/_next/report/financial/index.tsx:981"},{"action":"On **Money > Bills**, press **Mark synced to finance** on each bill handed to the bookkeeper.","detail":"Toggle; the month-end pack only reports this flag and never sets it.","src":"apps/web/src/routes/_next/expenses/-bills.columns.tsx:849"}],"fields":[{"label":"文件类型","required":true,"note":"对账单 / DEBIT_NOTE / 单票利润单; default 对账单."},{"label":"文件名","required":false,"note":"Max 120 chars; blank = default name."},{"label":"选择账户","required":false,"note":"DEBIT_NOTE only; default = account flagged default export."},{"label":"导出格式","required":true,"note":"Only XLSX (.xlsx)."},{"label":"Month-end pack month","required":true,"note":"type=month, cannot be later than the current month; defaults to current month."},{"label":"结算单位 · Settlement unit","required":false,"note":"Shown for 对账单 / DEBIT_NOTE only when the ticked lines span several units; then required."}],"writes":["Nothing on the ledger: exports and the month-end pack are read-only (an egress audit row is written for report exports).","Mark synced to finance writes bill.financeSynced (separate action)."],"result":"Statement / debit note / profit sheets and the month-end workbook are downloaded for the customer and bookkeeper. End of the intake SOP.","pitfalls":["There is no period close or month lock in NCT; the month-end pack is an export only (packages/api/src/routers/report.ts:2978). Locking is per job: **Lock job** on an order's **Lifecycle** menu stops its fees being added or changed.","Export button labels are bilingual/Chinese: 导出单证 · Export documents; dialog buttons 取消 / 预览 / 导出.","Month-end pack and Excel/PDF are hidden without report:export.","The order-page export is disabled while that page has unsaved edits.","No email send exists in the export dialog (omitted by design).","A DEBIT_NOTE with no configured bank accounts carries no remittance details (warning shown).","The Financial Stat **PDF** prints one line per currency, with no cross-currency sum. A converted total prints only when every bill converts into one named currency (the base currency, or a single branch currency).","Open bills with no due date sit outside the Ageing buckets, on a separate line: '\u003cn> open bills (…) have no due date and cannot show days overdue.'","**Statements & debit notes for \u003cmonth>** on Financial Stat opens Cost lines filtered by Fee Time in whole UTC days, while the pack and tabs use bill and payment days in the branch's time zone, so a fee entered near midnight can fall in another month.","Ending or locking a job (**End job**, **Cancel end**, **Lock job**, **Unlock job** on the order ledger row's **Lifecycle** menu) is not an accounting action: accounting does not see the menu. Ask ops or a branch manager."],"shots":[{"file":"customer-intake-sop/shots/step-27.jpg","caption":"Financial Stat","path":"/report/financial"},{"file":"customer-intake-sop/shots/step-27-business.jpg","caption":"Business Stat","path":"/report/business"}]}],"roles":[{"id":"sales","name":"Sales"},{"id":"sales-admin","name":"Sales admin"},{"id":"reviewer","name":"Reviewer"},{"id":"operations","name":"Operations"},{"id":"documentation","name":"Documentation"},{"id":"accounting","name":"Accounting"},{"id":"cashier","name":"Cashier"}]}</script>

<div class="wrap">

  <header class="masthead">
    <div class="eyebrow" id="sop-eyebrow"></div>
    <h1 id="sop-h1"></h1>
    <p class="note-toggle-row" id="note-toggle-row">
      <button type="button" class="doc-toggle" id="note-toggle" aria-expanded="false" aria-controls="chain-note">
        Read first
      </button>
    </p>
    <div class="chain-note" id="chain-note" hidden>
      <span class="tag">Read first</span>
      <p style="margin:0" id="sop-readfirst"></p>
    </div>
  </header>

  <nav class="index" aria-label="Phases" id="sop-index"></nav>

  <!-- ═══ ARRIVALS (optional: removed when the data has no arrivals) ═══ -->
  <section class="arrivals" id="arrivals">
    <div class="doc-head-row">
      <h2 id="arrivals-title">How they arrive</h2>
      <button type="button" class="doc-toggle" id="arrivals-toggle" aria-expanded="false" aria-controls="arrivals-body">
        Show the channels
      </button>
    </div>
    <div class="arrivals-body" id="arrivals-body" hidden>

    <div class="flow">

      <div class="flow-diagram" id="flow-diagram"></div>

      <div class="flow-detail" id="flow-detail">
        <span class="d-home" id="d-home"></span>
        <h3 id="d-name"></h3>
        <div id="d-body"></div>
        <div class="d-join">
          <span class="lbl" id="d-jlbl">Starts at</span>
          <a id="d-jlink" href="#step-1">Step 01</a>
        </div>
      </div>

      <div class="flow-print" id="flow-print"></div>
    </div>

    <div class="converge">
      <span class="arrow" id="converge-label"></span>
      <p id="converge-text"></p>
    </div>
    </div>
  </section>

  <!-- ═══ WHOLE-CHAIN MAP ═══ -->
  <section class="map" id="map">
    <h2>The whole chain</h2>
    <p class="lede" id="map-lede"></p>
    <p class="map-legend" id="map-legend"></p>
    <form class="baseurl" id="baseurl" autocomplete="off" novalidate>
      <label for="baseurl-input">App URL</label>
      <input id="baseurl-input" type="url" inputmode="url" spellcheck="false"
        placeholder="https://app.example.com/" value="">
      <button type="submit">Apply</button>
      <span class="baseurl-hint" id="baseurl-hint">Every screen path on this page, like <code>/</code>, opens against this address.</span>
    </form>
    <div class="chain">
      <div class="chain-canvas">
        <svg id="chain-svg" role="group" aria-label="Flow chart of the steps"></svg>
      </div>
      <div class="chain-pane" id="chain-pane"></div>
    </div>
  </section>

  <!-- ═══ THE DOCUMENT ═══ -->
  <section class="doc-head" id="document">
    <div class="doc-head-row">
      <h2>The document</h2>
      <button type="button" class="doc-toggle" id="doc-toggle" aria-expanded="false" aria-controls="doc-body">
        Show all steps
      </button>
    </div>
    <p class="lede" id="doc-lede"></p>
  </section>

  <div class="doc-body" id="doc-body" hidden></div>

  <!-- ═══ LEDGER (optional: removed when there is nothing to fix) ═══ -->
  <section class="ledger" id="fixes">
    <h2 id="ledger-title">What to fix first</h2>
    <div class="ledger-body" id="ledger-body">
    <p class="lede" id="ledger-lede"></p>
    <p class="gap-progress" id="gap-progress"><span id="gap-count">0</span> of <span id="gap-total">0</span> done<span class="gap-sync" id="gap-sync"></span><span class="gap-local" id="gap-local" hidden>Ticks are saved in this browser only</span></p>
    <div class="fixbrowser">
      <nav class="fx-steps" id="fx-steps" aria-label="Steps with defects"></nav>
      <div class="fx-detail" id="fx-detail"></div>
    </div>
    <ol class="gaps" id="gaps" hidden></ol>
    </div>
  </section>

  <p class="colophon" id="colophon"></p>

</div>

<script>
/* ── template bootstrap: render the shell from #sop-data ─────────────────
   Produces the same DOM the hand-written reference page had (section.phase,
   article.step, div.break, ol#gaps li[data-gap]) so every renderer below
   reads the document exactly as before. Text fields are escaped; fields the
   schema marks as HTML are inserted as authored. */
(function () {
  var D = {};
  try { D = JSON.parse(document.getElementById("sop-data").textContent) || {}; }
  catch (e) { D = {}; if (window.console) { console.error("sop-data is not valid JSON", e); } }
  var M = D.meta = D.meta || {};
  D.phases = D.phases || []; D.steps = D.steps || []; D.breaks = D.breaks || []; D.guide = D.guide || [];
  window.SOP_DATA = D;

  function $(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  // HTML fields go in as authored, except a stray "<!--" would swallow the rest of the page
  function h(s) { return String(s == null ? "" : s).replace(/<!--/g, "&lt;!--"); }
  function drop(id) { var n = $(id); if (n && n.parentNode) { n.parentNode.removeChild(n); } }

  /* ── tracker helpers (schema v2), shared with the fix browser and the step guide.
     Each returns "" / null when the record carries no tracker field, so v1 data
     (NCT) renders exactly as before. ── */
  var ST_LABEL = { "open": "Open", "partly-fixed": "Partly fixed", "fixed": "Fixed" };
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s == null ? "" : s));
    return m ? Number(m[3]) + " " + MON[Number(m[2]) - 1] + " " + m[1] : String(s == null ? "" : s);
  }
  var TK = window.SOPTrack = {
    // null when the record has no status (and no legacy resolved flag)
    status: function (x) {
      if (!x) { return null; }
      if (x.status != null) { return ST_LABEL[x.status] ? x.status : "open"; }
      if (x.resolved != null) { return x.resolved ? "fixed" : "open"; }
      return null;
    },
    fmtDate: fmtDate,
    tags: function (x) {
      var s = TK.status(x), out = "";
      if (s) { out += '<em class="status-tag st-' + s + '" data-status="' + s + '">' + ST_LABEL[s] + "</em>"; }
      if (x && x.origin === "rule-violation") {
        out += (out ? " " : "") + '<em class="rule-tag">' + (x.ruleId ? "Rule " + esc(x.ruleId) + " broken" : "Rule broken") + "</em>";
      }
      return out;
    },
    dates: function (x) {
      if (!x) { return ""; }
      var p = [], fx = x.fixedAt || x.resolvedAt;
      if (x.firstFound) { p.push("Found " + esc(fmtDate(x.firstFound))); }
      if (fx) { p.push("Fixed " + esc(fmtDate(fx))); }
      return p.length ? '<span class="dates">' + p.join(" · ") + "</span>" : "";
    },
    // tags + dates in one row, or "" when there is neither
    row: function (x) {
      var t = TK.tags(x), d = TK.dates(x);
      return t || d ? t + (t && d ? " " : "") + d : "";
    },
    history: function (x) {
      var hs = x && x.history && x.history.length ? x.history : null;
      if (!hs) { return ""; }
      // rows are divs, not li: "li" selectors on the ledger and the step guide must never reach into a history
      return '<details class="history"><summary>History (' + hs.length + ')</summary><div class="h-rows">' + hs.map(function (r) {
        r = r || {};
        var move = (r.from ? (ST_LABEL[r.from] || esc(r.from)) + " → " : "") + (ST_LABEL[r.to] || esc(r.to || ""));
        return '<div class="h-row">' + (r.date ? '<span class="h-date">' + esc(fmtDate(r.date)) + "</span> " : "") +
          '<span class="h-move">' + move + "</span>" + (r.by ? ' <span class="h-by">by ' + esc(r.by) + "</span>" : "") +
          (r.note ? ' <span class="h-note">— ' + esc(r.note) + "</span>" : "") + "</div>";
      }).join("") + "</div></details>";
    }
  };

  var steps = D.steps.slice().sort(function (a, b) { return a.n - b.n; });
  var STEPN = {};
  steps.forEach(function (s) { STEPN[s.n] = s; });

  /* ── masthead ── */
  var eb = [];
  if (M.company) { eb.push("<span>" + esc(M.company) + "</span>"); }
  if (M.site) { eb.push("<span>" + esc(M.site) + "</span>"); }
  eb.push("<span><b>" + esc(M.kind || "Standard operating sequence") + "</b></span>");
  $("sop-eyebrow").innerHTML = eb.join("\n      ");
  $("sop-h1").textContent = M.title || "";
  if (M.readFirst) { $("sop-readfirst").innerHTML = h(M.readFirst); }
  else { drop("note-toggle-row"); drop("chain-note"); }

  /* ── arrivals ── */
  var A = D.arrivals && D.arrivals.channels && D.arrivals.channels.length ? D.arrivals : null;
  var idx = [];
  if (A) {
    var chs = A.channels, nCh = chs.length, H = 32 + 64 * nCh;
    var title = A.title || "How they arrive";
    $("arrivals-title").textContent = title;
    $("arrivals-toggle").textContent = "Show the " + nCh + " channels";
    idx.push('<a href="#arrivals"><span class="k">&mdash;</span><span class="n">' + esc(title) +
             '</span><span class="c">' + nCh + " channel" + (nCh === 1 ? "" : "s") + "</span></a>");
    // junction per distinct joining step, centred on the channels that feed it
    var joins = [], JY = {};
    chs.forEach(function (c, i) {
      var cy = 32 + 64 * i + 23;
      if (!JY[c.join]) { JY[c.join] = []; joins.push(c.join); }
      JY[c.join].push(cy);
    });
    var jy = {}, prev = -1e9;
    joins.map(function (j) {
      var ys = JY[j]; return { j: j, y: ys.reduce(function (s, v) { return s + v; }, 0) / ys.length };
    }).sort(function (a, b) { return a.y - b.y; }).forEach(function (o) {
      var y = Math.max(o.y, prev + 48); jy[o.j] = y; prev = y;
    });
    var firstStep = steps.length ? steps[0].n : 1;
    var s = [];
    s.push('<svg viewBox="0 0 800 ' + H + '" role="group" aria-label="' +
           esc(A.ariaLabel || (nCh + " arrival channels fanning into " + joins.length + " entry points in the sequence.")) + '">');
    s.push('<text class="faxis" x="6" y="14">Arrives by</text>');
    s.push('<text class="faxis" x="560" y="14">Joins the sequence</text>');
    chs.forEach(function (c, i) {
      var cy = 32 + 64 * i + 23, y2 = jy[c.join];
      var d = cy === y2 ? "M202," + cy + " H560" : "M202," + cy + " C 390," + cy + " 390," + y2 + " 560," + y2;
      s.push('<path id="e-' + esc(c.key) + '" class="fedge' + (c.homeless ? " dashed" : "") + '" d="' + d + '"></path>');
    });
    var ys = joins.map(function (j) { return jy[j]; }).sort(function (a, b) { return a - b; });
    s.push('<path class="ftrunk" d="' + ys.map(function (y) { return "M710," + y + " H745"; }).join(" ") +
           " M745," + ys[0] + " V" + (H - 18) + '"></path>');
    s.push('<polygon class="ftrunk-head" points="745,' + (H - 10) + " 740.5," + (H - 19) + " 749.5," + (H - 19) + '"></polygon>');
    joins.forEach(function (j) {
      var lbl = (A.junctions && A.junctions[j]) ? " &middot; " + esc(A.junctions[j]) : "";
      s.push('<g class="fjoin" id="j-' + j + '"><rect class="pill" x="560" y="' + (jy[j] - 19) +
             '" width="150" height="38" rx="2"></rect><text class="jlabel" x="575" y="' + (jy[j] + 5) +
             '">Step ' + pad(j) + lbl + "</text></g>");
    });
    chs.forEach(function (c, i) {
      var y = 32 + 64 * i;
      s.push('<g class="fnode' + (c.homeless ? " homeless" : "") + '" data-ch="' + esc(c.key) +
             '" tabindex="0" role="button" aria-label="' + esc(c.name) + ' channel detail">' +
             '<rect class="box" x="6" y="' + y + '" width="196" height="46" rx="2"></rect>' +
             '<circle class="dot" cx="20" cy="' + (y + 17) + '" r="3"></circle>' +
             '<text class="name" x="32" y="' + (y + 21) + '">' + esc(c.name) + "</text>" +
             '<text class="sub"  x="32" y="' + (y + 35) + '">' + esc(c.sub || "") + "</text></g>");
    });
    s.push("</svg>");
    s.push('<p class="flow-hint">' + (A.hint ? esc(A.hint) :
           "Hover or tab a channel &mdash; solid line = the system carries it, dashed = you transcribe it") + "</p>");
    $("flow-diagram").innerHTML = s.join("\n");
    $("converge-label").textContent = A.convergeLabel || ("All " + nCh + " converge");
    if (A.converge) { $("converge-text").innerHTML = h(A.converge); }
    // the channel panel renderer below reads this map
    window.SOP_CHANNELS = { order: chs.map(function (c) { return c.key; }), map: {} };
    chs.forEach(function (c) {
      window.SOP_CHANNELS.map[c.key] = {
        name: esc(c.name), home: c.home ? h(c.home) : esc(c.sub || ""), homeless: !!c.homeless,
        join: "j-" + c.join, jlbl: c.jlbl || (c.join === firstStep ? "Starts at" : "Joins at"),
        jstep: "Step " + pad(c.join), jhref: "#step-" + c.join, body: h(c.body)
      };
    });
  } else {
    drop("arrivals");
  }

  /* ── phase index ── */
  idx.push('<a href="#map"><span class="k">&mdash;</span><span class="n">The whole chain</span><span class="c">' +
           steps.length + " step" + (steps.length === 1 ? "" : "s") + "</span></a>");
  D.phases.forEach(function (ph) {
    var ns = steps.filter(function (s) { return s.phase === ph.letter; }).map(function (s) { return s.n; });
    var c = !ns.length ? "" : ns.length === 1 ? "Step " + ns[0] : "Steps " + ns[0] + "&ndash;" + ns[ns.length - 1];
    idx.push('<a href="#phase-' + esc(String(ph.letter).toLowerCase()) + '"><span class="k">' + esc(ph.letter) +
             '</span><span class="n">' + esc(ph.name) + '</span><span class="c">' + c + "</span></a>");
  });
  $("sop-index").innerHTML = idx.join("\n    ");

  /* ── map lede + legend ── */
  var C = D.chain || {};
  var nBreaks = D.breaks.length;
  $("map-lede").innerHTML = h(M.mapLede) ||
    ("All " + steps.length + " steps in order. Hover or tab one to read the summary below the chart; " +
     "<strong>click a step (or press Enter) to open its full operator guide</strong> &mdash; golden path, " +
     "screens, fields, what the system writes, and screenshots." +
     (nBreaks ? " The " + nBreaks + " severed link" + (nBreaks === 1 ? " is where" : "s are where") +
                " the system stops carrying your data across." : ""));
  var lg = ["<span><i></i> Hand-off works</span>"];
  if (nBreaks) { lg.push('<span><i class="sev"><b></b></i> Chain break</span>'); }
  if (C.pitfall && C.pitfall.length) { lg.push("<span>" + (h(C.pitfallLegend) || "Ringed number &mdash; most commonly missed") + "</span>"); }
  if (C.aside && C.aside.length) { lg.push("<span>" + (h(C.asideLegend) || "Dashed box &mdash; off the main path") + "</span>"); }
  $("map-legend").innerHTML = lg.join("\n      ");
  $("chain-svg").setAttribute("aria-label", C.ariaLabel ||
    ("Flow chart of the " + steps.length + " steps in " + D.phases.length + " phases, one phase per row."));

  /* ── the document ── */
  $("doc-lede").innerHTML = h(M.docLede) ||
    "Every step in full, in order, with the chain breaks where they fall. The chart above is an index of " +
    "what is written here &mdash; hovering a node shows you the step from this text, so the two can never " +
    "disagree. Collapsed by default; it opens on its own when you follow a link to a step, and it always prints.";

  function breakHtml(b) {
    var body = h(b.body);
    if (!/^\s*<p[\s>]/i.test(body)) { body = "<p>" + body + "</p>"; }
    return '<div class="break" data-after="' + b.after + '">\n      <div class="mark">&#9472;&#9472;</div>\n' +
           '      <div class="body">\n        <span class="between">Chain break &middot; ' + esc(b.label) + "</span>\n        " +
           body + "\n      </div>\n    </div>";
  }
  function stepHtml(st) {
    var badge = st.badge ? ' <span style="font-family:var(--mono);font-size:0.62rem;letter-spacing:0.09em;' +
      'text-transform:uppercase;color:var(--teal);vertical-align:0.28em;margin-left:0.4rem;">' + esc(st.badge) + "</span>" : "";
    var out = '<article class="step" id="step-' + st.n + '">\n      <div class="num">' + pad(st.n) + "</div>\n      <div>\n" +
            "        <h3>" + esc(st.title) + badge + "</h3>\n" +
            '        <p class="where">' + esc(st.where || "") + "</p>\n" +
            '        <p class="what">' + h(st.what) + "</p>\n";
    if (st.watch && (st.watch.html || st.watch.text)) {
      out += '        <div class="watch"><span class="tag">' + esc(st.watch.tag || "Watch") +
           '</span><p style="margin:0">' + (st.watch.html ? h(st.watch.html) : esc(st.watch.text)) + "</p></div>\n";
    }
    return out + "      </div>\n    </article>";
  }
  var BY_AFTER = {}, LEAD = {};
  D.breaks.forEach(function (b) {
    if (b.lead) {
      var nx = steps.filter(function (s) { return s.n > b.after; })[0];
      if (nx) { (LEAD[nx.phase] = LEAD[nx.phase] || []).push(b); return; }
    }
    (BY_AFTER[b.after] = BY_AFTER[b.after] || []).push(b);
  });
  var doc = [];
  D.phases.forEach(function (ph) {
    var part = ['<section class="phase" id="phase-' + esc(String(ph.letter).toLowerCase()) + '">',
      '    <div class="phase-head">\n      <span class="letter">' + esc(ph.letter) + "</span>\n      <h2>" +
      esc(ph.name) + '</h2>\n      <span class="who">' + esc(ph.who || "") + "</span>\n    </div>"];
    (LEAD[ph.letter] || []).forEach(function (b) { part.push("    " + breakHtml(b)); });
    steps.filter(function (s) { return s.phase === ph.letter; }).forEach(function (st) {
      part.push("    " + stepHtml(st));
      (BY_AFTER[st.n] || []).forEach(function (b) { part.push("    " + breakHtml(b)); });
    });
    part.push("  </section>");
    doc.push(part.join("\n\n"));
  });
  $("doc-body").innerHTML = doc.join("\n\n");

  /* ── ledger ── */
  var L = D.ledger && D.ledger.items && D.ledger.items.length ? D.ledger : null;

      '<ol class="rules-list">' + RULES.map(function (r) {
        r = r || {};

        }).join("");
        var srcs = r.src == null ? [] : [].concat(r.src).filter(function (x) { return x != null && x !== ""; });
        var led = L && r.ledgerId != null && LED[r.ledgerId] ? LED[r.ledgerId] : null;
        return '<li class="rule" id="rule-' + esc(r.id) + '">' +
          '<span class="rule-id">' + esc(r.id) + "</span>" +

  if (TR && TR.verifiedAt) {

    tp.id = "trust-line";
    var share = typeof TR.citedShare === "number" && isFinite(TR.citedShare) ? Math.round(TR.citedShare) : null;

      (TR.verifiedCommit ? " at <code>" + esc(TR.verifiedCommit) + "</code>" : "");
