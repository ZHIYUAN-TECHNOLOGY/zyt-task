/* ── whole chain: branching flow chart + detail pane ─────────────────────
   One row per phase. Geometry is COMPUTED from the spec below, never
   hand-typed. The pane clones the real step article out of the document, so
   the chart and the prose cannot drift apart.

   The graph is deliberately NOT a single line: an off-trunk setup step, a
   dead end at 10, four reject loops, a monthly step hanging off the end, and
   eight severed hand-offs. Where a customer ENTERS, and the fact that step 3
   is optional, are marked on the nodes rather than drawn as extra edges —
   long routes into an interior column can only cross the 30px column gap,
   where they read as trunk edges that do not exist. The arrivals diagram
   above owns the entry story; here it is a badge. */
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("chain-svg");
  var pane = document.getElementById("chain-pane");
  if (!svg || !pane) { return; }

  var GUTTER = 150, NW = 128, NH = 70, COLGAP = 30, ROW0 = 78, ROWPITCH = 200;
  function COL(c) { return GUTTER + c * (NW + COLGAP); }
  // ROWSHIFT: extra height pushed onto a row by a below box above it (see LANE below)
  var ROWSHIFT = [];
  function ROW(r) { return ROW0 + r * ROWPITCH + (ROWSHIFT[r] || 0); }
  function WRAPLANE(r) { return ROW(r) + NH + 64; }
  function ARCTOP(r) { return ROW(r) - 34; }

  /* template: the layout constants come from sop-data "chain". With no
     "chain.rows" every phase becomes one row, entered at its first step and
     left from its last. BREAK_AT is every break's "after" step. */
  var SD = window.SOP_DATA || {}, C = SD.chain || {};
  function toMap(v) {
    var o = {};
    if (Array.isArray(v)) { v.forEach(function (k) { o[k] = 1; }); }
    else if (v) { for (var k in v) { o[k] = v[k]; } }
    return o;
  }
  var ROWS = C.rows && C.rows.length ? C.rows : (SD.phases || []).map(function (ph) {
    var cells = (SD.steps || []).filter(function (s) { return s.phase === ph.letter; })
      .map(function (s) { return s.n; }).sort(function (a, b) { return a - b; });
    return { letter: ph.letter, cells: cells, entry: cells[0], exit: cells[cells.length - 1] };
  }).filter(function (r) { return r.cells.length; });
  var ASIDE = toMap(C.aside);
  var REJECT = C.reject || [];
  var ENTERS = toMap(C.enters);
  var OPTIONAL = toMap(C.optional);
  var LOST = C.lost && C.lost.from != null ? C.lost : null;
  var BREAK_AT = {};
  (SD.breaks || []).forEach(function (b) { BREAK_AT[b.after] = 1; });
  var PITFALL = toMap(C.pitfall);
  // chart labels for titles too long to wrap into the box
  var SHORT = C.short || {};
  var TAIL = C.tail && C.tail.step != null ? C.tail : null;
  if (!ROWS.length) { return; }

  /* A below box spans ROW+NH+46 .. ROW+2NH+46; the wrap lane runs at ROW+NH+64,
     straight through it. When a row's wrap would cross one of its below boxes,
     the lane runs under the box instead (and drops down the column gap beside
     the exit when the box hangs under the exit itself); every later row moves
     down by the same amount. Rows with no such collision are untouched. */
  var LANE = {};
  (function () {
    var shift = 0;
    ROWS.forEach(function (t, r) {
      ROWSHIFT[r] = shift;
      if (r === ROWS.length - 1 || !t.below || !t.below.length) { return; }
      var nx = ROWS[r + 1], ex = t.cells.indexOf(t.exit), en = nx.cells.indexOf(nx.entry);
      if (ex < 0 || en < 0) { return; }
      var cols = t.below.map(function (b) { var i = t.cells.indexOf(b[1]); return i < 0 ? t.cells.length - 1 : i; });
      var dropX = cols.indexOf(ex) >= 0 ? COL(ex) + NW + COLGAP / 2 : COL(ex) + NW / 2;
      var bx = COL(en) + NW / 2, lo = Math.min(dropX, bx) - 14, hi = Math.max(dropX, bx) + 14;
      if (!cols.some(function (c) { return COL(c) < hi && COL(c) + NW > lo; })) { return; }
      LANE[r] = { dropX: dropX, extra: NH + 6 };
      shift += NH + 6;
    });
  })();

  var MAXCOL = 0;
  ROWS.forEach(function (r) { MAXCOL = Math.max(MAXCOL, r.cells.length - 1); });
  var W = COL(MAXCOL) + NW + 200;
  var H = ROW(ROWS.length - 1) + NH + 170;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  // z-order layers: lines behind, nodes in front, focusable groups added last
  var LINES = document.createElementNS(NS, "g");
  var NODES = document.createElementNS(NS, "g");
  svg.appendChild(LINES);
  svg.appendChild(NODES);

  function el(t, a) {
    var n = document.createElementNS(NS, t);
    for (var k in a) { if (a[k] !== undefined) { n.setAttribute(k, a[k]); } }
    return n;
  }
  function tx(t, a, s) { var n = el(t, a); n.textContent = s; return n; }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function head(x, y, dir, cls) {
    var p = dir === "right" ? [x, y, x - 7, y - 4.5, x - 7, y + 4.5]
          : dir === "down"  ? [x, y, x - 4.5, y - 7, x + 4.5, y - 7]
          :                   [x, y, x - 4.5, y + 7, x + 4.5, y + 7];
    return el("polygon", { "class": "ce-head" + (cls ? " " + cls : ""), points: p.join(",") });
  }
  function wrapText(s, max, lines) {
    var w = s.split(" "), out = [], line = "";
    for (var i = 0; i < w.length; i++) {
      var t = line ? line + " " + w[i] : w[i];
      if (t.length > max && line) { out.push(line); line = w[i]; } else { line = t; }
    }
    if (line) { out.push(line); }
    return out.slice(0, lines);
  }

  /* ── read the spine ── */
  var STEP = {}, BREAK = {}, PHASE = {};
  document.querySelectorAll("section.phase").forEach(function (sec) {
    var hd = sec.querySelector(".phase-head");
    var ph = {
      letter: hd.querySelector(".letter").textContent.trim(),
      name: hd.querySelector("h2").textContent.trim(),
      who: hd.querySelector(".who").textContent.trim()
    };
    PHASE[ph.letter] = ph;
    var last = null;
    Array.prototype.forEach.call(sec.children, function (c) {
      if (!c.matches) { return; }
      if (c.matches("article.step")) {
        var n = parseInt(c.querySelector(".num").textContent.trim(), 10);
        var h3 = c.querySelector("h3").cloneNode(true);
        var badge = h3.querySelector("span");
        if (badge) { badge.remove(); }
        STEP[n] = { n: n, label: h3.textContent.trim(), el: c, phase: ph };
        last = n;
      } else if (c.matches(".break")) {
        // template: the renderer stamps the step a break leaves on data-after
        var aft = c.getAttribute("data-after");
        var lk = aft != null ? Number(aft) : (last === null ? "lead" : last);
        BREAK[lk] = {
          el: c, leaves: aft != null ? Number(aft) : last,
          label: c.querySelector(".between").textContent.trim().replace(/^Chain break\s*·\s*/i, "")
        };
      }
    });
  });
  // phase D opens with the hand-off out of phase C, so that break leaves step 15
  // a break that opens a phase carries data-after = the last step of the phase before

  var at = {};
  ROWS.forEach(function (t, r) {
    t.cells.forEach(function (n, c) {
      at[n] = { x: COL(c), y: ROW(r), cx: COL(c) + NW / 2, cy: ROW(r) + NH / 2, row: r, col: c };
    });
    (t.below || []).forEach(function (b) {
      var src = t.cells.indexOf(b[1]), c = src < 0 ? t.cells.length - 1 : src;
      var y = ROW(r) + NH + 46;
      at[b[0]] = { x: COL(c), y: y, cx: COL(c) + NW / 2, cy: y + NH / 2, row: r, col: c };
    });
  });

  /* ── phase gutter: the role list wraps, it does not run under the nodes ── */
  ROWS.forEach(function (t, r) {
    var ph = PHASE[t.letter], y = ROW(r), g = el("g", { "class": "pg" });
    g.appendChild(tx("text", { "class": "pl", x: 6, y: y + 18 }, ph.letter));
    wrapText(ph.name, 15, 2).forEach(function (ln, i) {
      g.appendChild(tx("text", { "class": "pn", x: 26, y: y + 18 + i * 14 }, ln));
    });
    // rule sits ABOVE the role list: three roles would otherwise cross it
    g.appendChild(el("line", { "class": "prl", x1: 6, y1: y + 38, x2: GUTTER - 30, y2: y + 38 }));
    ph.who.split(/\s*·\s*/).forEach(function (role, i) {
      g.appendChild(tx("text", { "class": "pw", x: 6, y: y + 52 + i * 11 }, role));
    });
    LINES.appendChild(g);
  });

  /* ── a severed hand-off. The cut bars are drawn ACROSS the run, so a cut
        horizontal edge cannot read as a continuing one. ── */
  var focusables = [];
  function sever(dA, dB, mx, my, key, orient) {
    var g = el("g", { "class": "cb", "data-brk": key, tabindex: "0", role: "button",
                      "aria-label": "Chain break: " + BREAK[key].label });
    g.appendChild(el("path", { "class": "stub", d: dA }));
    g.appendChild(el("path", { "class": "stub", d: dB }));
    var bars = orient === "v"
      ? [[mx - 7, my - 2.5, mx + 7, my - 2.5], [mx - 7, my + 2.5, mx + 7, my + 2.5]]
      : [[mx - 2.5, my - 7, mx - 2.5, my + 7], [mx + 2.5, my - 7, mx + 2.5, my + 7]];
    bars.forEach(function (b) {
      g.appendChild(el("line", { "class": "cut", x1: b[0], y1: b[1], x2: b[2], y2: b[3] }));
    });
    g.appendChild(el("rect", { "class": "hit", x: mx - 18, y: my - 16, width: 36, height: 32 }));
    focusables.push({ order: Number(key) + 0.5, g: g });
  }

  /* ── trunk edges within a row ── */
  ROWS.forEach(function (t) {
    var skip = {};
    (t.noEdge || []).forEach(function (p) { skip[p[0] + ">" + p[1]] = 1; });
    for (var i = 0; i < t.cells.length - 1; i++) {
      var n = t.cells[i], m = t.cells[i + 1];
      if (skip[n + ">" + m] || ASIDE[n] || ASIDE[m]) { continue; }
      var a = at[n], b = at[m], x1 = a.x + NW, x2 = b.x, mid = (x1 + x2) / 2;
      if (BREAK_AT[n] && BREAK[n]) {
        sever("M" + x1 + "," + a.cy + " H" + (mid - 6),
              "M" + (mid + 6) + "," + a.cy + " H" + x2, mid, a.cy, n, "h");
      } else {
        LINES.appendChild(el("path", { "class": "ce", d: "M" + x1 + "," + a.cy + " H" + (x2 - 6) }));
        LINES.appendChild(head(x2, a.cy, "right"));
      }
    }
  });

  /* ── wraps: a row's exit into the next row's entry ── */
  ROWS.forEach(function (t, r) {
    if (r === ROWS.length - 1) { return; }
    var key = t.exit, a = at[key], b = at[ROWS[r + 1].entry], lane = WRAPLANE(r);
    var dx = a.cx;
    if (LANE[r]) { lane += LANE[r].extra; dx = LANE[r].dropX; }
    var down = dx === a.cx
      ? "M" + a.cx + "," + (a.y + NH) + " V" + (lane - 10) +
        " Q" + a.cx + "," + lane + " " + (a.cx - 14) + "," + lane
      : "M" + (a.x + NW) + "," + a.cy + " H" + (dx - 10) + " Q" + dx + "," + a.cy + " " + dx + "," + (a.cy + 10) +
        " V" + (lane - 10) + " Q" + dx + "," + lane + " " + (dx - 14) + "," + lane;
    var across = " H" + (b.cx + 14) + " Q" + b.cx + "," + lane + " " + b.cx + "," + (lane + 10) +
                 " V" + (b.y - 6);
    if (BREAK_AT[key] && BREAK[key]) {
      var mx = (dx + b.cx) / 2;
      sever(down + " H" + (mx + 10), "M" + (mx - 10) + "," + lane + across, mx, lane, key, "h");
    } else {
      LINES.appendChild(el("path", { "class": "ce", d: down + across }));
      LINES.appendChild(head(b.cx, b.y, "down"));
      if (LOST && key === LOST.from) {
        LINES.appendChild(tx("text", { "class": "elab", x: a.cx + 10, y: a.y + NH + 26 }, LOST.won || "won"));
      }
    }
  });

  /* ── step 10: lost ends the chain ── */
  (function () {
    if (!LOST || !at[LOST.from]) { return; }
    var a = at[LOST.from], x0 = a.x + NW + 36, ty = a.cy - 18;
    LINES.appendChild(el("path", { "class": "ce thin", d: "M" + (a.x + NW) + "," + a.cy + " H" + (x0 - 6) }));
    LINES.appendChild(head(x0, a.cy, "right"));
    var g = el("g", { "class": "term" });
    g.appendChild(el("rect", { "class": "tb", x: x0, y: ty, width: 120, height: 36, rx: 2 }));
    g.appendChild(tx("text", { "class": "tt", x: x0 + 14, y: ty + 23 }, LOST.text));
    LINES.appendChild(g);
    LINES.appendChild(tx("text", { "class": "elab oxide", x: x0 + 2, y: ty - 8 }, LOST.label));
  })();

  /* ── off-trunk: the arc over the row, and the monthly step below it ── */
  ROWS.forEach(function (t, r) {
    (t.arcs || []).forEach(function (arc) {
      var a = at[arc[0]], b = at[arc[1]], top = ARCTOP(r);
      LINES.appendChild(el("path", { "class": "ce dash",
        d: "M" + a.cx + "," + a.y + " V" + (top + 10) +
           " Q" + a.cx + "," + top + " " + (a.cx + 14) + "," + top +
           " H" + (b.cx - 14) + " Q" + b.cx + "," + top + " " + b.cx + "," + (top + 10) +
           " V" + (b.y - 6) }));
      LINES.appendChild(head(b.cx, b.y, "down"));
      // anchored off the arc's left corner, clear of the wrap's descent column
      LINES.appendChild(tx("text", { "class": "elab", x: a.cx + 22, y: top - 7 }, arc[2]));
    });
    (t.below || []).forEach(function (bl) {
      var p = at[bl[0]], s = at[bl[1]];
      LINES.appendChild(el("path", { "class": "ce dash", d: "M" + s.cx + "," + (s.y + NH) + " V" + (p.y - 6) }));
      LINES.appendChild(head(p.cx, p.y, "down"));
      LINES.appendChild(tx("text", { "class": "elab", x: p.cx + 10, y: p.y - 13 }, bl[2]));
    });
  });

  /* ── reject loops, offset in x so they never sit under the wrap ── */
  REJECT.forEach(function (pair) {
    var a = at[pair[0]], b = at[pair[1]], dip = a.y + NH + 30, dx = 18;
    LINES.appendChild(el("path", { "class": "ce reject",
      d: "M" + (a.cx + dx) + "," + (a.y + NH) + " V" + (dip - 8) +
         " Q" + (a.cx + dx) + "," + dip + " " + (a.cx + dx - 12) + "," + dip +
         " H" + (b.cx + dx + 12) + " Q" + (b.cx + dx) + "," + dip + " " + (b.cx + dx) + "," + (dip - 8) +
         " V" + (b.y + NH + 6) }));
    LINES.appendChild(head(b.cx + dx, b.y + NH, "up", "reject"));
    LINES.appendChild(tx("text", { "class": "elab teal", x: (a.cx + b.cx) / 2 + dx, y: dip + 14,
                                   "text-anchor": "middle" }, "reject"));
  });

  /* ── the tail: the last step runs into nothing (chain.tail) ── */
  (function () {
    if (!TAIL) { return; }
    var tn = Number(TAIL.step), p = at[tn];
    if (!p) { return; }
    var y = p.y + NH, lbl = BREAK[tn] ? BREAK[tn].label : (TAIL.label || "no terminal state");
    var g = el("g", { "class": "cb", "data-brk": tn, tabindex: "0", role: "button",
                      "aria-label": "Chain break: " + lbl });
    g.appendChild(el("path", { "class": "stub", d: "M" + p.cx + "," + y + " V" + (y + 9) }));
    g.appendChild(el("line", { "class": "cut", x1: p.cx - 7, y1: y + 14, x2: p.cx + 7, y2: y + 14 }));
    g.appendChild(el("line", { "class": "cut", x1: p.cx - 7, y1: y + 19, x2: p.cx + 7, y2: y + 19 }));
    g.appendChild(el("rect", { "class": "hit", x: p.cx - 18, y: y, width: 36, height: 26 }));
    focusables.push({ order: tn + 0.5, g: g });
    LINES.appendChild(tx("text", { "class": "elab oxide", x: p.cx, y: y + 36, "text-anchor": "middle" },
                         TAIL.label || "no terminal state"));
  })();

  /* ── nodes, with entry and optional marked on the node itself ── */
  Object.keys(at).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) {
    var p = at[n], s = STEP[n];
    if (!s) { return; }
    var g = el("g", { "class": "cn" + (ASIDE[n] ? " aside" : "") + (PITFALL[n] ? " pitfall" : ""),
                      "data-step": n, tabindex: "0", role: "button",
                      "aria-label": "Step " + n + ": " + s.label +
                                    (ENTERS[n] ? ". Customers arriving by " + ENTERS[n] + " start here" : "") });
    g.appendChild(el("rect", { "class": "bx", x: p.x, y: p.y, width: NW, height: NH, rx: 2 }));
    if (PITFALL[n]) { g.appendChild(el("circle", { "class": "ring", cx: p.x + 17, cy: p.y + 13.5, r: 9 })); }
    g.appendChild(tx("text", { "class": "nm", x: p.x + 11, y: p.y + 18 }, pad(n)));
    wrapText(SHORT[n] || s.label, 16, 3).forEach(function (ln, i) {
      g.appendChild(tx("text", { "class": "tl", x: p.x + 10, y: p.y + 34 + i * 13 }, ln));
    });
    NODES.appendChild(g);

    // badges sit ABOVE the box, centred — no route to collide with anything
    if (ENTERS[n]) {
      NODES.appendChild(el("polygon", { "class": "ce-head entry",
        points: p.cx + "," + p.y + " " + (p.cx - 4.5) + "," + (p.y - 7) + " " + (p.cx + 4.5) + "," + (p.y - 7) }));
      NODES.appendChild(tx("text", { "class": "elab teal", x: p.cx, y: p.y - 12, "text-anchor": "middle" },
                           "enters: " + ENTERS[n]));
    }
    if (OPTIONAL[n]) {
      NODES.appendChild(tx("text", { "class": "elab", x: p.cx, y: p.y - 10, "text-anchor": "middle" },
                           OPTIONAL[n]));
    }
  });

  // focusable groups last, in step order, so tab order follows the chain
  focusables.sort(function (a, b) { return a.order - b.order; })
            .forEach(function (f) { svg.appendChild(f.g); });

  /* ── detail pane ── */
  function clearOn() {
    svg.querySelectorAll(".cn.on, .cb.on").forEach(function (n) { n.classList.remove("on"); });
  }
  function phaseHead(ph) {
    var d = document.createElement("div");
    d.className = "cp-phase";
    d.innerHTML = "<b>" + ph.letter + '</b><span class="pn">' + ph.name +
                  '</span><span class="pw">' + ph.who + "</span>";
    return d;
  }
  function showStep(n) {
    var s = STEP[n];
    if (!s) { return; }
    clearOn();
    var g = svg.querySelector('.cn[data-step="' + n + '"]');
    if (g) { g.classList.add("on"); }
    // role view: the pane holds "My flow"; point at the step there instead
    if (window.SOP_ROLE && window.SOP_ROLE.active()) { window.SOP_ROLE.point(n); return; }
    pane.classList.remove("on-break");
    pane.innerHTML = "";
    pane.appendChild(phaseHead(s.phase));
    var k = document.createElement("span");
    k.className = "cp-num";
    k.textContent = "Step " + pad(n);
    pane.appendChild(k);

    var art = s.el.cloneNode(true);
    // the clone must not duplicate the real article's id, or every #step-N
    // link in the page resolves to the pane instead of the document
    art.removeAttribute("id");
    var what = art.querySelector("p.what"), watch = art.querySelector(".watch");
    if (what && watch && what.parentNode === watch.parentNode) {
      var host = what.parentNode, cols = document.createElement("div");
      cols.className = "cp-cols";
      what.classList.add("cp-what");
      host.insertBefore(cols, what);
      cols.appendChild(what);
      cols.appendChild(watch);
    }
    pane.appendChild(art);
    if (BREAK[n]) { pane.appendChild(BREAK[n].el.cloneNode(true)); }

    var o = document.createElement("div");
    o.className = "cp-open";
    o.innerHTML = '<a href="#step-' + n + '">Open step ' + pad(n) + " in the document ↓</a>";
    pane.appendChild(o);
  }
  function showBreak(key) {
    var b = BREAK[key];
    if (!b) { return; }
    clearOn();
    var g = svg.querySelector('.cb[data-brk="' + key + '"]');
    if (g) { g.classList.add("on"); }
    if (window.SOP_ROLE && window.SOP_ROLE.active()) { window.SOP_ROLE.point(null); return; }
    pane.classList.add("on-break");
    pane.innerHTML = "";
    var leaves = STEP[b.leaves];
    if (leaves) { pane.appendChild(phaseHead(leaves.phase)); }
    var k = document.createElement("span");
    k.className = "cp-num";
    k.textContent = "Chain break";
    pane.appendChild(k);
    pane.appendChild(b.el.cloneNode(true));
    if (leaves) {
      var o = document.createElement("div");
      o.className = "cp-open";
      o.innerHTML = '<a href="#step-' + leaves.n + '">Leaves step ' + pad(leaves.n) +
                    ", " + leaves.label + " ↓</a>";
      pane.appendChild(o);
    }
  }
  function bind(sel, attr, fn) {
    svg.querySelectorAll(sel).forEach(function (n) {
      var k = Number(n.getAttribute(attr));
      n.addEventListener("mouseenter", function () { fn(k); });
      n.addEventListener("focus", function () { fn(k); });
      n.addEventListener("click", function () { fn(k); });
      n.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(k); }
      });
    });
  }
  bind(".cn", "data-step", showStep);
  bind(".cb", "data-brk", showBreak);

  /* a click (or Enter) on a step opens the full operator guide in a modal;
     hover and focus keep driving the summary pane */
  svg.querySelectorAll(".cn").forEach(function (n) {
    var k = Number(n.getAttribute("data-step"));
    n.addEventListener("click", function () { if (window.openStepGuide) { window.openStepGuide(k); } });
    n.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && window.openStepGuide) { window.openStepGuide(k); }
    });
  });
  // chain order: row by row, each row's cells then the boxes below it (step order), then anything unplaced
  var ORDER = [], PLACED = {};
  ROWS.forEach(function (t) {
    t.cells.concat((t.below || []).map(function (b) { return b[0]; }).sort(function (a, b) { return a - b; }))
      .forEach(function (n) { if (STEP[n] && !PLACED[n]) { PLACED[n] = 1; ORDER.push(n); } });
  });
  Object.keys(STEP).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) { if (!PLACED[n]) { ORDER.push(n); } });
  window.SOP = { STEP: STEP, BREAK: BREAK, showStep: showStep, ORDER: ORDER };

  /* the fix checklist below hands us a target: scroll the chart into view,
     select it in the pane, and flash the shape so it can be found by eye */
  window.chainFocus = function (kind, n) {
    var sel = kind === "b" ? '.cb[data-brk="' + n + '"]' : '.cn[data-step="' + n + '"]';
    var g = svg.querySelector(sel);
    if (!g) { return false; }
    if (kind === "b") { showBreak(n); } else { showStep(n); }
    var canvas = document.querySelector(".chain-canvas");
    if (canvas && canvas.scrollIntoView) { canvas.scrollIntoView({ block: "center" }); }
    // bring it into the canvas's own horizontal scroll too
    if (canvas && g.getBBox) {
      try {
        var bb = g.getBBox(), vb = svg.viewBox.baseVal;
        if (vb && vb.width) {
          var want = (bb.x + bb.width / 2) / vb.width * canvas.scrollWidth - canvas.clientWidth / 2;
          canvas.scrollLeft = Math.max(0, want);
        }
      } catch (e) { /* getBBox throws on a hidden svg; the selection still happened */ }
    }
    g.classList.remove("flash");
    void g.getBoundingClientRect();
    g.classList.add("flash");
    setTimeout(function () { g.classList.remove("flash"); }, 1200);
    return true;
  };

  var firstN = Object.keys(STEP).map(Number).sort(function (a, b) { return a - b; })[0];
  if (firstN != null) { showStep(firstN); }
})();

/* ── role view: "show me my flow" ──────────────────────────────────────
   Only when sop-data has roles[]. A rail left of the chart (a select above it
   on narrow screens) picks a role: its steps light up, everything else fades,
   and the pane lists the role's steps in chain order with the hand-offs where
   work arrives from or leaves to other roles. ?role=<id> wins over the last
   pick remembered in localStorage; an unknown id falls back to All. */
(function () {
  var D = window.SOP_DATA || {}, SOP = window.SOP;
  var ROLES = Array.isArray(D.roles) ? D.roles.filter(function (r) { return r && typeof r.id === "string" && r.id; }) : [];
  var chain = document.querySelector("#map .chain"), svg = document.getElementById("chain-svg"), pane = document.getElementById("chain-pane");
  if (!ROLES.length || !SOP || !SOP.ORDER || !chain || !svg || !pane) { return; }
  var SLUG = (D.meta || {}).slug || "page", KEY = "sop." + SLUG + ".role";
  var BY_ID = {}, ACT = {}, STEPD = {};
  ROLES.forEach(function (r) { BY_ID[r.id] = r; });
  (D.steps || []).forEach(function (s) {
    STEPD[s.n] = s;
    var m = {};
    (Array.isArray(s.actors) ? s.actors : []).forEach(function (a) {
      if (!a || !BY_ID[a.role]) { return; }
      m[a.role] = m[a.role] || [];
      if (m[a.role].indexOf(a.part) < 0) { m[a.role].push(a.part); }
    });
    ACT[s.n] = m;
  });
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function title(n) { return SOP.STEP[n] ? SOP.STEP[n].label : (STEPD[n] || {}).title || ""; }
  function name(id) { return BY_ID[id] ? BY_ID[id].name || id : id; }
  function parts(n, id) { return (ACT[n] || {})[id] || []; }
  function does(n) { return ROLES.map(function (r) { return r.id; }).filter(function (id) { return parts(n, id).indexOf("does") >= 0; }); }
  function counts(id) { return SOP.ORDER.filter(function (n) { var p = parts(n, id); return p.indexOf("does") >= 0 || p.indexOf("approves") >= 0; }).length; }

  /* hand-offs: consecutive steps in chain order whose set of "does" roles differs */
  var HANDOFFS = [];
  for (var i = 1; i < SOP.ORDER.length; i++) {
    var a = SOP.ORDER[i - 1], b = SOP.ORDER[i], da = does(a), db = does(b);
    if (da.join("|") !== db.join("|")) { HANDOFFS.push({ from: a, to: b, fromRoles: da, toRoles: db }); }
  }

  /* controls */
  var current = "";
  var rail = document.createElement("nav");
  rail.className = "role-rail";
  rail.setAttribute("aria-label", "Show the flow for one role");
  var rhtml = '<p class="rr-head" id="rr-head">Show my flow</p><div class="rr-list" role="group" aria-labelledby="rr-head">' +
    '<button type="button" class="rr-btn" data-role="" aria-pressed="true"><span class="nm">All roles</span><span class="ct">' + SOP.ORDER.length + "</span></button>";
  var shtml = '<label for="role-select">Show my flow</label><select id="role-select"><option value="">All roles (' + SOP.ORDER.length + " steps)</option>";
  ROLES.forEach(function (r) {
    var c = counts(r.id), col = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(r.color || "") ? r.color : "";
    rhtml += '<button type="button" class="rr-btn" data-role="' + esc(r.id) + '" aria-pressed="false"' + (col ? ' style="--rr:' + col + '"' : "") + ">" +
      (col ? '<span class="sw" aria-hidden="true"></span>' : "") + '<span class="nm">' + esc(r.name || r.id) + '</span><span class="ct" title="' + c + ' steps">' + c + "</span></button>";
    shtml += '<option value="' + esc(r.id) + '">' + esc(r.name || r.id) + " (" + c + ")</option>";
  });
  rail.innerHTML = rhtml + "</div>";
  var selBox = document.createElement("div");
  selBox.className = "role-select";
  selBox.innerHTML = shtml + "</select>";
  chain.classList.add("has-roles");
  chain.insertBefore(rail, chain.firstChild);
  chain.parentNode.insertBefore(selBox, chain);
  var sel = selBox.querySelector("select");

  function lastStep() { var on = svg.querySelector(".cn.on"); return on ? Number(on.getAttribute("data-step")) : SOP.ORDER[0]; }

  function renderFlow(id) {
    var r = BY_ID[id], mine = SOP.ORDER.filter(function (n) { return parts(n, id).length; });
    var nd = 0, na = 0, nw = 0;
    mine.forEach(function (n) { var p = parts(n, id); if (p.indexOf("does") >= 0) { nd++; } if (p.indexOf("approves") >= 0) { na++; } if (p.indexOf("watches") >= 0) { nw++; } });
    var inAt = {}, outAt = {};
    HANDOFFS.forEach(function (h) {
      var f = h.fromRoles.indexOf(id) >= 0, t = h.toRoles.indexOf(id) >= 0;
      if (t && !f) { (inAt[h.to] = inAt[h.to] || []).push(h); }
      if (f && !t) { (outAt[h.from] = outAt[h.from] || []).push(h); }
    });
    function who(list) { return list.length ? list.map(name).join(" & ") : "no assigned role"; }
    function card(h, dir) {
      var other = dir === "in" ? h.from : h.to, roles = dir === "in" ? h.fromRoles : h.toRoles;
      var aria = "Hand-off from step " + h.from + " " + title(h.from) + " (" + who(h.fromRoles) + ") to step " + h.to + " " + title(h.to) + " (" + who(h.toRoles) + ")";
      return '<li class="rf-hand ' + dir + '" data-from="' + h.from + '" data-to="' + h.to + '" title="' + esc(aria) + '">' +
        (dir === "in" ? "← From " : "→ To ") + "<b>" + esc(who(roles)) + "</b> · step " + other + " " + esc(title(other)) + "</li>";
    }
    var sum = [nd ? "does " + nd : "", na ? "approves " + na : "", nw ? "watches " + nw : ""].filter(Boolean).join(" · ");
    var html = '<span class="cp-num">My flow · ' + esc(r.name || id) + "</span>" + '<p class="rf-sum">' + (sum || "no steps yet") + "</p>";
    if (!mine.length) { html += '<p class="rf-empty">No step names this role yet.</p>'; }
    else {
      html += '<ol class="rf-list">';
      mine.forEach(function (n) {
        (inAt[n] || []).forEach(function (h) { html += card(h, "in"); });
        var p = parts(n, id), badge = p.indexOf("does") < 0 ? p.join(" · ") : "";
        html += '<li class="rf-step"><button type="button" data-step="' + n + '"><span class="n">' + pad(n) + '</span><span class="t">' + esc(title(n)) + "</span>" +
          (badge ? '<span class="rf-part">' + esc(badge) + "</span>" : "<span></span>") + "</button></li>";
        (outAt[n] || []).forEach(function (h) { html += card(h, "out"); });
      });
      html += "</ol>";
    }
    pane.classList.remove("on-break");
    pane.innerHTML = html;
    Array.prototype.forEach.call(pane.querySelectorAll(".rf-step button"), function (btn) {
      var n = Number(btn.getAttribute("data-step"));
      btn.addEventListener("click", function () { if (window.openStepGuide) { window.openStepGuide(n); } });
      btn.addEventListener("mouseenter", function () { SOP.showStep(n); });
      btn.addEventListener("focus", function () { SOP.showStep(n); });
    });
  }

  function paintNodes(id) {
    svg.querySelectorAll(".cn").forEach(function (g) {
      var p = id ? parts(Number(g.getAttribute("data-step")), id) : [];
      var lit = p.indexOf("does") >= 0 || p.indexOf("approves") >= 0;
      g.classList.toggle("role-lit", !!id && lit);
      g.classList.toggle("role-watch", !!id && !lit && p.length > 0);
      g.classList.toggle("role-fade", !!id && !p.length);
    });
  }

  function select(id, opts) {
    opts = opts || {};
    if (id && !BY_ID[id]) { id = ""; }
    var was = current;
    current = id;
    chain.classList.toggle("role-on", !!id);
    Array.prototype.forEach.call(rail.querySelectorAll(".rr-btn"), function (b) { b.setAttribute("aria-pressed", String((b.getAttribute("data-role") || "") === id)); });
    sel.value = id;
    paintNodes(id);
    if (id) { svg.querySelectorAll(".cn.on, .cb.on").forEach(function (g) { g.classList.remove("on"); }); renderFlow(id); } else if (was) { SOP.showStep(lastStep()); }
    if (!opts.init || opts.clean) {
      try {
        var u = new URL(window.location.href);
        if (id) { u.searchParams.set("role", id); } else { u.searchParams.delete("role"); }
        if (u.href !== window.location.href && history.replaceState) { history.replaceState(history.state, "", u.href); }
      } catch (e) { /* opaque or sandboxed location */ }
    }
    if (!opts.init) {
      try { if (id) { localStorage.setItem(KEY, id); } else { localStorage.removeItem(KEY); } } catch (e) { /* blocked */ }
    }
  }

  rail.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".rr-btn") : null;
    if (b) { select(b.getAttribute("data-role") || ""); }
  });
  sel.addEventListener("change", function () { select(sel.value); });

  window.SOP_ROLE = {
    roles: ROLES, handoffs: HANDOFFS,
    active: function () { return !!current; },
    current: function () { return current; },
    parts: function (n) { return current ? parts(n, current) : []; },
    select: function (id) { select(id || ""); },
    point: function (n) {
      Array.prototype.forEach.call(pane.querySelectorAll(".rf-step button"), function (b) {
        b.classList.toggle("on", n != null && Number(b.getAttribute("data-step")) === n);
      });
    },
    // one line for the step guide head, or null when no role is picked
    headLine: function (n) {
      if (!current) { return null; }
      var p = parts(n, current), d = document.createElement("div");
      d.className = "sm-rolepart";
      d.innerHTML = "<b>" + esc(name(current)) + "</b> · " + (p.length ? "your part: " + esc(p.join(" · ")) : "not one of your steps");
      return d;
    }
  };

  var want = null, fromUrl = false;
  try { want = new URL(window.location.href).searchParams.get("role"); fromUrl = want != null; } catch (e) { want = null; }
  if (!fromUrl) { try { want = localStorage.getItem(KEY); } catch (e) { want = null; } }
  if (want && BY_ID[want]) { select(want, { init: true }); }
  else { select("", { init: true, clean: fromUrl }); }
})();

/* ── the document is collapsed by default ───────────────────────────────
   It stays in the DOM: the chart above and the detail pane are built from
   these very elements. Anything that navigates INTO it opens it first, or
   the link would land on a hidden target and the page would not move. */
(function () {
  var body = document.getElementById("doc-body");
  var btn = document.getElementById("doc-toggle");
  if (!body || !btn) { return; }

  function setOpen(open) {
    body.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? "Hide the document"
      : "Show all " + body.querySelectorAll("article.step").length + " steps";
  }

  btn.addEventListener("click", function () { setOpen(body.hidden); });

  // any in-page link into the document opens it, then lets the jump happen
  function revealFor(hash) {
    if (!hash || hash.length < 2) { return false; }
    var target = null;
    try { target = document.getElementById(hash.slice(1)); } catch (e) { return false; }
    if (target && body.contains(target)) { setOpen(true); return true; }
    return false;
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) { return; }
    if (revealFor(a.getAttribute("href"))) {
      // re-aim at the target now that it has a layout box
      var id = a.getAttribute("href").slice(1);
      var el = document.getElementById(id);
      if (el) {
        e.preventDefault();
        if (el.scrollIntoView) { el.scrollIntoView({ block: "start" }); }
        if (history.replaceState) { history.replaceState(null, "", "#" + id); }
      }
    }
  });

  window.addEventListener("hashchange", function () {
    if (revealFor(location.hash)) {
      var el = document.getElementById(location.hash.slice(1));
      if (el) { if (el.scrollIntoView) { el.scrollIntoView({ block: "start" }); } }
    }
  });

  // arriving with a deep link already in the URL
  if (revealFor(location.hash)) {
    var el = document.getElementById(location.hash.slice(1));
    if (el) { if (el.scrollIntoView) { el.scrollIntoView({ block: "start" }); } }
  }

  // printing must not hand over a document the reader cannot see
  if (window.matchMedia) {
    var mq = window.matchMedia("print");
    if (mq.addEventListener) { mq.addEventListener("change", function (m) { if (m.matches) { setOpen(true); } }); }
  }
  window.addEventListener("beforeprint", function () { setOpen(true); });

  setOpen(false);
})();

/* ── the fix browser ────────────────────────────────────────────────────
   Steps on the left, that step's defects on the right, each one tickable and
   commentable. Two sources, one list: the 18 ranked chain defects (the <ol>
   below, kept in the DOM as the data and for print) and the step-local
   findings carried in the step-guide JSON.

   Ticks live at `fixes/<id>` and comments in `comments/`, so two people
   working the list see each other. With no store the page still works — a
   tick is then this browser's alone, and commenting is switched off. */
(function () {
  var rail = document.getElementById("fx-steps");
  var detail = document.getElementById("fx-detail");
  var list = document.getElementById("gaps");
  var countEl = document.getElementById("gap-count");
  var totalEl = document.getElementById("gap-total");
  var syncEl = document.getElementById("gap-sync");
  if (!rail || !detail || !list) { return; }

  var db = null, assets = null, current = "all";
  var prompts = {};              // step -> {text, at, by}
  var done = {};                 // id -> true
  var comments = {};             // id -> [{text, author, at}]
  var boxById = {};              // id -> the hidden list's checkbox
  var SLUG = ((window.SOP_DATA || {}).meta || {}).slug || "page";
  var LOCAL_DONE = "sop." + SLUG + ".fixDone", LOCAL_WHO = "sop." + SLUG + ".author";
  var localEl = document.getElementById("gap-local");
  function showLocalOnly() { if (localEl) { localEl.hidden = false; } }
  var who = "";
  try { who = localStorage.getItem(LOCAL_WHO) || ""; } catch (e) { /* blocked */ }

  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function slug(t) {
    return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  /* ── the model: the ranked ledger plus the step-local findings ─────── */
  var ITEMS = [];
  var BY_STEP = {};
  /* tracker fields (status, dates, history) come from the data by id, never from the DOM */
  var TK = window.SOPTrack || null;
  var FIXED = {};                // id -> true: locked, ticked, out of every open count
  var LEDGER_DATA = {};
  (((window.SOP_DATA || {}).ledger || {}).items || []).forEach(function (x) {
    if (x && x.id != null && !LEDGER_DATA[x.id]) { LEDGER_DATA[x.id] = x; }
  });
  function tracked(it, rec) {
    it.rec = rec || null;
    it.status = TK && rec ? TK.status(rec) : null;
    it.fixed = it.status === "fixed";
    if (it.fixed) { FIXED[it.id] = true; }
    return it;
  }

  Array.prototype.forEach.call(list.querySelectorAll("li[data-gap]"), function (li) {
    var box = li.querySelector('input[type="checkbox"]');
    var b = li.querySelector(".txt > b"), title = "";
    if (b) {
      var c = b.cloneNode(true);
      Array.prototype.forEach.call(c.querySelectorAll(".new-tag, .sev-tag, .status-tag, .rule-tag"), function (t) { t.remove(); });
      title = c.textContent.trim();
    }
    var steps = [];
    Array.prototype.forEach.call(li.querySelectorAll(".chip"), function (chip) {
      steps.push({ k: chip.getAttribute("data-k"), n: Number(chip.getAttribute("data-n")) });
    });
    var id = li.getAttribute("data-gap");
    if (box) { boxById[id] = box; }
    ITEMS.push(tracked({
      id: id, kind: "ledger", rank: (li.querySelector(".rank") || {}).textContent || "",
      title: title, why: (li.querySelector(".body") || {}).textContent || "",
      sev: ((li.querySelector(".sev-tag") || { getAttribute: function () { return undefined; } }).getAttribute("data-sev")) || undefined,
      src: (li.querySelector(".txt > .src") || {}).textContent || undefined,
      steps: steps
    }, LEDGER_DATA[id]));
  });

  /* A step fix that repeats a ledger item is not a second defect: sameAs names
     the ledger id, or the titles match once markup, case and punctuation are
     ignored (build-page.mjs normTitle, which warns about these). The step copy is
     dropped and the ledger item is made to cover the step instead. */
  function normTitle(s) {
    return String(s == null ? "" : s).replace(/<[^>]*>/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }
  var LEDGER_ID = {}, LEDGER_TITLE = {};
  ITEMS.forEach(function (it) {
    LEDGER_ID[it.id] = it;
    var k = normTitle(it.title);
    if (k && !LEDGER_TITLE[k]) { LEDGER_TITLE[k] = it; }
  });

  try {
    var raw = (window.SOP_DATA || {}).guide;
    if (raw) {
      raw.forEach(function (g) {
        (g.fixes || []).forEach(function (f) {
          var same = (f.sameAs != null && LEDGER_ID[f.sameAs]) || LEDGER_TITLE[normTitle(f.title)];
          if (same) {
            if (!same.steps.some(function (t) { return t.n === g.n; })) { same.steps.push({ k: "s", n: g.n }); }
            return;
          }
          // a migrated fix carries its id; older data derives it the same way migration did
          ITEMS.push(tracked({
            id: f.id != null && f.id !== "" ? String(f.id) : "s" + pad(g.n) + "-" + slug(f.title), kind: "local", sev: f.sev,
            title: f.title, why: f.why, repair: f.repair, src: f.src,
            steps: [{ k: "s", n: g.n }]
          }, f));
        });
      });
    }
  } catch (e) { /* no guide data: the ledger half still works */ }

  // an item that repairs step n AND the break after it is still one defect on step n
  ITEMS.forEach(function (it) {
    var seen = {};
    it.steps.forEach(function (t) {
      if (seen[t.n]) { return; }
      seen[t.n] = 1;
      (BY_STEP[t.n] = BY_STEP[t.n] || []).push(it);
    });
  });

  var STEP_LABEL = {};
  if (window.SOP && window.SOP.STEP) {
    Object.keys(window.SOP.STEP).forEach(function (n) { STEP_LABEL[n] = window.SOP.STEP[n].label; });
  }

  var SEV = { money: 0, data: 1, blocked: 2, friction: 3 };
  function itemsFor(key) {
    if (key === "all") {
      return ITEMS.filter(function (i) { return i.kind === "ledger"; })
                  .sort(function (x, y) { return Number(x.rank) - Number(y.rank); });
    }
    return (BY_STEP[key] || []).slice().sort(function (x, y) {
      if (x.kind !== y.kind) { return x.kind === "ledger" ? -1 : 1; }
      if (x.kind === "ledger") { return Number(x.rank) - Number(y.rank); }
      return (SEV[x.sev] == null ? 9 : SEV[x.sev]) - (SEV[y.sev] == null ? 9 : SEV[y.sev]);
    });
  }

  /* ── shared state ──────────────────────────────────────────────────── */
  function setDone(id, next) {
    if (FIXED[id]) { return; }     // a fixed item is locked: its tick is the tracker's, not a person's
    if (next) { done[id] = true; } else { delete done[id]; }
    if (boxById[id]) { boxById[id].checked = next; }
    paintProgress();
    if (db) {
      db.doc("fixes/" + id).set({ done: next }).catch(function () {
        if (syncEl) { syncEl.textContent = "· not saved"; }
      });
    } else {
      try { localStorage.setItem(LOCAL_DONE, JSON.stringify(Object.keys(done))); } catch (e) { /* blocked */ }
    }
    if (window.sopFixChanged) { window.sopFixChanged(id); }
  }
  try {
    (JSON.parse(localStorage.getItem(LOCAL_DONE) || "[]") || []).forEach(function (id) { done[id] = true; });
  } catch (e) { /* blocked */ }

  // open and partly-fixed items only: a fixed item is neither to do nor done
  function paintProgress() {
    var n = 0, t = 0;
    ITEMS.forEach(function (i) {
      if (i.fixed) { return; }
      t++;
      if (done[i.id]) { n++; }
    });
    if (countEl) { countEl.textContent = String(n); }
    if (totalEl) { totalEl.textContent = String(t); }
    Array.prototype.forEach.call(list.querySelectorAll("li[data-gap]"), function (li) {
      var id = li.getAttribute("data-gap");
      li.classList.toggle("done", !!done[id] && !FIXED[id]);
    });
  }

  /* ── left rail ─────────────────────────────────────────────────────── */
  function railRow(key, num, name) {
    var items = itemsFor(key), open = items.filter(function (i) { return !done[i.id] && !i.fixed; }).length;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "fx-step";
    btn.setAttribute("aria-current", String(key === current));
    btn.setAttribute("data-key", String(key));
    var ct = items.length === 0 ? '<span class="ct none">—</span>'
      : open === 0 ? '<span class="ct clear">all done</span>'
      : '<span class="ct">' + open + " open</span>";
    btn.innerHTML = '<span class="n">' + esc(num) + '</span><span class="nm">' + esc(name) + "</span>" + ct;
    btn.addEventListener("click", function () { select(key); });
    return btn;
  }
  function renderRail() {
    rail.innerHTML = "";
    rail.appendChild(railRow("all", "—", "All ranked defects"));
    Object.keys(STEP_LABEL).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) {
      rail.appendChild(railRow(n, pad(n), STEP_LABEL[n] || "Step " + pad(n)));
    });
  }

  /* ── detail pane ───────────────────────────────────────────────────── */
  /* ── comments: text, pictures and clips ────────────────────────────
     Files go to the artifact's own asset store and the comment keeps the
     returned ids, so a comment is a small JSON row pointing at them. With no
     asset store the text half still works and the attach controls stay out. */
  function mediaFigure(m) {
    var fig = document.createElement("figure");
    fig.className = "fx-media";
    var type = m.type || "";
    if (type.indexOf("video/") === 0) {
      var v = document.createElement("video");
      v.src = m.url;
      v.controls = true;
      v.preload = "metadata";
      fig.appendChild(v);
    } else {
      var a = document.createElement("a");
      a.href = m.url;
      a.target = "_blank";
      a.rel = "noopener";
      var img = document.createElement("img");
      img.src = m.url;
      img.alt = m.name || "Attached image";
      img.loading = "lazy";
      a.appendChild(img);
      fig.appendChild(a);
    }
    return fig;
  }

  function commentRow(c, fixId) {
    var li = document.createElement("li");
    var meta = document.createElement("span");
    meta.className = "meta";
    var when = c.at ? new Date(c.at).toLocaleString() : "";
    meta.textContent = (c.author || "Someone") + (when ? " · " + when : "");
    li.appendChild(meta);
    if (c.text) {
      var t = document.createElement("span");
      t.className = "body";
      t.textContent = c.text;
      li.appendChild(t);
    }
    if (c.media && c.media.length) {
      var box = document.createElement("div");
      box.className = "fx-media-row";
      c.media.forEach(function (m) { box.appendChild(mediaFigure(m)); });
      li.appendChild(box);
    }
    if (db && c.id) {
      var del = document.createElement("button");
      del.type = "button";
      del.className = "fx-del";
      del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete this comment");
      var armed = false;
      del.addEventListener("click", function () {
        if (!armed) {                       // two presses, no browser dialog
          armed = true;
          del.textContent = "Delete?";
          del.classList.add("armed");
          setTimeout(function () {
            if (!armed) { return; }
            armed = false;
            del.textContent = "Delete";
            del.classList.remove("armed");
          }, 4000);
          return;
        }
        del.disabled = true;
        del.textContent = "Deleting…";
        // the pictures go with the comment that carried them
        (c.media || []).forEach(function (m) {
          if (assets && m.id) { assets.delete(m.id).catch(function () { /* already gone */ }); }
        });
        db.collection("comments").doc(c.id).delete().catch(function () {
          del.disabled = false;
          del.textContent = "Delete";
          if (syncEl) { syncEl.textContent = "· not deleted"; }
        });
      });
      li.appendChild(del);
    }
    return li;
  }

  function commentList(id) {
    var rows = (comments[id] || []).slice().sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
    var wrap = document.createElement("section");
    wrap.className = "fx-comments";
    if (!rows.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = db ? "No comments yet." : "Comments need the published page — this copy has no shared store.";
      wrap.appendChild(p);
    } else {
      var ul = document.createElement("ul");
      rows.forEach(function (c) { ul.appendChild(commentRow(c, id)); });
      wrap.appendChild(ul);
    }

    var pending = [];                        // {file, url} waiting for Post
    var tray = document.createElement("div");
    tray.className = "fx-tray";
    tray.hidden = true;

    function paintTray() {
      tray.innerHTML = "";
      tray.hidden = pending.length === 0;
      pending.forEach(function (item, i) {
        var chip = document.createElement("span");
        chip.className = "fx-chip-file";
        if (item.file.type.indexOf("image/") === 0) {
          var thumb = document.createElement("img");
          thumb.src = item.url;
          thumb.alt = "";
          chip.appendChild(thumb);
        }
        chip.appendChild(document.createTextNode(item.file.name || (item.file.type.indexOf("video/") === 0 ? "clip" : "image")));
        var x = document.createElement("button");
        x.type = "button";
        x.textContent = "✕";
        x.setAttribute("aria-label", "Remove this attachment");
        x.addEventListener("click", function () {
          URL.revokeObjectURL(item.url);
          pending.splice(i, 1);
          paintTray();
        });
        chip.appendChild(x);
        tray.appendChild(chip);
      });
    }
    function queue(files) {
      Array.prototype.forEach.call(files, function (f) {
        if (!f || !/^(image|video)\//.test(f.type)) { return; }
        if (f.size > 20 * 1024 * 1024) {
          if (syncEl) { syncEl.textContent = "· " + (f.name || "file") + " is over 20 MB"; }
          return;
        }
        pending.push({ file: f, url: URL.createObjectURL(f) });
      });
      paintTray();
    }

    var form = document.createElement("form");
    form.className = "fx-comment-form";
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = assets ? "Add a comment — or paste a screenshot…" : "Add a comment…";
    input.maxLength = 800;
    input.disabled = !db;
    // paste a screenshot straight into the box
    input.addEventListener("paste", function (e) {
      var items = (e.clipboardData || {}).items || [];
      var files = [];
      Array.prototype.forEach.call(items, function (it) {
        if (it.kind === "file") {
          var f = it.getAsFile();
          if (f) { files.push(f); }
        }
      });
      if (files.length && assets) {
        e.preventDefault();
        queue(files);
      }
    });

    var file = document.createElement("input");
    file.type = "file";
    file.accept = "image/*,video/*";
    file.multiple = true;
    file.className = "fx-file";
    file.id = "fx-file-" + id;
    file.addEventListener("change", function () {
      queue(file.files);
      file.value = "";
    });
    var pick = document.createElement("label");
    pick.className = "fx-attach";
    pick.setAttribute("for", file.id);
    pick.textContent = "Attach";
    pick.title = "Attach images or video (20 MB each)";

    var send = document.createElement("button");
    send.type = "submit";
    send.textContent = "Post";
    send.disabled = !db;

    form.appendChild(input);
    if (assets) { form.appendChild(file); form.appendChild(pick); }
    form.appendChild(send);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if ((!text && !pending.length) || !db) { return; }
      send.disabled = true;
      send.textContent = pending.length ? "Uploading…" : "Posting…";
      var queued = pending.slice();
      Promise.all(queued.map(function (item) {
        return assets.upload(item.file).then(function (res) {
          return { id: res.id, url: res.url, type: res.contentType || item.file.type, name: item.file.name || "" };
        });
      })).then(function (media) {
        return db.collection("comments").add({
          fixId: id, text: text, author: who || "Anonymous", at: Date.now(), media: media,
        });
      }).then(function () {
        queued.forEach(function (item) { URL.revokeObjectURL(item.url); });
        input.value = "";
        pending = [];
        paintTray();
        send.disabled = false;
        send.textContent = "Post";
      }).catch(function () {
        send.disabled = false;
        send.textContent = "Post";
        if (syncEl) { syncEl.textContent = "· comment not saved"; }
      });
    });
    wrap.appendChild(tray);
    wrap.appendChild(form);
    return wrap;
  }

  function card(it) {
    var art = document.createElement("article");
    art.className = "fx-card k-" + (it.kind === "ledger" ? "ledger" : (it.sev || "friction")) +
                    (done[it.id] || it.fixed ? " is-done" : "") + (it.fixed ? " is-fixed" : "");
    art.setAttribute("data-id", it.id);
    var head = document.createElement("div");
    head.className = "fx-card-head";
    var tags = TK && it.rec ? TK.tags(it.rec) : "";
    head.innerHTML = it.kind === "ledger"
      ? '<span class="fx-tag rank">Rank ' + esc(it.rank) + "</span>" +
        (it.sev ? '<span class="fx-tag ' + esc(it.sev) + '">' + esc(it.sev) + "</span>" : "") + tags +
        "<h4>" + esc(it.title) + "</h4>"
      : '<span class="fx-tag ' + esc(it.sev) + '">' + esc(it.sev) + "</span>" + tags + "<h4>" + esc(it.title) + "</h4>";
    var lbl = document.createElement("label");
    lbl.className = "fx-done";
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!done[it.id] || it.fixed;
    if (it.fixed) {
      box.disabled = true;
      lbl.className += " locked";
      lbl.setAttribute("aria-disabled", "true");
      lbl.title = "Fixed in the code: the tracker holds this tick";
    }
    box.addEventListener("change", function () { setDone(it.id, box.checked); render(); });
    lbl.appendChild(box);
    lbl.appendChild(document.createTextNode("Done"));
    head.appendChild(lbl);
    art.appendChild(head);

    var why = document.createElement("p");
    why.textContent = it.why;
    art.appendChild(why);
    if (it.repair) {
      var rep = document.createElement("p");
      rep.className = "rep";
      rep.innerHTML = "<b>Repair</b>" + esc(it.repair);
      art.appendChild(rep);
    }
    if (it.src) {
      var src = document.createElement("p");
      src.className = "src";
      src.textContent = it.src;
      art.appendChild(src);
    }
    var dates = TK && it.rec ? TK.dates(it.rec) : "";
    if (dates) {
      var tr = document.createElement("p");
      tr.className = "trk";
      tr.innerHTML = dates;
      art.appendChild(tr);
    }
    var hist = TK && it.rec ? TK.history(it.rec) : "";
    if (hist) { art.insertAdjacentHTML("beforeend", hist); }
    if (it.kind === "ledger" && it.steps.length) {
      var st = document.createElement("p");
      st.className = "steps";
      st.innerHTML = "<b>Repairs</b>";
      it.steps.forEach(function (t) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (t.k === "b" ? " brk" : "");
        chip.textContent = t.k === "b" ? "Break at " + t.n : "Step " + t.n;
        chip.addEventListener("click", function () {
          if (typeof window.chainFocus === "function") { window.chainFocus(t.k, t.n); }
        });
        st.appendChild(chip);
      });
      art.appendChild(st);
    }
    art.appendChild(commentList(it.id));
    return art;
  }

  function render() {
    renderRail();
    detail.innerHTML = "";
    var head = document.createElement("div");
    head.className = "fx-head";
    var title = current === "all" ? "All ranked defects"
      : "Step " + pad(current) + " · " + (STEP_LABEL[current] || "");
    head.innerHTML = "<h3>" + esc(title) + "</h3>";
    var whoWrap = document.createElement("span");
    whoWrap.className = "who";
    whoWrap.appendChild(document.createTextNode("Commenting as "));
    var whoInput = document.createElement("input");
    whoInput.type = "text";
    whoInput.value = who;
    whoInput.placeholder = "your name";
    whoInput.setAttribute("aria-label", "Your name, shown on comments you post");
    whoInput.addEventListener("change", function () {
      who = whoInput.value.trim();
      try { localStorage.setItem(LOCAL_WHO, who); } catch (e) { /* blocked */ }
    });
    whoWrap.appendChild(whoInput);
    head.appendChild(whoWrap);
    detail.appendChild(head);

    var items = itemsFor(current);
    if (!items.length) {
      var p = document.createElement("p");
      p.className = "fx-empty";
      p.textContent = "Nothing outstanding on this step. It was audited against the code and no defect of its own was found.";
      detail.appendChild(p);
    }
    items.forEach(function (it) { detail.appendChild(card(it)); });
  }

  function select(key) {
    current = key;
    render();
  }

  paintProgress();
  render();

  window.SOPFix = {
    forStep: function (n) { return itemsFor(n); },
    /* the plan you ran /planpro for, kept per step so your colleague copies
       the same text you saved rather than the generated brief */
    savedPrompt: function (n) { return prompts[String(n)] || null; },
    canSave: function () { return !!db; },
    savePrompt: function (n, text) {
      if (!db) { return Promise.reject(new Error("no store")); }
      var row = { text: String(text), at: Date.now(), by: who || "Anonymous" };
      prompts[String(n)] = row;
      return db.doc("prompts/step-" + pad(n)).set(row);
    },
    isDone: function (id) { return !!done[id] || !!FIXED[id]; },
    isFixed: function (id) { return !!FIXED[id]; },
    record: function (id) {
      for (var i = 0; i < ITEMS.length; i++) { if (ITEMS[i].id === id) { return ITEMS[i].rec; } }
      return null;
    },
    setDone: setDone,
    commentCount: function (id) { return (comments[id] || []).length; },
    open: function (key) {
      select(key);
      if (window.sopOpenLedger) { window.sopOpenLedger(); }
    }
  };

  // outside claude.ai there is no shared store: say so next to the ticks
  if (!window.claude || !window.claude.use) { showLocalOnly(); return; }
  // writer-only: a read-only viewer gets null and simply never sees Attach
  window.claude.use("assets").then(function (store) {
    if (store) { assets = store; render(); }

/* ── app URL: every screen path on the page becomes a link into the app ──
   A path with a record parameter ($quotationId, <trade>) cannot be resolved
   from here, so it links to the deepest static screen above it — the list
   you pick the record from. */
(function () {
  var SD = window.SOP_DATA || {}, SM = SD.meta || {};
  var KEY = "sop." + (SM.slug || "page") + ".appBaseUrl", DEFAULT = SM.appBaseUrl || "";

  var input = document.getElementById("baseurl-input");
  var hint = document.getElementById("baseurl-hint");
  if (!form || !input || !hint) { return; }
  // the example path in the hint is the first screen the guide names
  var example = "";
  (SD.guide || []).some(function (g) {
    return (g.routes || []).some(function (r) {
      if (r.path && r.path.indexOf("$") < 0 && r.path.indexOf("<") < 0) { example = r.path; return true; }
      return false;
    });
  });
  if (SM.baseUrlHint) { hint.innerHTML = SM.baseUrlHint; }
  else if (example) { hint.querySelector("code").textContent = example; }
  var HINT = hint.innerHTML;
  var EMPTY_HINT = "Enter the app's address (e.g. https://app.example.com/) to turn every screen path on this page into a link.";
  var base = DEFAULT;
  try { base = localStorage.getItem(KEY) || DEFAULT; } catch (e) { /* storage blocked */ }
  input.value = base;
  if (SM.appBaseUrl) { input.placeholder = SM.appBaseUrl; }
  if (!base) { hint.textContent = EMPTY_HINT; }

  function valid(v) {
    try { var u = new URL(v); return u.protocol === "http:" || u.protocol === "https:"; }
    catch (e) { return false; }
  }
  // trade ledgers live under /order/<trade>; /order alone is not a screen
  var FALLBACK = SM.routeFallback || {};
  function staticPart(path) {
    var out = [];
    path.split("/").slice(1).some(function (seg) {
      if (!seg || seg.indexOf("$") === 0 || seg.indexOf("<") === 0) { return true; }
      out.push(seg);
      return false;
    });
    var p = "/" + out.join("/");
    return FALLBACK[p] || p;
  }
  function href(path) {
    // no app address yet: the link points at the form that asks for one
    if (!base) { return "#baseurl"; }
    return base.replace(/\/+$/, "") + staticPart(path);
  }
  function aim(a, path) {
    a.href = href(path);
    if (base) { a.target = "_blank"; } else { a.removeAttribute("target"); }
  }
  window.sopHref = href;
  window.sopAim = aim;
  window.sopStatic = staticPart;

  function makeLink(path) {
    var a = document.createElement("a");
    a.className = "route";
    a.setAttribute("data-path", path);
    a.rel = "noopener";
    aim(a, path);
    var sp = staticPart(path);
    a.title = sp === path ? "Open " + path : "Opens " + sp + " — pick the record there";
    a.textContent = path;
    var ext = document.createElement("span");
    ext.className = "ext";

    a.appendChild(ext);
    return a;

  window.sopRouteLink = makeLink;

  var RX = /(\/[A-Za-z0-9_$<>.\-]+(?:\/[A-Za-z0-9_$<>.\-]+)*\/?)/g;
  function linkify(root) {
    root.querySelectorAll(".where").forEach(function (w) {
      if (w.querySelector("a.route")) { return; }
      var walker = document.createTreeWalker(w, NodeFilter.SHOW_TEXT), nodes = [], t;
      while ((t = walker.nextNode())) { nodes.push(t); }
      nodes.forEach(function (node) {
        var s = node.nodeValue, frag = document.createDocumentFragment(), last = 0, m;
        RX.lastIndex = 0;
        while ((m = RX.exec(s))) {
          if (m.index > last) { frag.appendChild(document.createTextNode(s.slice(last, m.index))); }
          frag.appendChild(makeLink(m[1]));
          last = m.index + m[1].length;
        }
        if (!last) { return; }
        if (last < s.length) { frag.appendChild(document.createTextNode(s.slice(last))); }
        node.parentNode.replaceChild(frag, node);
      });
    });
  }
  window.sopLinkify = linkify;

  function refresh() {
    document.querySelectorAll("a.route[data-path]").forEach(function (a) {
      aim(a, a.getAttribute("data-path"));
    });
    document.querySelectorAll("[data-shot-path]").forEach(function (a) {
      aim(a, a.getAttribute("data-shot-path"));
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!valid(v)) {
      input.setAttribute("aria-invalid", "true");
      hint.classList.add("bad");
      hint.textContent = "Enter a full address starting with http:// or https://, e.g. " +
        (DEFAULT || "https://app.example.com/");

    }
    input.removeAttribute("aria-invalid");
    hint.classList.remove("bad");
    base = v;
    try { localStorage.setItem(KEY, v); } catch (e2) { /* per-viewer only */ }

    refresh();
  });

  linkify(document);
  var pane = document.getElementById("chain-pane");
  if (pane && window.MutationObserver) {
    new MutationObserver(function () { linkify(pane); }).observe(pane, { childList: true });
    linkify(pane);
  }
})();

      if (AUDIT_COMMIT) { lines.push("Audited at commit " + AUDIT_COMMIT + ". Anything older than that may have moved."); }

      var promptText = lines.join("\n");
      var saved = window.SOPFix.savedPrompt(n);          // your /planpro output, if any
      var pbox = el("div", "sm-prompt");
      var ppre = document.createElement("pre");
      ppre.textContent = saved ? saved.text : promptText;
      pbox.appendChild(ppre);

      var pbar = el("div", "sm-prompt-bar");
      var pcopy = el("button", null, "Copy prompt");
      pcopy.type = "button";
      function selectPre() {
        try {
          var r = document.createRange();
          r.selectNodeContents(ppre);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        } catch (e) { /* selection refused: the text is on screen to copy by hand */ }
      }
      pcopy.addEventListener("click", function () {
        function done(ok) {
          pcopy.textContent = ok ? "Copied ✓" : "Press ⌘/Ctrl+C";
          setTimeout(function () { pcopy.textContent = "Copy prompt"; }, 2500);
        }
        var text = ppre.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done(true); },
            function () { selectPre(); done(false); });
        } else { selectPre(); done(false); }
      });
      pbar.appendChild(pcopy);

      /* Download whatever the block is showing — your saved /planpro plan,
         or the generated brief — as a markdown file named for the step. */
      var pdown = el("button", null, "Download .md");
      pdown.type = "button";
      pdown.className = "ghost";
      pdown.addEventListener("click", function () {
        var text = ppre.textContent;
        var kind = (saved && ppre.textContent === saved.text) ? "plan" : "brief";
        var filename = "step-" + pad(n) + "-" + kind + ".md";
        function flash(msg) {
          pdown.textContent = msg;
          setTimeout(function () { pdown.textContent = "Download .md"; }, 2500);
        }
        function browserSave() {
          try {
            var url = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
            var a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            flash("Downloaded ✓");
          } catch (e) { flash("Download failed"); }
        }
        if (!downloadsNs) { browserSave(); return; }
        pdown.disabled = true;
        downloadsNs.save({ filename: filename, data: text }).then(function () {
          pdown.disabled = false;
          flash("Saved ✓");
        }, function (err) {
          pdown.disabled = false;
          var code = err && err.code;
          if (code === "declined") { pdown.textContent = "Download .md"; return; }   // the viewer said no
          if (code === "rate_limited") { flash("Try again in a moment"); return; }
          flash("Download unavailable here");
        });
      });
      pbar.appendChild(pdown);

      /* Paste the real /planpro output over the generated brief. It is stored
         per step, so the colleague copies whatever was last saved here. */
      var pedit = el("button", null, saved ? "Replace" : "Paste /planpro output");
      pedit.type = "button";
      pedit.className = "ghost";
      pedit.addEventListener("click", function () {
        var ta = document.createElement("textarea");
        ta.className = "sm-prompt-edit";
        ta.value = ppre.textContent;
        ppre.replaceWith(ta);
        ta.focus();
        pbar.innerHTML = "";
        var save = el("button", null, "Save for the team");
        save.type = "button";
        save.addEventListener("click", function () {
          save.disabled = true;
          save.textContent = "Saving…";
          window.SOPFix.savePrompt(n, ta.value).then(function () { open(n); },
            function () { save.disabled = false; save.textContent = "Could not save"; });
        });
        var cancel = el("button", null, "Cancel");
        cancel.type = "button";
        cancel.className = "ghost";
        cancel.addEventListener("click", function () { open(n); });
        pbar.appendChild(save);
        pbar.appendChild(cancel);
        pbar.appendChild(el("span", "hint",
          "Run /planpro on your machine, paste the plan here, and it replaces the generated brief for everyone."));
      });
      if (window.SOPFix.canSave()) { pbar.appendChild(pedit); }

      if (saved) {
        var reset = el("button", null, "Show generated brief");
        reset.type = "button";
        reset.className = "ghost";
        reset.addEventListener("click", function () {
          ppre.textContent = promptText;
          reset.remove();
        });
        pbar.appendChild(reset);
      }

      pbar.appendChild(el("span", "hint", saved
        ? "Your /planpro plan, saved " + new Date(saved.at).toLocaleString() +
          (saved.by ? " by " + esc(saved.by) : "") + "."
        : "Generated from the cards above" + (AUDIT_COMMIT ? " \— audited at commit " + AUDIT_COMMIT : "") + ". " +
          (openFixes.length === model.length ? "" : "Defects already ticked done are left out.")));
      pbox.appendChild(pbar);
      right.appendChild(pbox);
    }

    grid.appendChild(left);
    grid.appendChild(right);
    body.appendChild(grid);
    box.appendChild(body);
    return box;
  }

  function onKey(e) {
    if (!backdrop) { return; }
    if (e.key === "Escape") { e.preventDefault(); shut(); return; }
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.key === "ArrowRight" && SOP.STEP[current + 1]) { open(current + 1); }
    if (e.key === "ArrowLeft" && SOP.STEP[current - 1]) { open(current - 1); }
    if (e.key === "Tab") {
      var f = backdrop.querySelectorAll("a[href], button:not([disabled])");
      if (!f.length) { return; }
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  function open(n) {
    if (!SOP.STEP[n]) { return; }
    if (!backdrop) {
      lastFocus = document.activeElement;
      backdrop = el("div", "sm-backdrop");
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) { shut(); } });
      document.body.appendChild(backdrop);
      document.addEventListener("keydown", onKey);
      document.documentElement.style.overflow = "hidden";
    }
    current = n;
    backdrop.innerHTML = "";
    backdrop.appendChild(build(n));
    if (SOP.showStep) { SOP.showStep(n); }
    var c = backdrop.querySelector("[data-close]");
    if (c) { c.focus(); }
  }
  function shut() {
    if (!backdrop) { return; }
    document.removeEventListener("keydown", onKey);
    backdrop.remove();
    backdrop = null;
    document.documentElement.style.overflow = "";
    if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
  }
  window.openStepGuide = open;
})();
</script>
