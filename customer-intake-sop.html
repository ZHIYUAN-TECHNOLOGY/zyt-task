<script type="application/json" id="sop-data">{"meta":{"slug":"customer-intake-sop","title":"When a Customer Comes In","company":"NCT Freight Forwarding","site":"Sepangar Port · Kolombong","kind":"Standard operating sequence","readFirst":"Most failures in this chain are in the joins between stages, not the stages — though the money stages carry defects of their own. Eight places marked \u003cstrong>chain break\u003c/strong> below are where the system stops carrying your data forward and a human has to retype it — the spine on the left is interrupted at each one. Two more sit inside single steps rather than between them, in the Watch notes on steps 17 and 19.","appBaseUrl":"http://localhost:3101/","baseUrlHint":"Every screen path on this page, like \u003ccode>/report/business\u003c/code>, opens against this address.","mapLede":"All twenty-seven steps in order. Hover or tab one to read the summary below the chart; \u003cstrong>click a step (or press Enter) to open its full operator guide\u003c/strong> — golden path, screens, fields, what the system writes, and screenshots. The eight severed links are where the system stops carrying your data across.","docLede":"Every step in full, in order, with the chain breaks where they fall. The chart above is an index of what is written here — hovering a node shows you the step from this text, so the two can never disagree. Collapsed by default; it opens on its own when you follow a link to a step, and it always prints.","colophon":"\u003cb>Method.\u003c/b> Seven parallel readers over the shipped code — intake, quote, order, operations, documents, money, navigation — each report then adversarially verified against the cited files, and the surviving claims assembled into one ordered sequence.\u003cbr> \u003cb>Scope.\u003c/b> Describes the system as built, not as intended. Steps are what a staff member does; the marked breaks are where the software stops helping.\u003cbr> \u003cb>Target chain.\u003c/b> quote → order → fee entry → bill → invoice → write-off → month-end statement.","repo":"nct-layout","chainName":"NCT's enquiry-to-invoice chain","routeFallback":{"/order":"/order/sea-export"}},"phases":[{"letter":"A","name":"Get them on file","who":"Sales"},{"letter":"B","name":"Quote them","who":"Sales · Sales admin · Reviewer"},{"letter":"C","name":"Open the job","who":"Sales · Operations · Reviewer"},{"letter":"D","name":"Run it","who":"Documentation · Operations"},{"letter":"E","name":"Bill it","who":"Operations · Accounting · Cashier"}],"steps":[{"n":1,"phase":"A","title":"Read the enquiry","badge":"Email only","where":"/inbox → /inbox/$threadId","what":"The enquiry arrives as an email thread in the three-pane mail client. Triage it — status, assign, note, archive — then reply, or compose a fresh first contact. SLA tiles show inbound volume and first-response rate against target.","watch":{"tag":"Skip if","html":"They came in any other way — \u003ca href=\"#arrivals\" style=\"color:var(--accent)\">only email lands in the inbox\u003c/a>, so there is no thread to read. Go to step 2, or straight to step 5 for a repeat booking. An emailed enquiry that never converts leaves a thread but no outcome — a thread can only be closed, never marked won or lost — which is why win rate cannot be measured outside the quotation ledger."},"actors":[{"role":"sales","part":"does"}]},{"n":2,"phase":"A","title":"Create the customer","where":"/companies → Add","what":"Search the directory first. Then press Add: \u003cstrong>Company title is the only mandatory field\u003c/strong>, plus at least one role — Customer, Supplier or Agent. Saving takes you straight to the edit form’s seven sections, five of them new since the dialog: classification, address, settlement terms (days payable, credit limit), the internal staff slots and the record.","watch":{"tag":"Watch","html":"Nothing forces this step — a quotation needs only a typed client \u003cem>name\u003c/em>, so a walk-in can be quoted without ever existing as a company. Skipping it drops the buyer’s address, tax ID and payment terms from the invoice — those rows vanish, the name still prints. Duplicate protection is case-\u003cem>sensitive\u003c/em> and there is no typeahead, so “Sunrise Sdn Bhd” and “SUNRISE SDN BHD” both save."},"actors":[{"role":"sales","part":"does"}]},{"n":3,"phase":"A","title":"Record the person who called","where":"/companies/$companyId → Contacts card","what":"Add the counterparty's human: name, role, phone, email, primary flag. This is the only real table for counterparty people — the seven “personnel” fields on the company record are \u003cem>NCT's\u003c/em> staff, not theirs.","actors":[{"role":"sales","part":"does"}]},{"n":4,"phase":"B","title":"Publish the rate card","where":"/fee-templates → /approve/template","what":"Build the pivoted tariff: billing-unit columns (\u003ccode>20GP\u003c/code>, \u003ccode>40HQ\u003c/code>, \u003ccode>40RF\u003c/code>), fee rows carrying destination, minimum charge and if-any flags, an amount in at least one column on every selling row — a single cell may be blank (unpriced) or N/A (not available at that unit). Bind it to a company to make it that customer's deal. \u003cstrong>Only an approved selling template counts as a tariff.\u003c/strong>","watch":{"tag":"Watch","html":"The gate meant to stop an un-approved template being applied ships switched off, so nothing on the server refuses a draft card — only the picker’s default filter hides it, one tick away. Revising a card is Duplicate → edit → approve, then supersede the old one."},"actors":[{"role":"sales-admin","part":"does"},{"role":"reviewer","part":"approves"}]},{"n":5,"phase":"B","title":"Raise the quotation","where":"/quotations → /quotations/$quotationId","what":"Fill the header: entrust unit, business type, incoterms, POL and POD, carrier, schedule, validity. Two remark fields — the annotation prints on the customer's sheet, the internal remark never does. Saving allocates \u003ccode>NCT-Q-YYYYMM-####\u003c/code> and forces status to draft.","actors":[{"role":"sales","part":"does"}]},{"n":6,"phase":"B","title":"Price it","where":"/quotations/$quotationId → fee grid","what":"Record containers and batches. Then either tick tariff cells in the Reference-template dialog and apply them, or type fee lines by hand with side and segment. The FX table seeds each foreign line's rate; the footer computes the tax-inclusive total and estimated profit; each line gets a badge reading its price against the tariff.","watch":{"tag":"Watch","html":"\u003cstrong>Applied lines always land at quantity 1.\u003c/strong> The template never reads your container mix, so on a 3×40HQ booking every applied line is a third of the real charge until you retype the quantity. Nothing checks the cost side at all, so the margin rests on unverified buy figures."},"actors":[{"role":"sales","part":"does"}]},{"n":7,"phase":"B","title":"Save against the tariff floor","where":"/quotations/$quotationId → Save Quote","what":"The server refuses the whole quotation if any selling line sits below its resolved tariff floor, and names every offending line. A price may be \u003cem>higher\u003c/em> than tariff — never lower.","watch":{"tag":"Watch","html":"Two approved sheets with the same start date that disagree on a price leave a line “ambiguous”, which carries no floor — the refusal silently skips it. Two spellings of one charge unit do the same."},"actors":[{"role":"sales","part":"does"}]},{"n":8,"phase":"B","title":"Get it approved","where":"/approve/quotation","what":"Submit for review. The queue is the quotation ledger in review mode, routed by open audit stage rather than by status. A reviewer approves or rejects with a reason; approval freezes the record.","actors":[{"role":"sales","part":"does"},{"role":"reviewer","part":"approves"}]},{"n":9,"phase":"B","title":"Send it to the customer","where":"/quotations/$quotationId → Send","what":"Pick your mailbox, the recipient (pre-filled from the company’s primary contact; Cc is always typed), format and language. The server re-renders the sheet, mails it as an attachment, opens a thread, links that thread to the quotation and stamps the send. The export is an allow-list: \u003cstrong>every cost line and the margin are stripped.\u003c/strong>","watch":{"tag":"Watch","html":"There is no outbox. If the stamp fails after the mail goes out, the only way forward is pressing Send again — which mails the customer a second copy."},"actors":[{"role":"sales","part":"does"}]},{"n":10,"phase":"B","title":"Record their answer","where":"/quotations/$quotationId → Decide","what":"Read the reply in the Threads card, then mark Won or Lost with the date they actually answered, their PO reference and a note. The server refuses if the quotation was never sent, and freezes the record afterwards.","watch":{"tag":"Watch","html":"\u003cstrong>A mis-keyed decision cannot be corrected.\u003c/strong> The code says so itself: fixing one currently needs a database edit. The customer never touches the system — there is no accept link and no signature capture."},"actors":[{"role":"sales","part":"does"}]},{"n":11,"phase":"C","title":"Convert the won quote into a job","where":"/quotations/$quotationId → Convert to order","what":"One press mints the order carrying the header, the company link, the containers and the \u003cstrong>receivable lines only\u003c/strong> — cost-side and if-any lines are deliberately left behind — then drops you on the order's edit form. It is one-shot: a quotation that already has an order is refused.","actors":[{"role":"sales","part":"does"}]},{"n":12,"phase":"C","title":"Stamp the job number by hand","where":"/order/\u003ctrade>/$orderId → Assign number","what":"Press Assign number — it sits under the Job Number box on the edit form, and on the record page — to allocate the next \u003ccode>JOByymm#####\u003c/code> serial. The button only renders while the number is blank.","watch":{"tag":"Watch","html":"Miss it and the job stays numberless, with any cost line added afterwards carrying a null order number — the lines conversion made keep the quotation number, so one invoice can print both. This is the single easiest step in the chain to skip and the most expensive to notice late."},"actors":[{"role":"sales","part":"does"}]},{"n":13,"phase":"C","title":"Receive it into operations","where":"/order/to-receive","what":"The order lands unaccepted in the intake queue. Receive it, which stamps the acceptance time, or reject it with a reason. Re-receiving an accepted order is refused so the real receiving time survives.","actors":[{"role":"operations","part":"does"}]},{"n":14,"phase":"C","title":"Fill in the operational detail","where":"/order/$orderId/edit","what":"One scrolling form with a section rail: business info, shipping space (vessel, voyage, ETD, ETA, ETB, cut-off), lading bills (shipper, consignee, notify, marks, weights), the desk roles, then containers, cargo lines, expense rows and appendages. Save sends only what changed and returns you to the trade ledger.","watch":{"tag":"Watch","html":"\u003cstrong>No field on any trade is mandatory.\u003c/strong> A sea-import order saves with no client, no vessel, no ports and no cargo. The desk roles are free-typed names, not linked members — so the only way to ask “which orders are mine” is a substring search on a typed name — no member link, no my-orders view, and a namesake changes the answer."},"actors":[{"role":"operations","part":"does"}]},{"n":15,"phase":"C","title":"Get the order approved","where":"/approve/order","what":"Submit from the trade ledger’s row menu; this queue only decides — one row, or a whole selection from its toolbar. One review queue spans every trade, not just sea export.","actors":[{"role":"operations","part":"does"},{"role":"reviewer","part":"approves"}]},{"n":16,"phase":"D","title":"Raise the bill of lading","where":"/lading/create","what":"Type the B/L, or drop the carrier's PDF and let OCR pre-fill it. Point it at the job, then assign the bill's seven desk roles — unlike the order's, \u003cstrong>these are real linked members.\u003c/strong>","actors":[{"role":"documentation","part":"does"}]},{"n":17,"phase":"D","title":"Move the B/L through its states","where":"/lading → /lading/$id","what":"Check In (endorsement), Amend, Check Out (release) and Hold (detention), each with a cancel twin and each behind its own gate. Per row, or from the detail page — the list’s tick-boxes drive review only. Send the bill for review from \u003cstrong>Review\u003c/strong> on its page; while under review it is frozen. Scanned paperwork files as attachments on the bill itself.","actors":[{"role":"documentation","part":"does"}]},{"n":18,"phase":"D","title":"Approve the carrier's MBL/HBL","where":"/documents → /documents/$documentId","what":"Upload the PDF; the pipeline classifies, extracts and validates it, then either auto-approves or parks it for review. Check each field against the scan and approve. \u003cstrong>That approval is what starts automated customs and port tracking\u003c/strong> — nothing else does.","watch":{"tag":"Watch","html":"There is no K1 or K2 customs-declaration type in the vocabulary, so the Sepangar filing itself lives outside this system."},"actors":[{"role":"documentation","part":"does"}]},{"n":19,"phase":"D","title":"Watch the demurrage clock","where":"/customs-tracking → /overview","what":"Two schedulers poll MYCIEDS and SBCP — customs three times a day, the port hourly — issuing three kinds of check. Customs clearance, vessel berthing and container gate-out arrive on their own, and \u003cstrong>the 72-hour countdown starts itself at berth.\u003c/strong> The board sorts by urgency and emails the owning branch on threshold and structural failures. A job the automation can never finish is voided with a written reason.","watch":{"tag":"Watch","html":"Tracking jobs still store no order: a job finds its order, and an order its job, by B/L number. When two open jobs share one B/L number the order's card shows \u003cstrong>Match not certain\u003c/strong> and no clock, and where no portal login is saved the board says checks are off — nothing is being checked."},"actors":[{"role":"operations","part":"does"}]},{"n":20,"phase":"E","title":"Enter what the job cost and what it bills","where":"/order/$orderId/expenses","what":"Two stacked grids, receivable above payable, saved together, with a live gross-profit box underneath showing both tax-inclusive and tax-exclusive. Copy to payable mirrors every named row across, minus the settlement party.","actors":[{"role":"operations","part":"does"}]},{"n":21,"phase":"E","title":"Get the fees reviewed","where":"/approve/cost","what":"Submit from the fee ledger’s Review menu; someone else decides here, on a toolbar of Approved / Rejected / Refresh Page — nobody decides their own fee. The fee ledger’s own toolbar — not this one — carries reconcile, lock, archive, tag, and an exchange-rate dialog that applies a rate you type by hand.","actors":[{"role":"operations","part":"does"},{"role":"reviewer","part":"approves"}]},{"n":22,"phase":"E","title":"Group the fees into a bill","where":"/expenses/cost-lines → Create bill","what":"Tick cost lines — or tick nothing, which means the whole filtered set — and press Create bill, optionally grouping by tax rate and splitting one bill per order. Mixed currency, attribute, settlement party or owning branch cannot land in one bill — the selection splits into one bill per combination.","actors":[{"role":"accounting","part":"does"}]},{"n":23,"phase":"E","title":"Get the bill approved","where":"/approve/bill","what":"\u003cstrong>This gate has teeth — for invoicing and write-off.\u003c/strong> Invoicing is frozen until the bill's latest review passes, and unlike the template gate at step 4 this one ships switched on. It also guards the bill itself: nothing on it saves while under review, and after approval only the paperwork (courier, voucher numbers, remark, tags) can change — removing a line is refused until the bill is dissolved and billed again.","actors":[{"role":"accounting","part":"does"},{"role":"reviewer","part":"approves"}]},{"n":24,"phase":"E","title":"Issue the invoice","where":"/expenses/bills → Invoicing","what":"Pick invoice category and type, optionally type the real tax-authority number, and accept or edit the amount — pre-filled with the outstanding balance, so \u003cstrong>partial invoicing works.\u003c/strong> The bill flips to invoiced once fully covered; a written-off bill with a balance left can be invoiced too and goes to Done.","watch":{"tag":"Watch","html":"Over-limit invoicing needs a reason. When a covered bill's company is over its credit limit, the dialog names it and \u003cstrong>Issue Invoice\u003c/strong> stays disabled until a reason of at least 10 characters is typed; the reason goes to the audit log. A bill with no company, or a company with no limit, is never checked."},"actors":[{"role":"accounting","part":"does"}]},{"n":25,"phase":"E","title":"Produce and hand over the document","where":"/expenses/invoices","what":"Preview the real document — seller (name, address, phone, contact — never a tax ID) and buyer (name, address, tax ID), fee lines with tax rate, two totals, payment terms from the bill's own term (the customer's current term only when no covered bill has one) — then save it as PDF or XLSX; the server records it as downloaded. A void reverses the whole allocation atomically and makes the bill re-invoiceable.","watch":{"tag":"Watch","html":"The buyer block usually prints only a name — no address, tax ID or payment terms; see the break at step 20. There is also \u003cstrong>no send-by-email anywhere\u003c/strong>, although the quotation at step 9 has one, and no SST or GST: this is a commercial invoice, not a Malaysian tax invoice."},"actors":[{"role":"accounting","part":"does"}]},{"n":26,"phase":"E","title":"Record the money and settle it","where":"/expenses/payments → /expenses/write-offs","what":"Record the receipt — direction, settlement party, account, payment way, currency, amount, an exchange rate when the currency differs from the reporting one, bank slip, date — then verify it against a bill on its own side (a receipt settles receivables, a payment payables), or, from the same dialog, a single billed cost line. The amount spreads forward across that bill's cost lines in creation order. A payment can be edited while nothing live is settled against it; a wrong write-off is voided with a reason, not edited.","watch":{"tag":"Watch","html":"Settlement attaches to the \u003cem>bill\u003c/em>, never the invoice. With partial invoicing in use one bill legitimately carries several invoices — so “is this invoice paid?” has no answer on any screen, though both per-line splits exist to compute it."},"actors":[{"role":"cashier","part":"does"},{"role":"accounting","part":"does"}]},{"n":27,"phase":"E","title":"Close the month","where":"/expenses/cost-lines → Export table · /report/financial","what":"Tick cost lines and export the customer statement or debit note (one settlement unit each) or the per-shipment profit sheet. Then work the five Financial Stat tabs, whose months follow the branch's time zone: profit analysis, profit statement, receipts and payments, billing records, and ageing with days overdue plus a separate line for bills with no due date (credit limit appears only in the ageing export).","watch":{"tag":"Watch","html":"The three month-end documents have no menu entry of their own — they open from an export dialog on two screens: the fee ledger (no ticks means the whole filtered set) and the order’s own expense page."},"actors":[{"role":"accounting","part":"does"}]}],"breaks":[{"after":1,"label":"Inbox → Customer","body":"\u003cp>An inbound email can be triaged, assigned and replied to, but never turned into a customer. The sender's name, address and domain get retyped by hand in step 2. The database already reserves \u003ccode>customer\u003c/code> as a link target; the router refuses it.\u003c/p>"},{"after":11,"label":"Quotation → Order","body":"\u003cp>\u003cstrong>The job arrives with no job number.\u003c/strong> Conversion never allocates one, so the order shows an em-dash where its identity belongs and every cost line it creates inherits the \u003cem>quotation\u003c/em> number instead.\u003c/p> \u003cp>The repair is one press away: Assign number sits under the Job Number box on the edit form you land on, and on the record page. It is still a second step conversion should not require — hence step 12.\u003c/p>"},{"after":13,"label":"Intake queue → the job","body":"\u003cp>The queue has no exit. You can accept or refuse a job here but you cannot \u003cem>open\u003c/em> it — there is not one link out of the entire screen. Deciding means memorising the order number, walking to the right trade ledger and finding it again.\u003c/p>"},{"after":15,"label":"Order → Bill of lading","body":"\u003cp>There is no route from the job to its B/L. The bill is typed fresh and has to re-find its order in a flat 200-row dropdown, or match on a job number typed as free text — the exact string match that once picked the wrong row.\u003c/p>","lead":true},{"after":18,"label":"Documents → the job","body":"\u003cp>Paperwork cannot be filed against the order it belongs to. The server accepts orders and ladings as link targets; the only screen that links anything sends the literal type \u003ccode>quote\u003c/code>. So the per-order Documents card queries a link nothing ever writes — and never renders at all, because the server sends \u003ccode>documentCount\u003c/code> and \u003ccode>blStage\u003c/code> while the client demands \u003ccode>counts\u003c/code> and \u003ccode>customs\u003c/code>.\u003c/p>"},{"after":20,"label":"The customer's identity ends here","body":"\u003cp>\u003cstrong>This is the most consequential break in the chain.\u003c/strong> The order knows its customer's company record. The fee line it creates does not — the settlement party is written as a bare \u003cem>string\u003c/em>, and the company reference is not even an accepted field on this path.\u003c/p> \u003cp>The bill inherits that null, and the invoice at step 25 resolves its buyer from it. Result: the document your customer receives has \u003cstrong>no address, no tax ID and no due date.\u003c/strong> Someone retypes them outside the system, or it goes out incomplete.\u003c/p>"},{"after":21,"label":"Order → Bill","body":"\u003cp>You cannot bill a job from the job. The order's expense page has no Create bill, and its one link to the fee ledger carries \u003cem>no filter\u003c/em> — even though that ledger accepts an order filter. You land on the org-wide list and re-find your own shipment by typing its number.\u003c/p>"},{"after":27,"label":"The job never ends","body":"\u003cp>Nothing in the system can mark a shipment shut out, finished, locked or archived. The server implements all three lifecycles with transition tables and guards; no screen calls any of them. Every job stays open forever, and the ledgers' own \u003cem>Finished\u003c/em> filter returns nothing on every trade.\u003c/p>"}],"chain":{"rows":[{"letter":"A","cells":[1,2,3],"entry":1,"exit":3},{"letter":"B","cells":[4,5,6,7,8,9,10],"entry":5,"exit":10,"noEdge":[[4,5]],"arcs":[[4,6,"tariff"]]},{"letter":"C","cells":[11,12,13,14,15],"entry":11,"exit":15},{"letter":"D","cells":[16,17,18,19],"entry":16,"exit":19},{"letter":"E","cells":[20,21,22,23,24,25,26],"entry":20,"exit":26,"below":[[27,26,"monthly"]]}],"aside":[4,27],"reject":[[8,6],[15,14],[21,20],[23,22]],"enters":{"1":"email","2":"4 channels","5":"repeat booking"},"optional":{"3":"optional"},"lost":{"from":10,"label":"lost","text":"Quote lost","won":"won"},"pitfall":[6,12],"short":{"20":"Enter cost and revenue"},"tail":{"step":27,"label":"no terminal state"},"ariaLabel":"Flow chart of the 27 steps in 5 phases, one phase per row. Three entry arrows point at steps 1, 2 and 5 depending on how the customer arrived. Step 4 is off-trunk setup feeding step 6. Step 10 branches: won continues to step 11, lost ends the chain. Four reject loops run backwards from steps 8, 15, 21 and 23. Step 27 is monthly, off the trunk. Eight hand-offs are severed.","pitfallLegend":"Ringed number — most commonly missed","asideLegend":"Dashed box — off one shipment’s path"},"arrivals":{"title":"How they arrive","ariaLabel":"Six arrival channels fanning into three entry points in the sequence: email starts at step 1, WhatsApp, walk-in, phone and agent nomination all join at step 2, and a repeat booking joins at step 5.","hint":"Hover or tab a channel — solid line = the system carries it, dashed = you transcribe it","channels":[{"key":"email","name":"Email","sub":"Lands in /inbox","home":"Lands in /inbox","homeless":false,"join":1,"jlbl":"Starts at","body":"\u003cp>The thread appears in the mail client on its own. Triage it, reply, and it stays attached to everything that follows — the quotation you send in step 9 opens a thread in the same place.\u003c/p>\u003cp>Requires an admin to have connected the mailbox first, or the Inbox is empty.\u003c/p>"},{"key":"whatsapp","name":"WhatsApp","sub":"No home","home":"No home","homeless":true,"join":2,"jlbl":"Joins at","body":"\u003cp>Most enquiry traffic in practice, and the system cannot see any of it. Read off what you need — company, contact, cargo, lane — and \u003cstrong>go straight to creating the customer.\u003c/strong>\u003c/p>\u003cp>Paste the substance of the chat into the company's remark field as you create it. That is the only place it will survive; there is no enquiry record to hold it.\u003c/p>"},{"key":"walkin","name":"Walk-in","sub":"No home","home":"No home","homeless":true,"join":2,"jlbl":"Joins at","body":"\u003cp>Someone at the Kolombong counter with a shipment. Take the details on paper or straight into the create-company dialog while they stand there — you will need company title, one role, a contact name and a phone number as a minimum.\u003c/p>\u003cp>Ask for the billing name and tax ID \u003cem>now\u003c/em>, not later: by the time an invoice needs them the fields are three screens away from whoever is typing.\u003c/p>"},{"key":"phone","name":"Phone","sub":"No home","home":"No home","homeless":true,"join":2,"jlbl":"Joins at","body":"\u003cp>Same as a walk-in, with nothing to show them. Take the enquiry, create the customer, then \u003cstrong>email them the quotation\u003c/strong> so the chain acquires a written trail it otherwise never gets.\u003c/p>"},{"key":"agent","name":"Agent nomination","sub":"No home","home":"No home","homeless":true,"join":2,"jlbl":"Joins at","body":"\u003cp>An overseas agent or co-loader nominates the shipment to NCT. \u003cstrong>The customer here is the agent, not the shipper\u003c/strong> — create them with role \u003cem>Agent\u003c/em> and record the shipper separately, or the invoice goes to the wrong party.\u003c/p>\u003cp>Their rate is usually a standing arrangement, so check for an existing deal card bound to them before quoting fresh.\u003c/p>"},{"key":"repeat","name":"Repeat booking","sub":"No home · on file","home":"No enquiry record — but the customer is already on file","homeless":true,"join":5,"jlbl":"Joins at","body":"\u003cp>An existing customer with another shipment — most of the volume. They are already in the directory and their deal card is already bound, so \u003cstrong>skip creation entirely\u003c/strong> — press Duplicate on their last quotation, or raise a fresh one. Duplicate on an order row instead makes a new numbered order with no fees and skips straight to receiving it into operations at step 13.\u003c/p>\u003cp>Check the deal card's validity dates first. An expired card silently falls back to the standard tariff, and the price you quote changes without warning.\u003c/p>"}],"junctions":{"1":"Inbox","2":"Create","5":"Quote"},"convergeLabel":"All six converge","converge":"From the quotation onward there is one path, and it is the numbered sequence below. \u003cstrong>Whatever channel they came in on, the work after step 5 is identical\u003c/strong> — which is also why, outside email, the enquiry itself leaves no record, and even an email thread never records whether it was won or lost."},"guide":[{"n":1,"role":"Sales · needs thread:read","routes":[{"path":"/inbox","label":"Inbox — folders, thread list and reading pane in one screen"},{"path":"/inbox/$threadId","label":"One conversation, opened in the reading pane"}],"navigate":"Left rail, **You** block → **Inbox** (it is no longer under the Documents menu)","before":["A mailbox must be connected for the org, or nothing syncs in. Press the **Sync now** icon on the mailbox row at the top of the left rail to pull new mail immediately.","Only email arrives here by itself. WhatsApp, walk-in, phone and agent enquiries start at step 2."],"golden":[{"action":"Open **Inbox** from the left rail","detail":"Three panes: folders on the left (**Inbox**, **Sent**, **Unassigned**, **Mine**, **Archive**), the thread list in the middle, the conversation on the right. The SLA tiles show **Inbound**, **1st resp** % and **SLA risk**.","src":"apps/web/src/components/inbox/sla-tiles.tsx:51"},{"action":"Filter the list to **New** threads","detail":"Status views: **New**, **Open**, **Pending**, **Resolved**, **Closed**.","src":"apps/web/src/components/inbox/filters.ts:37"},{"action":"Click the enquiry to open it","detail":"The URL becomes /inbox/\u003cthreadId>. The reading pane shows an **AI Summary**, every message, and the thread context panel.","src":"apps/web/src/components/inbox/reading-pane.tsx:309"},{"action":"Set the **Thread status** dropdown to **Open**","detail":"It is the first control in the sticky triage bar above the conversation.","src":"apps/web/src/components/inbox/triage-bar.tsx:79"},{"action":"Click the **Unassigned** button and pick the salesperson who owns it","detail":"The button then shows that member's name. **Unassign** puts it back.","src":"apps/web/src/components/inbox/triage-bar.tsx:100"},{"action":"Type an internal note in **Add an internal note…**","detail":"Notes are staff-only and never go to the customer.","src":"apps/web/src/components/inbox/notes-panel.tsx:139"},{"action":"Click **Reply all** (top-right of the triage bar), or **Reply** / **Forward** on the latest message","detail":"The composer opens with From, To and Subject derived for you. Type in **Write your message…** and press **Send reply**. A toast confirms **Reply sent**.","src":"apps/web/src/components/inbox/composer-logic.ts:39"},{"action":"For a first contact, press **New email** at the top of the left rail instead","detail":"Fill **From**, **To** (name@company.com), **Subject**, **Message**, then **Send**. The toast reads **Email sent**.","src":"apps/web/src/components/inbox/left-rail.tsx:68"},{"action":"Once a quotation exists, come back and use **Link a quotation…** in the context panel","detail":"Quotation is the only record type this picker links. Sending from the quotation at step 9 also creates and links a thread by itself.","src":"apps/web/src/components/inbox/link-picker.tsx:111"},{"action":"When the conversation is finished, press **Archive**","detail":"**Unarchive** reverses it. **Mark unread** puts it back in someone's queue.","src":"apps/web/src/components/inbox/triage-bar.tsx:125"}],"fields":[{"label":"Thread status","required":false,"note":"New · Open · Pending · Resolved · Closed"},{"label":"Assignee","required":false,"note":"Any org member, or Unassigned"},{"label":"From / To / Subject / Message","required":true,"note":"New email only. Replies derive From, To and Subject for you"}],"writes":["Thread status, assignee, archived flag and internal notes on the thread","Outgoing mail sent through the connected mailbox and stored on the thread","Inbound count and first-response rate feeding the SLA tiles"],"result":"Nothing in the inbox creates a customer. Copy the sender's company name, email and signature details, then go to **step 2** (Sales → Companies).","pitfalls":["There is no **Create company from sender** action. Retype the sender details by hand in step 2.","A thread can be closed but never marked won or lost, so an emailed enquiry that goes nowhere leaves no outcome."],"shots":[{"file":"customer-intake-sop/shots/step-01.jpg","caption":"Inbox: folders, thread list, reading pane","path":"/inbox"}]},{"n":2,"role":"Sales · needs customer:read to see the directory, and create rights to add","routes":[{"path":"/companies","label":"Companies directory (Sales → Companies)"},{"path":"/companies/$companyId/edit","label":"Full company edit form — where Create lands you"},{"path":"/companies/$companyId","label":"Company record page"}],"navigate":"Top nav **Sales** → **Companies**","before":["Have the company's legal name exactly as it should print on documents.","Search first. The duplicate check only catches an exact same-case name."],"golden":[{"action":"Open **Sales → Companies**","detail":"The directory lists every company, with role segments **Customers**, **Suppliers** and **Overseas agents**.","src":"apps/web/src/routes/_next/companies.tsx:360"},{"action":"Type the name into **Search name, EN name, code, customer code** and check for an existing record","detail":"The search matches substrings in all four fields. There is no typeahead warning when you add a company.","src":"apps/web/src/routes/_next/companies.tsx:734"},{"action":"Not found? Click **Add** in the toolbar","detail":"The **Add company** dialog opens.","src":"apps/web/src/routes/_next/companies.tsx:801"},{"action":"Type the **Company title**","detail":"This is the only required field. Leaving it blank shows **Required**.","src":"apps/web/src/routes/_next/companies.tsx:254"},{"action":"Optionally fill **Code** and **Customer code**","src":"apps/web/src/routes/_next/companies.tsx:274"},{"action":"Under **Roles**, keep **Customer** ticked (it is ticked by default); add **Supplier** or **Overseas agent** if they apply","detail":"The server refuses a company with no role: **A company needs at least one role (customer, supplier or agent)**.","src":"packages/api/src/routers/company.ts:654"},{"action":"Press **Create and continue**","detail":"A toast reads **Company created — add the rest of its details** and you land on the full edit form. A same-name company is refused with **A company with this name already exists in the directory**.","src":"apps/web/src/routes/_next/companies.tsx:165"},{"action":"Use the section rail to fill **Identity** → **Roles & status** → **Classification** → **Address** → **Settlement** → **People** → **Record**","detail":"The fields that reach the invoice are in **Address** and **Settlement** (**Days payable**, **Credit limit**, **Settlement currency**). **People** holds NCT's own staff for this account, not the customer's.","src":"apps/web/src/routes/_next/companies_.$companyId_.edit.tsx:647"},{"action":"Press **Save changes** (header or form foot)","detail":"The header counter shows **N unsaved** until you save. A toast reads **Company updated** and you land on the company record page. On this form, an emptied box clears the stored value.","src":"apps/web/src/routes/_next/companies_.$companyId_.edit.tsx:600"}],"fields":[{"label":"Company title","required":true,"note":"Unique per org, compared case-sensitively"},{"label":"Code / Customer code","required":false,"note":"Free text, searchable"},{"label":"Roles: Customer / Supplier / Overseas agent","required":true,"note":"At least one. Customer is pre-ticked"},{"label":"English name, Unified social credit code, Aliases","required":false,"note":"Identity section; aliases comma-separated"},{"label":"Business type, Development mode, Consignee type, Tags","required":false,"note":"Classification section"},{"label":"Address (CN), Province, City, Area, Address (EN)","required":false,"note":"Printed as the buyer address on the invoice"},{"label":"Settlement mode, Reconciliation method, Settlement currency, Days payable, Credit limit","required":false,"note":"Days payable 0–3650; it sets the invoice payment terms"},{"label":"Operation, Service, Business, Associated, Documentation, Commercial, Related (second)","required":false,"note":"NCT staff on the account"},{"label":"Note","required":false,"note":"Max 2000 characters"}],"writes":["A company row with its roles (isCustomer / isSupplier / isAgent)","Every section's fields on Save changes"],"result":"You are on the company record page. Scroll to the **Contacts** card for **step 3**, or go straight to **Sales → Quotations** for **step 5**.","pitfalls":["Nothing forces this step. A quotation takes a typed client name, so a walk-in can be quoted without a company record, and the invoice then loses the address, tax ID and payment terms.","\"Sunrise Sdn Bhd\" and \"SUNRISE SDN BHD\" both save, because the unique index is on the raw name."],"shots":[{"file":"customer-intake-sop/shots/step-02.jpg","caption":"Companies directory","path":"/companies"},{"file":"customer-intake-sop/shots/step-02-add.jpg","caption":"The Add company dialog","path":"/companies"},{"file":"customer-intake-sop/shots/step-02-edit.jpg","caption":"Where Create lands you: the full edit form","path":"/companies"}]},{"n":3,"role":"Sales","routes":[{"path":"/companies/$companyId","label":"Company record page → Contacts card"}],"navigate":"**Sales → Companies** → click the company's row","before":["The company exists (step 2)."],"golden":[{"action":"Open the company from **Sales → Companies**","detail":"The record page shows the company's cards, including **Contacts** with a count badge."},{"action":"On the **Contacts** card, press **Add contact**","detail":"The **Add contact** dialog opens.","src":"apps/web/src/components/company/company-contacts.tsx:151"},{"action":"Type the person's **Name**","detail":"Required, at most 200 characters.","src":"packages/api/src/routers/company-contact.ts:40"},{"action":"Fill **Role** (e.g. Accounts payable), **Phone** (+60 12-345 6789) and **Email**","detail":"Email is not format-validated, by design: the address book accepts whatever the customer gave you.","src":"apps/web/src/components/company/company-contacts.tsx:414"},{"action":"Tick **Primary contact** for the person who should receive quotations","detail":"Ticking it clears the flag from whoever held it before. The primary contact pre-fills the recipient when you send a quotation at step 9.","src":"packages/api/src/routers/company-contact.ts:181"},{"action":"Press **Add contact**","detail":"The row appears in the table (**Name · Role · Phone · Email · Primary**). Use the pencil (**Edit**) or bin (**Delete**) icons on the row later.","src":"apps/web/src/components/company/company-contacts.tsx:478"}],"fields":[{"label":"Name","required":true,"note":"1–200 characters"},{"label":"Role","required":false,"note":"Free text"},{"label":"Phone","required":false,"note":"Free text"},{"label":"Email","required":false,"note":"Not format-checked"},{"label":"Primary contact","required":false,"note":"One per company; a new primary replaces the old one"}],"writes":["A company_contact row; any previous primary flag on that company is cleared"],"result":"The contact is on file. Next is **step 5** (raise the quotation). If this customer needs its own rate card, do **step 4** first.","pitfalls":["The seven personnel fields on the company edit form are NCT's own staff, not the customer's people. Record the customer's people here."],"shots":[{"file":"customer-intake-sop/shots/step-03.jpg","caption":"The company record's Contacts card","path":"/companies"},{"file":"customer-intake-sop/shots/step-03-add.jpg","caption":"Add contact","path":"/companies"}]},{"n":4,"role":"Sales admin builds the card; a reviewer approves it · needs quotation.feeTemplate.create / .update to build, .review to decide","routes":[{"path":"/fee-templates","label":"Fee Templates list (Sales → Fee templates)"},{"path":"/fee-templates/$templateId","label":"Template editor (\"new\" for a fresh one)"},{"path":"/approve/template","label":"Expense template review queue (Approvals → Expense template)"}],"navigate":"Top nav **Sales** → **Fee templates**; approve under **Approvals** → **Expense template**","before":["This is one-off setup, not part of every shipment. Do it when a new standard tariff or a customer-specific deal is agreed.","Have the charge names ready. The **Cost Name** box suggests entries from **Sales → Cost items**."],"golden":[{"action":"Open **Sales → Fee templates** and press **Add**","detail":"The editor opens as **New Fee Template**.","src":"apps/web/src/routes/_next/fee-templates/index.tsx:580"},{"action":"In **Basic Information**, fill **Template Name *** and **Business Type ***","detail":"These two are required. **Template name is required** appears if the name is blank.","src":"apps/web/src/routes/_next/fee-templates/$templateId.tsx:700"},{"action":"Set **Fee Type** to **Selling Price**","detail":"Only an approved Selling Price template acts as a tariff floor. **Cost** templates price the buy side.","src":"apps/web/src/lib/quotation.ts:35"},{"action":"For a customer's own deal, pick them in **Client** (\"Start typing to search the directory\")","detail":"Leave Client empty for the company-wide standard tariff. Optionally set **Shipping Type**, **Carrier**, **Booking Agent**, **Foreign Agent**, **Settlement Unit**, **Valid From**, **Valid To** and **Annotation**.","src":"apps/web/src/routes/_next/fee-templates/$templateId.tsx:781"},{"action":"In **Fee Details**, press **Add Billing Unit** once per container size","detail":"Type each column header, e.g. `20GP`, `40HQ`, `40RF`. A billing unit cannot be blank or repeated.","src":"apps/web/src/routes/_next/fee-templates/$templateId.tsx:1268"},{"action":"Press **Add Fee** for each charge and fill the row","detail":"Columns: **Rank · Cost Name · Destination · Currency · \u003cone column per unit> · Min charge · If any · Cost Label · Note**. In a unit cell, type an amount, leave it blank (unpriced), or type `N/A` (not available at that unit).","src":"apps/web/src/routes/_next/fee-templates/$templateId.tsx:1259"},{"action":"Give every selling row an amount in at least one unit column","detail":"Otherwise the server refuses the save: **Row \"…\" has no price — a selling template's row needs an amount in at least one 计费单位 column.**","src":"packages/api/src/routers/quotation.ts:582"},{"action":"Press **Save Template**","detail":"A toast reads **Template created** or **Template saved**. A refused save names the field: **Cannot save — check …**.","src":"apps/web/src/routes/_next/fee-templates/$templateId.tsx:659"},{"action":"On the saved template's header, open **Review** → **Submit for review**","detail":"The **Review** menu only appears once the template has been saved.","src":"apps/web/src/routes/_next/fee-templates/$templateId.tsx:655"},{"action":"Reviewer: open **Approvals → Expense template**, tick the row and press **Approved** (or **Rejected**)","detail":"The queue is the template list in review mode, with the toolbar **Approved · Rejected · Refresh Page**. **Rejected** asks for a reason, which is optional.","src":"apps/web/src/components/review-queue.tsx:360"},{"action":"To revise a live card later, use the row actions on the list: **Duplicate** → edit the copy → submit and approve it → **Supersede** the old one","detail":"**Supersede** asks for **End validity on**: the old sheet stops applying after that date. Its rows, prices and approval stay untouched.","src":"apps/web/src/components/supersede-template-dialog.tsx:211"}],"fields":[{"label":"Template Name","required":true,"note":"e.g. Ocean Export Standard"},{"label":"Business Type","required":true,"note":"Trade the card prices"},{"label":"Fee Type","required":true,"note":"Selling Price or Cost"},{"label":"Client","required":false,"note":"Blank = standard tariff; set = that customer's deal"},{"label":"Valid From / Valid To","required":false,"note":"Dates bound which quotations the card prices"},{"label":"Billing unit columns","required":false,"note":"Not enforced by the form, but a selling row needs an amount in at least one column, so a selling card is unusable without one. Each unit must be unique and non-blank"},{"label":"Cost Name (per row)","required":true,"note":"Suggested from Cost items"},{"label":"Unit cells","required":false,"note":"Amount, blank (unpriced) or N/A"},{"label":"Min charge","required":false,"note":"Amount or blank"},{"label":"If any","required":false,"note":"Conditional charge; never carried onto an order"}],"writes":["fee_template row plus its billing units and fee lines","An audit submission; the template's audit status moves draft → pending → approved or rejected"],"result":"Once approved, the card shows in the quotation's **Reference Template** picker (step 6) and sets the price floor enforced at step 7.","pitfalls":["The **Reference Template** gate is declared but the seeded fee_template flow carries no gate row for it, so the server never refuses applying a draft card. Only the picker's default filter hides unapproved cards, and **Show all templates** reveals them.","An unapproved card enforces no floor, and the quotation shows **The tariff price floor is not enforcing anything on this quotation.**"],"shots":[{"file":"customer-intake-sop/shots/step-04.jpg","caption":"Fee Templates list","path":"/fee-templates"},{"file":"customer-intake-sop/shots/step-04-new.jpg","caption":"The template editor: Basic Information + the pivoted Fee Details grid","path":"/fee-templates"},{"file":"customer-intake-sop/shots/step-04-review.jpg","caption":"Expense template review queue","path":"/approve/template"}]},{"n":5,"role":"Sales · needs quotation:read + create","routes":[{"path":"/quotations","label":"Quotations ledger (Sales → Quotations)"},{"path":"/quotations/$quotationId","label":"Quotation editor (\"new\" before the first save)"}],"navigate":"Top nav **Sales** → **Quotations**","before":["Ideally the customer exists (step 2), so the client can be picked from the directory rather than typed."],"golden":[{"action":"Open **Sales → Quotations** and press **Add**","detail":"The editor opens titled **New Quote**. A one-line brief shows **Business type · Client · Route · Incoterm · Transit · Carrier · Validity · Entrusted**.","src":"apps/web/src/routes/_next/quotations/index.tsx:713"},{"action":"Press **All 27 fields + 16 services** to expand the header","detail":"The full header form opens under the brief.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:1641"},{"action":"Set **Business Type *** and optionally **Shipping Type**","detail":"Business type decides which templates the picker offers at step 6.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:1660"},{"action":"Pick **Client *** (\"Start typing to search the directory\")","detail":"Required: **Entrust unit is required**. Picking from the directory links the company record. A typed name that matches nothing saves as text only.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:285"},{"action":"Fill the lane: **Incoterms**, **Transit Term**, **Carrier**, **Port of Loading**, **Port of Destination**, **Route**","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:1757"},{"action":"Fill the schedule and validity: **Shipment Schedule**, **Voyage (Lowest)**, **Voyage (Highest)**, **Validity Start**, **Validity End**","detail":"Validity Start dates the quotation for the tariff lookup at step 7.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:1855"},{"action":"Add cargo facts as needed: **Cargo Value**, **Premium**, **UN No.**, **Class No.**, **Wharf**, **Product Name (CN)**, **Total Number Entrusted**, **Total Gross Weight (KGS)**, **Total Volume (CBM)**, **Whether Booking**","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:1939"},{"action":"Write customer-facing wording in **Annotation (shown to the customer)**","detail":"The staff-only note is **Quotation Remarks (internal — never printed)**, at the bottom below Estimated Profit.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:2076"},{"action":"Press **Save Quote** (top-right)","detail":"The first save allocates `NCT-Q-YYYYMM-####`, status **Draft**, audit status draft, and moves the URL to the new id.","src":"packages/api/src/quotation/values.ts:433"}],"fields":[{"label":"Business Type","required":true,"note":"Nine trades"},{"label":"Client (entrust unit)","required":true,"note":"Directory pick links the company"},{"label":"Incoterms / Transit Term / Carrier","required":false,"note":""},{"label":"Port of Loading / Port of Destination / Route","required":false,"note":""},{"label":"Validity Start / Validity End","required":false,"note":"Dates the tariff lookup"},{"label":"Annotation (shown to the customer)","required":false,"note":"Prints on the sheet"},{"label":"Quotation Remarks (internal — never printed)","required":false,"note":"Stripped from every export"}],"writes":["quotation row numbered NCT-Q-YYYYMM-####, status draft, audit status draft"],"result":"The quotation is saved with a number but no prices. Go straight on to **step 6** in the **Fee Details** card on the same page.","pitfalls":["The client box accepts a free-typed name, so a quotation can exist for a company that is not in the directory. Every document downstream then loses the address and tax ID."],"shots":[{"file":"customer-intake-sop/shots/step-05.jpg","caption":"Quotations ledger","path":"/quotations"},{"file":"customer-intake-sop/shots/step-05-new.jpg","caption":"The quotation header, expanded to all 27 fields","path":"/quotations"}]},{"n":6,"role":"Sales","routes":[{"path":"/quotations/$quotationId","label":"Quotation editor → Containers, Batches and Fee Details cards"}],"navigate":"**Sales → Quotations** → open the quotation","before":["The quotation is saved (step 5). The **Reference Template** dialog still opens over unsaved edits, but **Next** and **Apply** are disabled with **Save the quotation first**."],"golden":[{"action":"In **Containers**, press **Add Container** and set **Container Type** and **Qty** for each size","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:2193"},{"action":"If the cargo splits, press **Add Batch** and fill **Batch Name**, **Unpacking Address**, **Pickup Address**, **Delivery Address**","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:2286"},{"action":"In **Fee Details**, press **Reference Template**","detail":"The **Apply a Fee Template** dialog opens. Step 1 lists approved templates grouped, with the standard tariff always shown. Tick **Show all templates** to ignore business and shipping type.","src":"apps/web/src/components/reference-template-dialog.tsx:556"},{"action":"Choose the template, set **Apply lines as** to **Selling Price**, then press **Next**","src":"apps/web/src/components/reference-template-dialog.tsx:675"},{"action":"Tick the cells (charge × unit) you are quoting and press **Apply**","detail":"Only ticked cells are copied. On a saved quotation the lines are written server-side straight away (a toast reads **Template lines applied**) and the grid refreshes; on an unsaved one they are appended to the form.","src":"apps/web/src/components/reference-template-dialog.tsx:516"},{"action":"**Retype Qty on every applied line** to match your containers","detail":"Applied lines land at quantity 1 whatever the Containers card says, so 3×40HQ needs Qty 3.","src":"apps/web/src/components/reference-template-dialog.tsx:190"},{"action":"For anything not on the card, press **Add Line** and fill **Side**, **Segment**, **Cost Name**, **Currency**, **Charge Unit**, **Settlement Unit**, **Qty**, **Unit Price**","detail":"**Total**, **FX Rate**, **Local Amt.**, **Tax %** and **Taxes** compute on the row. Prices are tax-inclusive.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:3129"},{"action":"Add the buy side: lines with **Side = Cost**, and tick **Record cost** if the cost should be kept","detail":"Cost lines never go on the customer's sheet. The row flag reads **if any** — charge only if required.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:2403"},{"action":"Read each row's tariff hint and the header badge, then check **Estimated Profit (local currency)** at the foot","detail":"A price above tariff shows a delta. A price below tariff will be refused at step 7.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:2321"}],"fields":[{"label":"Container Type / Qty","required":false,"note":"Informs the brief's Entrusted count"},{"label":"Side","required":true,"note":"Selling Price or Cost"},{"label":"Segment","required":true,"note":"Template lines default to domestic"},{"label":"Cost Name","required":true,"note":"Suggested from Cost items"},{"label":"Currency","required":true,"note":"FX Rate is optional and seeded from the FX table"},{"label":"Qty / Unit Price","required":true,"note":"Total = Qty × Unit Price, floored by Min charge. Comm. % is optional"},{"label":"Tax %","required":true,"note":"Tax is embedded in the price, not added on top"},{"label":"if any","required":false,"note":"Conditional charge — never carried onto an order"}],"writes":["quotation_fee_line rows, each with provenance to the template it came from","quotation_container and batch rows"],"result":"The applied lines are already stored on a saved quotation; anything you typed by hand is not. Press **Save Quote** — that is **step 7**.","pitfalls":["Applied lines always land at quantity 1. The template never reads your container mix.","Nothing checks the cost side, so Estimated Profit is only as good as the buy prices you typed."],"shots":[{"file":"customer-intake-sop/shots/step-06.jpg","caption":"Containers, Batches and the Fee Details grid","path":"/quotations"}]},{"n":7,"role":"Sales","routes":[{"path":"/quotations/$quotationId","label":"Quotation editor → Save Quote"}],"navigate":"Same page as step 6","before":["An approved Selling Price template covers the lane (step 4); otherwise there is no floor to enforce."],"golden":[{"action":"Press **Save Quote**","detail":"The toast reads **Quote saved** and the tariff check re-runs against the stored quotation.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:725"},{"action":"If refused, read the red text under the offending rows","detail":"Each message reads **Line \"\u003ccharge — destination · unit>\" is below tariff: \u003ctyped> \u003c \u003cfloor>**. The whole save is refused, not just that line.","src":"packages/api/src/quotation/tariff-check.ts:457"},{"action":"Raise each flagged price to at least the floor, or remove the line, then save again","detail":"A price above tariff is allowed. The sanctioned way to charge less is an approved customer deal template.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:2354"},{"action":"Read the grey banner if it appears: **The tariff price floor is off on N of M selling lines**","detail":"It lists why: no approved price for this date, marked N/A, two tariffs that disagree, or added since the last save. Those lines are accepted at any price.","src":"apps/web/src/routes/_next/quotations/$quotationId.tsx:2567"}],"writes":["The updated fee lines, each with a stored price source"],"result":"The quotation is saved and within tariff. Next is **step 8**: submit it for review.","pitfalls":["Two approved sheets with the same start date that disagree leave a line \"ambiguous\", and it carries no floor.","Two spellings of one charge unit (40HQ vs 40 HQ) miss the tariff cell in the same way."],"shots":[{"file":"customer-intake-sop/shots/step-06.jpg","caption":"Save Quote runs the tariff floor against this grid","path":"/quotations"}]},{"n":8,"role":"Sales submits; a reviewer holding audit:read decides, routed by the open audit stage (the nav entry itself needs quotation:read)","routes":[{"path":"/quotations/$quotationId","label":"Submit for Review on the record"},{"path":"/approve/quotation","label":"Quotation
