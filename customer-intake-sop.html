<style>
:root {

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;

  --measure: 66ch;
  --gutter: 3.25rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0e1719;

    --surface-sunk:#101a1d;
    --ink:         #e6ebe7;
    --ink-soft:    #a9b8b8;
    --ink-faint:   #7b8c8c;
    --rule:        #24353a;
    --rule-strong: #35494e;
    --accent:      #e0a53f;
    --accent-soft: #3a2f16;
    --teal:        #6fb3ae;
    --teal-soft:   #17302f;
    --oxide:       #e08874;
    --oxide-soft:  #33201c;
    --oxide-edge:  #5c322b;
  }
}

:root[data-theme="dark"] {
  --ground:      #0e1719;
  --surface:     #142024;
  --surface-sunk:#101a1d;
  --ink:         #e6ebe7;
  --ink-soft:    #a9b8b8;
  --ink-faint:   #7b8c8c;
  --rule:        #24353a;
  --rule-strong: #35494e;
  --accent:      #e0a53f;
  --accent-soft: #3a2f16;
  --teal:        #6fb3ae;
  --teal-soft:   #17302f;
  --oxide:       #e08874;
  --oxide-soft:  #33201c;
  --oxide-edge:  #5c322b;
}

* { box-sizing: border-box; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 60rem;
  margin: 0 auto;
  padding: 4rem 1.5rem 6rem;
}

/* ── masthead ─────────────────────────────────────────── */

.masthead { display: flex; flex-direction: column; gap: 1.25rem; }

.eyebrow {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 1rem;
}
.eyebrow b { color: var(--accent); font-weight: 500; }

h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.1rem, 6vw, 3.4rem);
  line-height: 1.04;
  letter-spacing: -0.025em;
  text-wrap: balance;
  margin: 0;
}

.standfirst {
  max-width: var(--measure);
  font-size: 1.09rem;
  color: var(--ink-soft);
  margin: 0;
}
.standfirst strong { color: var(--ink); font-weight: 600; }

.chain-note {
  display: flex;
  gap: 0.85rem;
  align-items: baseline;
  max-width: var(--measure);
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  padding: 0.85rem 1.1rem;
  font-size: 0.95rem;
}
.chain-note .tag {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}

/* ── phase index ──────────────────────────────────────── */

.index {
  margin: 2.75rem 0 0;
  border-top: 1px solid var(--rule-strong);
  border-bottom: 1px solid var(--rule-strong);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
}
.index a {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  padding: 0.9rem 1rem 1rem;
  text-decoration: none;
  color: inherit;
  border-right: 1px solid var(--rule);
}
.index a:last-child { border-right: 0; }
.index a:hover { background: var(--surface-sunk); }
.index a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.index .k {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.index .n { font-family: var(--display); font-weight: 600; font-size: 0.97rem; }
.index .c {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

/* ── arrivals (the fan-in) ────────────────────────────── */

.arrivals { margin-top: 3.5rem; }
.arrivals > h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  margin: 0 0 0.4rem;
}
.arrivals > p.lede {
  max-width: var(--measure);
  color: var(--ink-soft);
  margin: 0 0 1.9rem;
}

/* ── flow chart ───────────────────────────────────────── */

.flow { display: grid; grid-template-columns: 1fr; gap: 1.35rem; }

.flow-diagram { overflow-x: auto; }
.flow-diagram svg { display: block; width: 100%; min-width: 25rem; height: auto; }

/* nodes */
.fnode { cursor: pointer; }
.fnode .box {
  fill: var(--surface);
  stroke: var(--rule-strong);
  stroke-width: 1;
}
.fnode .name {
  fill: var(--ink);
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
}
.fnode .sub {
  fill: var(--teal);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.fnode.homeless .sub { fill: var(--oxide); }
.fnode .dot { fill: var(--teal); }
.fnode.homeless .dot { fill: none; stroke: var(--oxide); stroke-width: 1.4; }

.fnode .box, .fnode .name { transition: fill 120ms ease, stroke 120ms ease; }
.fnode:hover .box, .fnode:focus-visible .box { stroke: var(--accent); stroke-width: 2; }
.fnode.on .box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.fnode:focus { outline: none; }
.fnode:focus-visible .box { stroke-dasharray: 4 3; }

/* connectors */
.fedge {
  fill: none;
  stroke: var(--rule-strong);
  stroke-width: 1.4;
  transition: stroke 120ms ease, stroke-width 120ms ease;
}
.fedge.dashed { stroke-dasharray: 5 4; stroke: var(--oxide-edge); }
.fedge.on { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: none; }

/* junctions */
.fjoin .pill {
  fill: var(--surface-sunk);
  stroke: var(--rule-strong);
  stroke-width: 1;
}
.fjoin .jlabel {
  fill: var(--ink-soft);
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.06em;
}
.fjoin.on .pill { fill: var(--accent-soft); stroke: var(--accent); }
.fjoin.on .jlabel { fill: var(--ink); }
.ftrunk { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.ftrunk-head { fill: var(--ink); }
.faxis {
  fill: var(--ink-faint);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}


/* ── fix browser: steps on the left, their defects on the right ──────── */

.fixbrowser {
  display: grid; grid-template-columns: minmax(0, 19rem) minmax(0, 1fr);
  gap: 0 2rem; align-items: start; margin-top: 1rem;
}
@media (max-width: 52rem) { .fixbrowser { grid-template-columns: minmax(0, 1fr); gap: 1rem; } }
.fx-steps {
  display: flex; flex-direction: column;
  border: 1px solid var(--rule); border-radius: 3px; background: var(--surface);
}
.fx-step {
  display: grid; grid-template-columns: 2.1rem minmax(0, 1fr) auto; align-items: baseline;
  gap: 0.1rem 0.5rem; text-align: left; padding: 0.5rem 0.7rem;
  background: none; border: 0; border-bottom: 1px solid var(--rule); cursor: pointer;
  font: inherit; color: var(--ink);
}
.fx-step:last-child { border-bottom: 0; }
.fx-step:hover { background: var(--surface-sunk); }
.fx-step[aria-current="true"] { background: var(--accent-soft); }
.fx-step .n { font: 700 0.72rem var(--mono); color: var(--ink-faint); }
.fx-step[aria-current="true"] .n { color: var(--accent); }
.fx-step .nm { font-size: 0.88rem; line-height: 1.3; }
.fx-step .ct {
  font: 500 0.66rem var(--mono); color: var(--oxide); white-space: nowrap;
}
.fx-step .ct.clear { color: var(--teal); }
.fx-step .ct.none { color: var(--ink-faint); }
.fx-detail { min-width: 0; }
.fx-head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.8rem;
  border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; margin-bottom: 0.9rem;
}
.fx-head h3 { font: 700 1.15rem var(--display); margin: 0; }
.fx-head .who {
  font: 0.7rem var(--mono); color: var(--ink-faint); letter-spacing: 0.08em;
  text-transform: uppercase; margin-left: auto;
}
.fx-head .who input {
  font: 0.72rem var(--mono); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 2px; padding: 0.1rem 0.3rem; width: 9rem;
}
.fx-card {
  background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--rule-strong);
  border-radius: 3px; padding: 0.85rem 1rem; margin-bottom: 0.9rem;
}
.fx-card.is-done { border-left-color: var(--teal); opacity: 0.72; }
.fx-card.k-money { border-left-color: var(--oxide); }
.fx-card.k-data { border-left-color: var(--accent); }
.fx-card.k-blocked { border-left-color: var(--teal); }
.fx-card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem; }
.fx-card-head h4 { font: 600 1rem/1.3 var(--display); margin: 0; flex: 1 1 16rem; }
.fx-card.is-done .fx-card-head h4 { text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.fx-tag {
  font: 500 0.62rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0.1rem 0.4rem; border-radius: 2px; background: var(--surface-sunk); color: var(--ink-faint);
}
.fx-tag.money { background: var(--oxide-soft); color: var(--oxide); }
.fx-tag.data { background: var(--accent-soft); color: var(--accent); }
.fx-tag.blocked { background: var(--teal-soft); color: var(--teal); }
.fx-tag.rank { background: var(--oxide-soft); color: var(--oxide); }
.fx-done { display: inline-flex; align-items: center; gap: 0.35rem; font: 0.72rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); cursor: pointer; }
.fx-done input { accent-color: var(--teal); width: 0.95rem; height: 0.95rem; }
.fx-card p { margin: 0.45rem 0 0; font-size: 0.92rem; max-width: 86ch; }
.fx-comments { max-width: 86ch; }
.fx-card .rep { color: var(--ink-soft); }
.fx-card .rep b, .fx-card .steps b {
  font: 500 0.62rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-faint); margin-right: 0.35rem;
}
.fx-card .src { font: 0.68rem var(--mono); color: var(--ink-faint); }
.fx-card .steps .chip { margin-right: 0.3rem; }
.fx-comments { margin-top: 0.8rem; border-top: 1px dashed var(--rule); padding-top: 0.6rem; }
.fx-comments ul { list-style: none; margin: 0 0 0.5rem; padding: 0; display: grid; gap: 0.4rem; }
.fx-comments li { font-size: 0.88rem; background: var(--surface-sunk); border-radius: 3px; padding: 0.4rem 0.55rem; }
.fx-comments li { position: relative; padding-right: 4.5rem; }
.fx-comments li .meta { font: 0.65rem var(--mono); color: var(--ink-faint); letter-spacing: 0.06em; display: block; }
.fx-comments li .body { display: block; white-space: pre-wrap; }
.fx-del {
  position: absolute; top: 0.35rem; right: 0.4rem;
  font: 0.62rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-faint); background: none; border: 0; padding: 0.1rem 0.2rem; cursor: pointer;
}
.fx-del:hover { color: var(--oxide); }
.fx-del.armed { color: var(--oxide); font-weight: 700; }
.fx-media-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.45rem; }
.fx-media { margin: 0; }
.fx-media img, .fx-media video {
  display: block; max-width: min(26rem, 100%); max-height: 18rem;
  border: 1px solid var(--rule); border-radius: 3px; background: var(--ground);
}
.fx-tray { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.45rem; }
.fx-chip-file {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font: 0.72rem var(--mono); color: var(--ink-soft);
  background: var(--surface-sunk); border: 1px solid var(--rule); border-radius: 2px;
  padding: 0.15rem 0.35rem; max-width: 14rem;
}
.fx-chip-file img { width: 1.4rem; height: 1.4rem; object-fit: cover; border-radius: 2px; }
.fx-chip-file button { background: none; border: 0; color: var(--ink-faint); cursor: pointer; padding: 0; font-size: 0.8rem; }
.fx-chip-file button:hover { color: var(--oxide); }
.fx-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.fx-attach {
  font: 600 0.78rem var(--display); color: var(--ink); background: var(--surface-sunk);
  border: 1px solid var(--rule-strong); border-radius: 2px; padding: 0.35rem 0.7rem; cursor: pointer;
  white-space: nowrap;
}
.fx-attach:hover { border-color: var(--ink-faint); }
.fx-comments .empty { font-size: 0.84rem; color: var(--ink-faint); margin: 0 0 0.5rem; }
.fx-comment-form { display: flex; gap: 0.4rem; }
.fx-comment-form input {
  flex: 1 1 auto; min-width: 0; font: 0.88rem var(--body); color: var(--ink);
  background: var(--ground); border: 1px solid var(--rule-strong); border-radius: 2px; padding: 0.35rem 0.5rem;
}
.fx-comment-form button {
  font: 600 0.78rem var(--display); color: var(--surface); background: var(--ink);
  border: 0; border-radius: 2px; padding: 0.35rem 0.8rem; cursor: pointer;
}
.fx-comment-form button:disabled { opacity: 0.45; cursor: default; }
.fx-empty { color: var(--ink-soft); border-left: 3px solid var(--teal); padding-left: 0.8rem; }
.sm-fixes .fx-done { margin-top: 0.3rem; }
.sm-fixes-open { margin: 0.6rem 0 0; }
.sm-fixes-open button {
  font: 0.8rem var(--body); color: var(--oxide); background: none; border: 0;
  border-bottom: 1px solid var(--oxide-edge); padding: 0; cursor: pointer;
}
.sm-fixes .cmt { font: 0.66rem var(--mono); color: var(--ink-faint); margin-left: 0.5rem; }
@media print { .fixbrowser { display: none; } .gaps[hidden] { display: block !important; } }

@media (prefers-reduced-motion: reduce) {
  .fnode .box, .fnode .name, .fedge { transition: none; }
}

/* detail panel */
.flow-detail {
  border: 1px solid var(--rule-strong);
  border-left: 3px solid var(--accent);
  background: var(--surface);
  padding: 1.15rem 1.4rem 1.3rem;
  min-height: 10rem;
}
.flow-detail .d-home {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--teal);
  display: block;
  margin-bottom: 0.3rem;
}
.flow-detail.homeless .d-home { color: var(--oxide); }
.flow-detail h3 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.22rem;
  letter-spacing: -0.012em;
  margin: 0 0 0.7rem;
}
/* the panel is full width, so let its paragraphs sit side by side rather than
   running one 90-character line across the page */
#d-body { display: flex; flex-wrap: wrap; gap: 0.75rem 2.25rem; }
#d-body > p { flex: 1 1 26rem; max-width: 42rem; }
.flow-detail p { margin: 0; font-size: 0.95rem; color: var(--ink-soft); }
.flow-detail strong { color: var(--ink); font-weight: 600; }
.flow-detail em { font-style: italic; }
.flow-detail .d-join {
  margin-top: 1rem;
  padding-top: 0.8rem;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.72rem;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}
.flow-detail .d-join .lbl {
  font-size: 0.63rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.flow-detail .d-join a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-soft);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.flow-detail .d-join a:hover { border-bottom-color: var(--accent); }

.flow-hint {
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0.85rem 0 0;
}

/* print: the panel can only hold one channel, so print them all */
.flow-print { display: none; }
@media print {
  .flow { display: block; }
  .flow-detail, .flow-hint { display: none; }
  .flow-print { display: block; margin-top: 1.5rem; }
  .flow-print .pc { break-inside: avoid; margin-bottom: 0.9rem; }
  .flow-print .pc b { font-family: var(--display); }
}

.converge {
  display: grid;
  grid-template-columns: 11rem 1fr;
  gap: 0 1.5rem;
  border-top: 2px solid var(--ink);
  padding-top: 0.9rem;
  margin-top: 0;
}
.converge .arrow {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding-left: 1.15rem;
}
.converge p { margin: 0; max-width: var(--measure); font-size: 0.95rem; color: var(--ink-soft); }
.converge strong { color: var(--ink); font-weight: 600; }

@media (max-width: 46rem) {
  .converge { grid-template-columns: 1fr; gap: 0.5rem; }
  .converge .arrow { padding-left: 1.15rem; }
}

/* ── whole-chain map ──────────────────────────────────── */

.map { margin-top: 4rem; }
.map > h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  margin: 0 0 0.4rem;
}
.map > p.lede { max-width: var(--measure); color: var(--ink-soft); margin: 0 0 1.5rem; }

.map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.5rem;
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 1.1rem;
}
.map-legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
.map-legend i { display: inline-block; width: 1.4rem; height: 0; border-top: 1.6px solid var(--rule-strong); }
.map-legend i.sev {
  border-top: 0;
  width: 1.5rem;
  height: 0.7rem;
  position: relative;
  align-self: center;
}
.map-legend i.sev::before, .map-legend i.sev::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 0.42rem;
  border-top: 1.6px solid var(--rule-strong);
}
.map-legend i.sev::before { left: 0; }
.map-legend i.sev::after { right: 0; }
.map-legend i.sev b {
  position: absolute;
  top: 0;
  left: 50%;
  width: 0;
  height: 100%;
  border-left: 2px solid var(--oxide);
  box-shadow: 3px 0 0 -1px var(--oxide);
}

/* The chart needs more room than the reading column, so this section alone
   breaks out of the 60rem wrap and centres a wider block. */
/* The chart's own coordinate space is 1426 units wide. Put the pane beside it
   and the chart gets whatever is left — below about 1680px of window that
   scales the 11.5px node titles under 8px, so the two only sit side by side
   when there is genuinely room. Otherwise they stack and the chart keeps the
   full width. */
.chain {
  width: min(98vw, 118rem);
  margin-left: 50%;
  transform: translateX(-50%);
  display: grid;
  gap: 1.3rem;
}
@media (min-width: 1680px) {
  .chain {
    grid-template-columns: minmax(0, 1fr) 23rem;
    gap: 0 1.75rem;
    align-items: start;
  }
  .chain-pane { position: sticky; top: 1.5rem; min-height: 0; max-height: calc(100vh - 3rem); overflow-y: auto; }
}

.chain-canvas {
  overflow-x: auto;
  border: 1px solid var(--rule);
  background: var(--surface);
  padding: 0.5rem 0.25rem;
}
.chain-canvas svg { display: block; width: 100%; min-width: 62rem; height: auto; }

/* ── nodes ── */
.cn { cursor: pointer; }
.cn .bx { fill: var(--surface); stroke: var(--rule-strong); stroke-width: 1; transition: fill 110ms, stroke 110ms; }
.cn .nm { fill: var(--accent); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; }
.cn .tl { fill: var(--ink); font-family: var(--display); font-weight: 600; font-size: 11.5px; }
.cn:hover .bx, .cn:focus-visible .bx { stroke: var(--accent); stroke-width: 2; }
.cn.on .bx { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.cn:focus { outline: none; }
/* off-trunk: setup, monthly — not part of one shipment's path */
.cn.aside .bx { stroke-dasharray: 4 3; fill: var(--surface-sunk); }
.cn.aside.on .bx { stroke-dasharray: none; }
/* the two steps most often missed */
.cn.pitfall .bx { stroke: var(--accent); }
.cn.pitfall .ring { fill: none; stroke: var(--accent); stroke-width: 1; }

/* ── edges ── */
.ce { fill: none; stroke: var(--rule-strong); stroke-width: 1.5; }
.ce-head { fill: var(--rule-strong); }
.ce.thin { stroke-width: 1.2; }
.ce.dash { stroke-dasharray: 5 4; stroke: var(--rule-strong); }
.ce.reject { stroke: var(--teal); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ce-head.reject { fill: var(--teal); }
.ce.entry { stroke: var(--teal); stroke-width: 1.5; }
.ce-head.entry { fill: var(--teal); }

.elab {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  fill: var(--ink-faint);
}
.elab.teal { fill: var(--teal); }
.elab.oxide { fill: var(--oxide); }

/* ── severed hand-offs ── */
.cb { cursor: pointer; }
.cb .stub { fill: none; stroke: var(--rule-strong); stroke-width: 1.5; }
.cb .cut { stroke: var(--oxide); stroke-width: 2; stroke-linecap: round; }
.cb .hit { fill: transparent; }
.cb:hover .cut, .cb:focus-visible .cut { stroke-width: 3; }
.cb.on .cut { stroke-width: 3.4; }
.cb:focus { outline: none; }

/* ── terminals ── */
.term .tb { fill: var(--oxide-soft); stroke: var(--oxide); stroke-width: 1; stroke-dasharray: 4 3; }
.term .tt { fill: var(--oxide); font-family: var(--display); font-weight: 600; font-size: 11px; }

/* ── phase gutter ── */
.pg .pl { fill: var(--accent); font-family: var(--display); font-weight: 700; font-size: 15px; }
.pg .pn { fill: var(--ink); font-family: var(--display); font-weight: 600; font-size: 12px; }
.pg .pw {
  fill: var(--ink-faint);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.pg .prl { stroke: var(--rule); stroke-width: 1; }

@media (prefers-reduced-motion: reduce) { .cn .bx { transition: none; } }

/* ── detail pane, full width under the chart ── */
.chain-pane {
  border: 1px solid var(--rule-strong);
  border-left: 3px solid var(--accent);
  background: var(--surface);
  padding: 1.3rem 1.5rem 1.45rem;
  min-height: 15rem;
}
.chain-pane.on-break { border-left-color: var(--oxide); background: var(--oxide-soft); }

.cp-phase {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 0.5rem;
  padding-bottom: 0.6rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.cp-phase b { font-family: var(--display); font-size: 0.8rem; color: var(--accent); letter-spacing: 0; }
.cp-phase .pn { color: var(--ink-soft); }
.cp-phase .pw { margin-left: auto; }

.cp-num {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  display: block;
  margin-bottom: 0.25rem;
}
.chain-pane.on-break .cp-num { color: var(--oxide); }

/* the pane renders a CLONE of the real step article, so it inherits .step
   typography — these rules only undo the spine's two-column grid */
.chain-pane .step { display: block; padding: 0; grid-template-columns: none; }
.chain-pane .step .num { display: none; }
.chain-pane .step h3 { font-size: 1.3rem; margin-bottom: 0.35rem; }
.chain-pane .step .where { font-size: 0.78rem; margin-bottom: 0.7rem; }
/* wide pane: what-it-does and what-to-watch share the row */
.chain-pane .cp-cols { display: flex; flex-wrap: wrap; gap: 0.9rem 2.5rem; align-items: start; }
.chain-pane .cp-cols > .cp-what { flex: 1 1 26rem; max-width: 44rem; }
.chain-pane .cp-cols > .watch { flex: 1 1 24rem; margin-top: 0; }
.chain-pane .break { display: block; padding: 1.15rem 0 0; margin-top: 1.15rem; }
.chain-pane .break .mark { display: none; }
.chain-pane .break .body { max-width: 48rem; background: var(--oxide-soft); border-left: 3px solid var(--oxide); }
.chain-pane.on-break .break { margin-top: 0; padding-top: 0; }
.chain-pane.on-break .break .body { background: transparent; border-left: 0; padding-left: 0; }

.cp-open {
  margin-top: 1.2rem;
  padding-top: 0.8rem;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.72rem;
}
.cp-open a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
.cp-open a:hover { border-bottom-color: var(--accent); }
.chain-pane.on-break .cp-open a { color: var(--oxide); border-bottom-color: var(--oxide-edge); }

/* ── role view (only when sop-data has roles[]): rail left of the chart,
      a select above it on narrow screens, lit/faded nodes, "My flow" pane ── */
.chain.has-roles { grid-template-columns: 11.5rem minmax(0, 1fr); gap: 1.3rem 1.25rem; align-items: start; }
.chain.has-roles > .role-rail { grid-column: 1; grid-row: 1 / span 2; }
.chain.has-roles > .chain-canvas { grid-column: 2; grid-row: 1; }
.chain.has-roles > .chain-pane { grid-column: 2; grid-row: 2; }
@media (min-width: 1680px) {
  .chain.has-roles { grid-template-columns: 11.5rem minmax(0, 1fr) 23rem; gap: 0 1.5rem; }
  .chain.has-roles > .role-rail { grid-row: 1; }
  .chain.has-roles > .chain-pane { grid-column: 3; grid-row: 1; }
}
.role-rail { position: sticky; top: 1.5rem; border-top: 2px solid var(--ink); padding-top: 0.55rem; }
.role-rail .rr-head, .role-select label {
  font: 600 0.65rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint);
}
.role-rail .rr-head { margin: 0 0 0.45rem; }
.role-rail .rr-list { display: flex; flex-direction: column; gap: 0.2rem; }
.rr-btn {
  display: flex; align-items: baseline; gap: 0.5rem; width: 100%; text-align: left;
  font: 600 0.85rem/1.25 var(--display); color: var(--ink-soft); background: transparent;
  border: 1px solid transparent; border-left: 3px solid transparent; border-radius: 2px;
  padding: 0.4rem 0.5rem; cursor: pointer;
}
.rr-btn .nm { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.rr-btn .ct { font: 0.7rem var(--mono); color: var(--ink-faint); }
.rr-btn .sw { width: 0.55rem; height: 0.55rem; border-radius: 50%; flex: 0 0 auto; align-self: center; background: var(--rr, var(--rule-strong)); }
.rr-btn:hover { background: var(--surface); border-color: var(--rule); color: var(--ink); }
.rr-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rr-btn[aria-pressed="true"] { background: var(--accent-soft); border-left-color: var(--accent); color: var(--ink); }
.rr-btn[aria-pressed="true"] .ct { color: var(--ink-soft); }
.role-select { display: none; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin: 0 0 0.9rem; }
.role-select select {
  flex: 1 1 12rem; min-width: 0; max-width: 100%;
  font: 600 0.9rem var(--display); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 2px; padding: 0.45rem 0.5rem;
}
.role-select select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 52rem) {
  .role-select { display: flex; }
  .chain.has-roles { grid-template-columns: minmax(0, 1fr); }
  .chain.has-roles > .role-rail { display: none; }
  .chain.has-roles > .chain-canvas, .chain.has-roles > .chain-pane { grid-column: 1; }
}
.chain.role-on #chain-svg > g:first-child > :not(.pg), .chain.role-on #chain-svg > .cb,
.chain.role-on #chain-svg > g:nth-child(2) > :not(.cn) { opacity: 0.3; }
.chain.role-on .cn.role-fade { opacity: 0.3; }
.chain.role-on .cn.role-lit .bx { stroke: var(--teal); stroke-width: 2.4; fill: var(--teal-soft); }
.chain.role-on .cn.role-watch .bx { stroke: var(--teal); stroke-dasharray: 3 3; }
.chain.role-on .cn.role-lit.on .bx, .chain.role-on .cn.role-watch.on .bx { stroke: var(--accent); fill: var(--accent-soft); }

.rf-sum { font: 0.78rem var(--mono); color: var(--ink-faint); margin: 0 0 0.9rem; }
.rf-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.rf-step button {
  display: grid; grid-template-columns: 2.1rem minmax(0, 1fr) auto; align-items: baseline; gap: 0.5rem;
  width: 100%; text-align: left; background: transparent; color: var(--ink);
  border: 1px solid var(--rule); border-radius: 2px; padding: 0.5rem 0.6rem; cursor: pointer;
  font: 600 0.9rem/1.3 var(--display);
}
.rf-step button:hover, .rf-step button.on { border-color: var(--accent); background: var(--accent-soft); }
.rf-step button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rf-step .n { font: 0.72rem var(--mono); color: var(--accent); }
.rf-step .t { min-width: 0; overflow-wrap: anywhere; }
.rf-part {
  font: 500 0.6rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--teal); background: var(--teal-soft); border-radius: 2px; padding: 0.1rem 0.35rem; white-space: nowrap;
}
.rf-hand {
  font: 0.76rem/1.4 var(--mono); color: var(--ink-soft); background: var(--surface-sunk);
  border-left: 3px solid var(--teal); padding: 0.4rem 0.6rem; margin: 0.15rem 0 0.15rem 1.2rem; overflow-wrap: anywhere;
}
.rf-hand b { font-family: var(--display); font-weight: 600; color: var(--ink); }
.rf-hand.out { border-left-color: var(--accent); }
.rf-empty { font-size: 0.9rem; color: var(--ink-faint); }
.sm-rolepart { font: 0.72rem var(--mono); letter-spacing: 0.06em; color: var(--teal); margin-top: 0.3rem; }
.sm-rolepart b { font-family: var(--display); font-weight: 600; }

@media print { .chain { display: none; } .role-select { display: none; } }

/* ── the document ─────────────────────────────────────── */

.doc-head {
  margin-top: 4.5rem;
  padding-top: 1.6rem;
  border-top: 2px solid var(--ink);
}
.doc-head h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  margin: 0 0 0.4rem;
}
.doc-head p.lede { max-width: var(--measure); color: var(--ink-soft); margin: 0; }

.doc-head-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.6rem 1.25rem;
  margin-bottom: 0.4rem;
}
.doc-head-row h2 { margin-bottom: 0; }

.doc-toggle {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: none;
  border: 1px solid var(--accent);
  border-radius: 2px;
  padding: 0.4rem 0.85rem;
  cursor: pointer;
}
.doc-toggle:hover { background: var(--accent-soft); }
.doc-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* The spine must stay IN the DOM while hidden — the chart and the detail pane
   are built from it. [hidden] only takes it off screen. */
.doc-body[hidden] { display: none; }

/* ── phases ───────────────────────────────────────────── */

.phase { margin-top: 3.5rem; }
.doc-body > .phase:first-of-type { margin-top: 2.25rem; }

/* paper gets the whole document, open or not */
@media print {
  .doc-body[hidden] { display: block !important; }
  .doc-toggle { display: none; }
}

.phase-head {
  display: grid;
  grid-template-columns: var(--gutter) 1fr;
  align-items: baseline;
  gap: 0 1.25rem;
  padding-bottom: 0.7rem;
  border-bottom: 2px solid var(--ink);
}
.phase-head .letter {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--accent);
  line-height: 1;
}
.phase-head h2 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
  margin: 0;
}
.phase-head .who {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  grid-column: 2;
}

/* ── the spine ────────────────────────────────────────── */

.step {
  display: grid;
  grid-template-columns: var(--gutter) 1fr;
  gap: 0 1.25rem;
  padding: 1.4rem 0 1.5rem;
}

/* the gutter cell draws the spine; a break row simply omits it */
.step .num {
  position: relative;
  font-family: var(--mono);
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  padding-top: 0.16rem;
}
.step .num::before {
  content: "";
  position: absolute;
  left: 0.62rem;
  top: 1.9rem;
  bottom: -1.5rem;
  width: 2px;
  background: var(--rule-strong);
}
.step:last-child .num::before { display: none; }

.step h3 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.09rem;
  letter-spacing: -0.008em;
  margin: 0 0 0.3rem;
  text-wrap: balance;
}
.step .where {
  font-family: var(--mono);
  font-size: 0.76rem;
  color: var(--teal);
  margin: 0 0 0.55rem;
  overflow-wrap: anywhere;
}
.step p.what {
  margin: 0;
  max-width: var(--measure);
  color: var(--ink-soft);
}
.step p.what strong { color: var(--ink); font-weight: 600; }

.watch {
  margin-top: 0.7rem;
  max-width: var(--measure);
  font-size: 0.92rem;
  color: var(--ink-soft);
  display: flex;
  gap: 0.7rem;
}
.watch .tag {
  font-family: var(--mono);
  font-size: 0.63rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
  padding-top: 0.22rem;
}

/* ── chain break: the spine is interrupted ────────────── */

.break {
  display: grid;
  grid-template-columns: var(--gutter) 1fr;
  gap: 0 1.25rem;
  padding: 0.35rem 0 1.35rem;
}
.break .mark {
  position: relative;
  color: var(--oxide);
  font-family: var(--mono);
  font-size: 1.05rem;
  line-height: 1;
  padding-top: 0.55rem;
  text-align: left;
}
.break .body {
  border-left: 3px solid var(--oxide);
  background: var(--oxide-soft);
  padding: 0.8rem 1.1rem 0.9rem;
  max-width: var(--measure);
}
.break .between {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--oxide);
  display: block;
  margin-bottom: 0.35rem;
}
.break p { margin: 0; font-size: 0.95rem; color: var(--ink-soft); }
.break p + p { margin-top: 0.5rem; }

code {
  font-family: var(--mono);
  font-size: 0.85em;
  background: var(--surface-sunk);
  padding: 0.08em 0.34em;
  border-radius: 2px;
  overflow-wrap: anywhere;
}
.break code { background: color-mix(in srgb, var(--oxide-soft) 55%, transparent); }

/* ── gap ledger ───────────────────────────────────────── */

/* The one section that breaks the measure: a two-pane browser wants the
   whole window, not the 60rem column the prose is set in. */
.ledger {
  margin-top: 4.5rem;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  padding: 0 clamp(1.5rem, 4vw, 4rem);
}
.ledger > .doc-head-row, .ledger > p.lede, .ledger > .gap-progress { max-width: 60rem; }
.ledger > h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  margin: 0 0 0.4rem;
}
.ledger > p.lede {
  max-width: var(--measure);
  color: var(--ink-soft);
  margin: 0 0 1.75rem;
}
.gap-progress {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 0.9rem;
}
.gap-progress #gap-count { color: var(--accent); font-variant-numeric: tabular-nums; }
.gap-sync { color: var(--ink-faint); text-transform: none; letter-spacing: 0.04em; }
/* template: shown only outside claude.ai, where there is no shared store */
.gap-local {
  font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.06em; text-transform: none;
  color: var(--ink-faint); border: 1px solid var(--rule); border-radius: 2px; padding: 0.05rem 0.4rem;
}

.gaps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); }
.gaps li {
  display: grid;
  grid-template-columns: 1.6rem 2.2rem 1fr;
  gap: 0 0.85rem;
  padding: 1rem 0;
  border-bottom: 1px solid var(--rule);
  align-items: start;
}

/* checkbox */
.gaps .tick { position: relative; display: block; padding-top: 0.1rem; cursor: pointer; }
.gaps .tick input {
  position: absolute;
  width: 1.05rem;
  height: 1.05rem;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.gaps .tick .box {
  display: block;
  width: 1.05rem;
  height: 1.05rem;
  border: 1.5px solid var(--rule-strong);
  border-radius: 2px;
  background: var(--surface);
}
.gaps .tick input:hover + .box { border-color: var(--accent); }
.gaps .tick input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.gaps .tick input:checked + .box {
  background: var(--accent);
  border-color: var(--accent);
}
.gaps .tick input:checked + .box::after {
  content: "";
  display: block;
  width: 0.3rem;
  height: 0.58rem;
  margin: 0.05rem auto 0;
  border: solid var(--ground);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.gaps .rank {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--oxide);
  font-variant-numeric: tabular-nums;
  padding-top: 0.15rem;
}
.gaps .txt { max-width: var(--measure); }
.gaps .txt b {
  font-family: var(--display);
  font-weight: 600;
  font-size: 1rem;
  display: block;
  margin-bottom: 0.18rem;
}
.gaps .txt .body { color: var(--ink-soft); font-size: 0.95rem; display: block; }
/* found by the September audit, not the original mapping */
.gaps .new-tag {
  font-family: var(--mono);
  font-style: normal;
  font-weight: 500;
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--oxide);
  border: 1px solid var(--oxide-edge);
  border-radius: 2px;
  padding: 0.05rem 0.3rem;
  margin-left: 0.4rem;
  vertical-align: 0.15em;
}
.gaps li.done .new-tag { color: var(--ink-faint); border-color: var(--rule); }
/* optional ledger severity (same scale as step fixes) and code evidence */
.gaps .sev-tag { font-style: normal; font-size: 0.58rem; margin-left: 0.4rem; vertical-align: 0.15em; }
.gaps .txt .src { display: block; font: 0.68rem var(--mono); color: var(--ink-faint); margin-top: 0.3rem; overflow-wrap: anywhere; }
.gaps li.done .sev-tag { background: var(--surface-sunk); color: var(--ink-faint); }
/* file:line evidence is one long unbroken token: let it break anywhere, and let
   the grid/flex boxes that hold it shrink below its width, or it overflows at 400px */
.src, .fx-card .src, .sm-golden .src, .sm-local .src { overflow-wrap: anywhere; word-break: break-word; min-width: 0; }
.fx-card, .sm-fixes li, .sm-fixes li > *, .sm-golden li, .gaps .txt { min-width: 0; }

/* done rows recede but stay readable */
.gaps li.done .rank { color: var(--ink-faint); }
.gaps li.done .txt b { color: var(--ink-faint); text-decoration: line-through; text-decoration-thickness: 1px; }
.gaps li.done .txt .body { color: var(--ink-faint); }

/* which part of the chain this repairs */
.fixes {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem 0.4rem;
  margin-top: 0.55rem;
}
.fixes i {
  font-family: var(--mono);
  font-style: normal;
  font-size: 0.6rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-right: 0.15rem;
}
.chip {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.04em;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid transparent;
  border-radius: 2px;
